<style>
/* Layout: one 980px column in three numbered parts, how wine is made, the grapes, the regions,
   under a strip of the colours wine takes in the glass. Paper and garnet ink like a cellar
   atlas; the map is the one full-width object, sea in a cool grey under warm land. Colour
   carries meaning in two places only: the colour of each style of wine (validated as a set in
   both modes), and the garnet of the regions on the map. */
:root {
  --bg: #F5F1EA;            /* atlas paper */
  --surface: #FCFAF6;
  --fg: #231A1C;            /* ink with a wine bias */
  --muted: #6B6163;
  --rule: #DED6CB;
  --rule-strong: #A99F96;
  --accent: #8E1F35;        /* garnet: links, focus, selection, the regions on the map */
  --accent-soft: #F1DDE0;
  /* the map */
  --sea: #E2E8EB; --land: #E8E1D4; --land-edge: #C7BCAC; --lake: #E2E8EB;
  --river: #9AB0BE; --border-line: #ADA192; --belt: rgba(142, 31, 53, 0.075);
  --dot: #8E1F35; --spot: #4E4547; --city: #84797B; --halo: rgba(245, 241, 234, 0.92);
  /* the colour of each style of wine; checked as a set for colour-blind and normal-vision separation */
  --w-white: #C9A227; --w-rose: #E8829F; --w-red: #96203F; --w-amber: #C06212;
  --font-cjk: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", "SimSun", serif;
  --font-latin: "EB Garamond", "Garamond", "Iowan Old Style", "Times New Roman", serif;
  --font-body: "IBM Plex Sans", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16131A; --surface: #1E1A22; --fg: #ECE6DF; --muted: #A0969A; --rule: #312B34; --rule-strong: #5A525C;
    --accent: #E0667A; --accent-soft: #3B2228;
    --sea: #171B21; --land: #2B2630; --land-edge: #433B48; --lake: #171B21;
    --river: #46606F; --border-line: #5F5563; --belt: rgba(224, 102, 122, 0.08);
    --dot: #E0667A; --spot: #D9D1CB; --city: #9A9094; --halo: rgba(22, 19, 26, 0.9);
    --w-white: #B0902C; --w-rose: #D07090; --w-red: #A52F47; --w-amber: #CC7026;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16131A; --surface: #1E1A22; --fg: #ECE6DF; --muted: #A0969A; --rule: #312B34; --rule-strong: #5A525C;
  --accent: #E0667A; --accent-soft: #3B2228;
  --sea: #171B21; --land: #2B2630; --land-edge: #433B48; --lake: #171B21;
  --river: #46606F; --border-line: #5F5563; --belt: rgba(224, 102, 122, 0.08);
  --dot: #E0667A; --spot: #D9D1CB; --city: #9A9094; --halo: rgba(22, 19, 26, 0.9);
  --w-white: #B0902C; --w-rose: #D07090; --w-red: #A52F47; --w-amber: #CC7026;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); scroll-padding-top: 56px; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
h1, h2, h3, p, ol, ul, dl, dd, figure { margin: 0; }
ol, ul { padding: 0; list-style: none; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.page {
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
.lang-zh .en-only, .lang-en .zh-only { display: none; }
.latin { font-family: var(--font-latin); font-style: italic; }

/* header, shared with the other pages of the site */
.home { display: inline-block; margin-bottom: 8px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
.home:hover, .home:focus-visible { color: var(--fg); }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--rule-strong); }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand .name { font-family: var(--font-cjk); font-weight: 900; font-size: 21px; letter-spacing: 0.06em; }
.brand .name-latin { font-family: var(--font-latin); font-style: italic; font-size: 22px; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--muted); margin-top: 4px; }
.tools { display: flex; align-items: center; gap: 8px; flex: none; }
.pill {
  appearance: none; border: 1px solid var(--rule-strong); border-radius: 999px; background: transparent; color: var(--muted);
  font: 500 12px/1 var(--font-body); padding: 7px 11px; cursor: pointer; letter-spacing: 0.04em;
}
.pill[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.lang { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 999px; overflow: hidden; }
.lang button { appearance: none; border: 0; background: transparent; color: var(--muted); font: 500 12px/1 var(--font-body); padding: 7px 11px; cursor: pointer; letter-spacing: 0.04em; }
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* the three parts, kept in reach while scrolling */
.toc {
  position: sticky; top: 0; z-index: 20; display: flex; gap: 4px 22px; flex-wrap: wrap;
  margin: 0 -16px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--rule);
}
.toc a { display: inline-flex; align-items: baseline; gap: 7px; text-decoration: none; color: var(--muted); font-weight: 500; font-size: 14.5px; }
.toc a b { font: 500 11px/1 var(--font-mono); }
.toc a:hover, .toc a.on { color: var(--fg); }
.toc a.on b { color: var(--accent); }

/* hero: what terroir means, over the colours of wine */
.hero { padding-block: 34px 6px; }
.hero h1 { font-weight: 900; line-height: 1.12; letter-spacing: 0.02em; text-wrap: balance; }
.lang-zh .hero h1 { font-family: var(--font-cjk); font-size: clamp(34px, 7vw, 54px); }
.lang-en .hero h1 { font-family: var(--font-latin); font-weight: 500; font-size: clamp(38px, 7.5vw, 60px); letter-spacing: -0.01em; line-height: 1.05; }
.hero .lead { margin-top: 16px; max-width: 40em; font-size: 17.5px; line-height: 1.7; }
.lang-en .hero .lead { font-size: 17px; }
.colours { margin-top: 28px; }
.colours-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.cstrip { display: flex; gap: 10px; }
.cgroup { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cgroup .cg-name { font-size: 12.5px; font-weight: 600; }
.cbar { display: flex; gap: 2px; height: clamp(40px, 8vw, 64px); }
.cbar span { flex: 1 1 0; min-width: 0; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06); }
.cnames { display: flex; gap: 2px; }
.cnames span { flex: 1 1 0; min-width: 0; text-align: center; font-size: 11.5px; color: var(--muted); line-height: 1.3; overflow-wrap: anywhere; }
.colours .cap { margin-top: 12px; font-size: 13.5px; color: var(--muted); max-width: 62em; }
@media (max-width: 600px) {
  .lang-zh .cnames span { writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 0.08em; line-height: 1; display: flex; justify-content: center; }
  .lang-en .cnames { display: none; }
}

/* parts */
.part { padding-top: 46px; }
.part-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px solid var(--rule-strong); }
.part-h .no { font: 500 13px/1 var(--font-mono); color: var(--accent); }
.part-h h2 { font-size: 26px; line-height: 1.2; }
.lang-zh .part-h h2 { font-family: var(--font-cjk); font-weight: 900; letter-spacing: 0.08em; }
.lang-en .part-h h2 { font-family: var(--font-latin); font-weight: 500; font-size: 30px; }
.part-h .other { font-family: var(--font-latin); font-style: italic; font-size: 17px; color: var(--muted); }
.lang-en .part-h .other { font-family: var(--font-cjk); font-style: normal; font-weight: 600; font-size: 15px; }
.part .intro { margin-top: 14px; max-width: 42em; font-size: 15.5px; color: var(--fg); }
.label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.lang-zh .label { letter-spacing: 0.16em; }

/* 1. how wine is made */
.make-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px; margin-top: 22px; }
@media (max-width: 760px) { .make-top { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.card h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
.eq { display: grid; gap: 12px; }
.eq .f { font-family: var(--font-mono); font-size: 14.5px; font-weight: 500; letter-spacing: 0.01em; overflow-wrap: anywhere; }
.eq .f sub { font-size: 0.72em; line-height: 0; }
.eq .w { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.eq .w b { color: var(--fg); font-weight: 600; }
.chem-note { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 13.5px; color: var(--muted); display: grid; gap: 8px; }
.chem-note .n { font-family: var(--font-mono); font-size: 12.5px; color: var(--fg); }

/* skin contact: one row per style, a range bar on a log time axis */
.skin .sub { font-size: 13px; color: var(--muted); margin: -4px 0 12px; }
.srow { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 5px 0; }
.lang-en .srow { grid-template-columns: 8.5rem minmax(0, 1fr); }
.srow .nm { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
.srow .nm span { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.track { position: relative; height: 22px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--rule); }
.track .tick-l { position: absolute; top: 4px; bottom: 4px; width: 1px; background: var(--rule); }
.track .bar { position: absolute; top: 4px; height: 14px; border-radius: 4px; cursor: default; }
.track .bar.tail { opacity: 0.45; }
.track .bar:hover, .track .bar:focus-visible { filter: brightness(1.08); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--rule-strong); }
.saxis { position: relative; height: 18px; margin-left: calc(9.5rem + 12px); font: 500 10.5px/1 var(--font-mono); color: var(--muted); }
.lang-en .saxis { margin-left: calc(8.5rem + 12px); }
.saxis span { position: absolute; top: 4px; transform: translateX(-50%); white-space: nowrap; }
.saxis span:last-child { transform: translateX(-100%); }
@media (max-width: 480px) {
  .srow, .lang-en .srow { grid-template-columns: minmax(0, 1fr); }
  .saxis, .lang-en .saxis { margin-left: 0; }
  .saxis span:nth-child(4) { display: none; }   /* "1 month" would run into "6 months"; its tick stays */
}
.tip {
  position: fixed; z-index: 50; pointer-events: none; max-width: 260px;
  padding: 7px 10px; border-radius: 6px; background: var(--fg); color: var(--bg);
  font-size: 12.5px; line-height: 1.4; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
}
.tip b { font-weight: 600; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  appearance: none; display: inline-flex; align-items: center; gap: 7px; min-height: 36px;
  padding: 7px 13px; border: 1px solid var(--rule-strong); border-radius: 999px; background: var(--surface);
  font-size: 14px; font-weight: 500; line-height: 1.2; cursor: pointer; text-decoration: none; color: var(--fg);
}
.chip:hover { border-color: var(--fg); }
.chip[aria-selected="true"], .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1.5px var(--surface); }
.chip[aria-selected="true"] .sw, .chip[aria-pressed="true"] .sw { box-shadow: 0 0 0 1.5px var(--bg); }
.chip .ct { font: 500 11px/1 var(--font-mono); color: var(--muted); }
.chip[aria-selected="true"] .ct, .chip[aria-pressed="true"] .ct { color: inherit; opacity: 0.75; }
.chip.small { min-height: 30px; padding: 5px 11px; font-size: 13px; }
.sw.red { background: var(--w-red); } .sw.white { background: var(--w-white); } .sw.rose { background: var(--w-rose); } .sw.amber { background: var(--w-amber); }
.sw.fizz { background: var(--w-white); box-shadow: 0 0 0 1.5px var(--surface), 0 0 0 3px var(--w-white); }

.styles { margin-top: 26px; }
.style-panel { margin-top: 16px; padding: 18px 20px 20px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; }
.style-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.style-head .glass { width: 22px; height: 22px; border-radius: 50%; flex: none; }
.style-head h3 { font-size: 21px; line-height: 1.2; }
.lang-zh .style-head h3 { font-family: var(--font-cjk); font-weight: 900; letter-spacing: 0.04em; }
.lang-en .style-head h3 { font-family: var(--font-latin); font-weight: 500; font-size: 24px; }
.style-head .other { font-family: var(--font-latin); font-style: italic; color: var(--muted); font-size: 16px; }
.lang-en .style-head .other { font-family: var(--font-cjk); font-style: normal; font-weight: 600; font-size: 14px; }
.style-lead { margin-top: 10px; max-width: 44em; font-size: 15.5px; }
.variants { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.variants .label { margin-right: 4px; }
.steps { margin-top: 18px; counter-reset: st; display: grid; gap: 0; }
.steps li { position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 0 12px; padding-bottom: 16px; }
.steps li::before {
  counter-increment: st; content: counter(st);
  display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
  background: var(--fg); color: var(--bg); font: 500 12px/1 var(--font-mono); position: relative; z-index: 1;
}
.steps li::after { content: ""; position: absolute; left: 12.5px; top: 28px; bottom: 2px; width: 1px; background: var(--rule-strong); }
.steps li:last-child::after { display: none; }
.steps li:last-child { padding-bottom: 0; }
.steps .t { font-weight: 600; font-size: 15.5px; line-height: 1.3; padding-top: 3px; }
.steps .t .other { font-weight: 400; color: var(--muted); font-size: 13.5px; margin-left: 6px; }
.steps .t .other.latin { font-size: 15px; }
.steps .k { display: inline-block; margin-top: 5px; padding: 2px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--fg); font: 500 12px/1.5 var(--font-mono); }
.steps .d { margin-top: 5px; font-size: 14.5px; color: var(--fg); max-width: 46em; }
.style-where { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.style-where .label { margin-right: 4px; }

/* 2. grapes */
.gtools { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.gtools .grow { flex: 1 1 220px; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.gtools select, .gtools input {
  min-height: 38px; padding: 7px 12px; font-size: 14.5px; background: var(--surface);
  border: 1px solid var(--rule-strong); border-radius: 8px;
}
.gtools input { flex: 1 1 200px; min-width: 0; max-width: 320px; }
.gtools input::placeholder { color: var(--muted); }
.gtools label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.gcount { margin-top: 12px; font-size: 13px; color: var(--muted); }
.grid { margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: 12px; }
.gcard { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; min-width: 0; }
.gcard.open { grid-column: 1 / -1; border-color: var(--rule-strong); }
.gbtn { appearance: none; display: block; width: 100%; text-align: left; background: none; border: 0; padding: 14px 16px 15px; cursor: pointer; border-radius: 12px; }
.gbtn:hover .gname { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 4px; }
.ghead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.ghead .sw { width: 11px; height: 11px; border-radius: 50%; align-self: center; flex: none; }
.gname { font-size: 18px; font-weight: 600; line-height: 1.25; }
.lang-zh .gname { font-family: var(--font-cjk); font-weight: 900; letter-spacing: 0.03em; }
.lang-en .gname { font-family: var(--font-latin); font-weight: 500; font-size: 21px; }
.gother { font-family: var(--font-latin); font-style: italic; font-size: 15.5px; color: var(--muted); }
.lang-en .gother { font-family: var(--font-cjk); font-style: normal; font-size: 13.5px; font-weight: 600; }
.gaka { width: 100%; font-size: 12.5px; color: var(--muted); }
.meters { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 12px; margin-top: 12px; align-items: center; }
.meters .mt { font-size: 12.5px; color: var(--muted); }
.meters .pips { display: flex; gap: 3px; }
.meters .pips i { width: 100%; max-width: 30px; height: 7px; border-radius: 2px; background: var(--rule); }
.meters .pips i.on { background: var(--fg); }
.gnotes { display: block; margin-top: 12px; font-size: 13.5px; color: var(--muted); }
.gmore { padding: 0 16px 18px; display: grid; gap: 14px; }
.gmore .txt { font-size: 15px; max-width: 46em; }
.gfacts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: 14px; }
.gfacts dt { color: var(--muted); font-size: 13px; padding-top: 1px; }
.gempty { margin-top: 16px; color: var(--muted); }

        ids.forEach(function (r) { var p = v.P(r.lon, r.lat); box = [Math.min(box[0], p[0]), Math.min(box[1], p[1]), Math.max(box[2], p[0]), Math.max(box[3], p[1])]; });
        var name = T(VIEW[id].name);
        add({ kind: 'area', button: true, aria: name, x: (box[0] + box[2]) / 2, y: (box[1] + box[3]) / 2, box: box, text: name, html: esc(name) + '<b>' + ids.length + '</b>', prio: 3, data: { view: id } });
      });
    } else if (!zoomed) {
      D.cities.forEach(function (c) {
        var p = v.P(c[3], c[2]);
        if (inside(v, p)) add({ kind: 'city', x: p[0], y: p[1], text: state.lang === 'zh' ? c[0] : c[1], prio: 6, r: 3 });
      });
    }
    D.regions.forEach(function (r) {
      var p = v.P(r.lon, r.lat);
      if (!inside(v, p)) return;
      var mine = r.view === v.id, isSel = sel && sel.id === r.id;
      var cls = (world ? 'tiny' : '') + (mine || world ? '' : ' away') + (isSel ? ' sel' : '') + (zoomed && !isSel ? ' dim' : '');
      add({ kind: 'rg', button: true, cls: cls, aria: T(r.name) + ', ' + T(D.countries[r.country]), x: p[0], y: p[1],
        text: world ? null : T(r.name), prio: isSel ? 0 : (mine ? 2 : 5), data: { region: r.id }, r: isSel ? 9 : (world ? 5 : 7) });
    });
    if (zoomed) {
      (sel.spots || []).forEach(function (s) {
        var p = v.P(s[3], s[2]);
        add({ kind: s[4] ? 'ref' : 'spot', x: p[0], y: p[1], text: state.lang === 'zh' ? s[0] : s[1], prio: s[4] ? 4 : 1, r: s[4] ? 3 : 4 });
      });
    }
    items.sort(function (a, b) { return a.prio - b.prio; });
  }

  // Put every item where it belongs on screen, then give labels room: each tries the right, left,
  // above and below of its point in turn, and is hidden (shown on hover) if none is free
  function placeAll(labels) {
    var cw = mapEl.clientWidth, ch = mapEl.clientHeight, s = cw / vb.w;
    items.forEach(function (it) {
      it.sx = (it.x - vb.x) * s; it.sy = (it.y - vb.y) * s;
      var out = it.sx < -30 || it.sy < -30 || it.sx > cw + 30 || it.sy > ch + 30;
      it.el.style.transform = 'translate(' + it.sx.toFixed(1) + 'px,' + it.sy.toFixed(1) + 'px)';
      it.el.style.display = out ? 'none' : '';
      it.out = out;
    });
    if (labels) placeLabels(cw, ch);
  }
  function textWidth(it) {
    if (it.tw == null) {
      var cs = getComputedStyle(it.lb);
      measure.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
      it.tw = Math.ceil(measure.measureText(it.text).width) + (it.kind === 'area' ? 16 + 22 : 2);
    }
    return it.tw;
  }
  function placeLabels(cw, ch) {
    var taken = [];
    var hit = function (b) {
      for (var i = 0; i < taken.length; i++) { var t = taken[i]; if (b[0] < t[2] && b[2] > t[0] && b[1] < t[3] && b[3] > t[1]) return true; }
      return false;
    };
    items.forEach(function (it) { if (!it.out && it.r) taken.push([it.sx - it.r, it.sy - it.r, it.sx + it.r, it.sy + it.r]); });
    items.forEach(function (it) {
      if (!it.lb || it.out) return;
      var w = textWidth(it), hgt = it.kind === 'area' ? 24 : (it.kind === 'belt' ? 12 : 18), r = it.r || 0, gap = 4;
      var cands;
      if (it.box) {   // an area: above, below, right or left of its whole cluster of dots
        var s = mapEl.clientWidth / vb.w, bx0 = (it.box[0] - vb.x) * s - 6 - it.sx, bx1 = (it.box[2] - vb.x) * s + 6 - it.sx;
        var by0 = (it.box[1] - vb.y) * s - 6 - it.sy, by1 = (it.box[3] - vb.y) * s + 6 - it.sy;
        cands = [[-w / 2, by0 - hgt], [-w / 2, by1], [bx1 - w, by0 - hgt], [bx0, by0 - hgt], [bx1 - w, by1], [bx0, by1], [bx1, -hgt / 2], [bx0 - w, -hgt / 2]];
      } else if (it.anchor === 'right') cands = [[2, -hgt / 2]];
      else cands = [[r + gap, -hgt / 2], [-r - gap - w, -hgt / 2], [-w / 2, -r - gap - hgt + 2], [-w / 2, r + gap - 2]];
      var done = false;
      for (var i = 0; i < cands.length && !done; i++) {
        var b = [it.sx + cands[i][0], it.sy + cands[i][1], it.sx + cands[i][0] + w, it.sy + cands[i][1] + hgt];
        if (b[0] < 2 || b[1] < 2 || b[2] > cw - 2 || b[3] > ch - 2) continue;
        if (hit(b)) continue;
        taken.push(b);
        it.lb.style.left = cands[i][0] + 'px'; it.lb.style.top = cands[i][1] + 'px';
        it.lb.classList.remove('off');
        done = true;
      }
      if (!done) {   // hidden, but shown to the right on hover or focus
        it.lb.style.left = (r + gap) + 'px'; it.lb.style.top = (-hgt / 2) + 'px';
        it.lb.classList.add('off');
      }
    });
  }

  function setViewBox(b) { vb = b; svg.setAttribute('viewBox', b.x.toFixed(2) + ' ' + b.y.toFixed(2) + ' ' + b.w.toFixed(2) + ' ' + b.h.toFixed(2)); }
  function animateTo(target) {
    cancelAnimationFrame(anim);
    if (reduceMotion || !vb) { setViewBox(target); placeAll(true); return; }
    var from = vb, t0 = performance.now(), dur = 520;
    // zoom in log space so the motion feels even at every scale
    var lw0 = Math.log(from.w), lw1 = Math.log(target.w);
    var cx0 = from.x + from.w / 2, cy0 = from.y + from.h / 2, cx1 = target.x + target.w / 2, cy1 = target.y + target.h / 2;
    mapEl.classList.add('moving');
    var step = function (now) {
      var t = Math.min(1, (now - t0) / dur), e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      var w = Math.exp(lw0 + (lw1 - lw0) * e), h = w * target.h / target.w;
      var cx = cx0 + (cx1 - cx0) * e, cy = cy0 + (cy1 - cy0) * e;
      setViewBox({ x: cx - w / 2, y: cy - h / 2, w: w, h: h });
      placeAll(false);
      if (t < 1) anim = requestAnimationFrame(step);
      else { setViewBox(target); placeAll(true); mapEl.classList.remove('moving'); }
    };
    anim = requestAnimationFrame(step);
  }
  function targetBox() {
    var sel = state.region ? REGION[state.region] : null;
    if (state.zoomed && sel && sel.view === cur.id) return fit(zoomBox(cur, sel), cur);
    return fit(homeBox(cur), cur);
  }

  function showView(id, then) {
    var l = L();
    loadingFor = id;
    mapEl.classList.add('fading');
    var msg = $('mapMsg');
    var slow = setTimeout(function () { if (loadingFor === id) { msg.textContent = l.loading; msg.hidden = false; } }, 250);
    getView(id).then(function (v) {
      if (loadingFor !== id) return;
      clearTimeout(slow); msg.hidden = true;
      cur = v;
      drawGeo(v);
      buildMarks();
      setViewBox(targetBox());
      placeAll(true);
      requestAnimationFrame(function () { mapEl.classList.remove('fading'); });
      renderMapChrome();
      if (then) then();
    }).catch(function () {
      clearTimeout(slow);
      msg.textContent = L().failed; msg.hidden = false;
    });
  }
  function setView(id, opts) {
    opts = opts || {};
    if (!VIEW[id]) return;
    state.view = id;
    if (!opts.keepRegion) { state.region = null; state.zoomed = false; }
    renderViewChips(); renderRegionList(); renderRegionCard();
    if (!opts.quiet) setHash(id === 'world' ? '' : 'map=' + id);
    showView(id, opts.then);
  }
  function selectRegion(id, opts) {
    opts = opts || {};
    var r = REGION[id]; if (!r) return;
    state.region = id;
    state.zoomed = !!(r.spots && r.spots.length);
    setHash('region=' + id);
    if (!cur || cur.id !== r.view || state.view !== r.view) { setView(r.view, { keepRegion: true, quiet: true }); }
    else {
      renderRegionList(); renderRegionCard();
      buildMarks();
      placeAll(false);
      animateTo(targetBox());
      renderMapChrome();
    }
    if (opts.scroll) scrollToEl($('regions'));
  }
  function zoomOut() {
    state.zoomed = false;
    buildMarks(); placeAll(false);
    animateTo(targetBox());
    renderMapChrome();
  }
  function renderMapChrome() {
    var sel = state.region ? REGION[state.region] : null;
    var zoomed = state.zoomed && sel && cur && sel.view === cur.id;
    $('mapBar').hidden = !zoomed;
    if (zoomed) $('mapBack').textContent = L().back(T(VIEW[cur.id].name));
  }

  function renderRegionsTop() {
    var l = L();
    $('regionsH').textContent = l.regionsH;
    $('regionsO').textContent = l.regionsO; $('regionsO').lang = state.lang === 'zh' ? 'en' : 'zh-CN';
    $('regionsIntro').textContent = l.regionsIntro(D.regions.length);
    $('mapNote').textContent = l.mapNote;
  }
  function renderViewChips() {
    var h = '';
    D.views.forEach(function (v) {
      var n = v.id === 'world' ? D.regions.length : (REGIONS_IN[v.id] || []).length;
      h += '<button type="button" class="chip" aria-pressed="' + (state.view === v.id) + '" data-view="' + v.id + '">' + esc(T(v.name)) + '<span class="ct">' + n + '</span></button>';
    });
    $('viewChips').innerHTML = h;
    $('viewChips').setAttribute('aria-label', state.lang === 'zh' ? '地图范围' : 'Map views');
  }
  function renderRegionList() {
    var l = L(), h = '';
    if (state.view === 'world') {
      h = '<span class="label">' + esc(l.areas) + '</span><div class="chips">';
      D.views.forEach(function (v) { if (v.id !== 'world') h += '<button type="button" class="chip small" data-view="' + v.id + '">' + esc(T(v.name)) + '<span class="ct">' + (REGIONS_IN[v.id] || []).length + '</span></button>'; });
      h += '</div>';
    } else {
      h = '<span class="label">' + esc(l.inView) + '</span><div class="chips">';
      (REGIONS_IN[state.view] || []).forEach(function (id) {
        h += '<button type="button" class="chip small" aria-pressed="' + (state.region === id) + '" data-goregion="' + id + '" data-here="1">' + esc(T(REGION[id].name)) + '</button>';
      });
      h += '</div>';
      if (state.view === 'europe') {   // the overview shows every European dot, so offer the views that hold them
        h += '<span class="label">' + esc(l.restOfEurope) + '</span><div class="chips">';
        ['france', 'italy', 'iberia', 'central'].forEach(function (id) { h += '<button type="button" class="chip small" data-view="' + id + '">' + esc(T(VIEW[id].name)) + '<span class="ct">' + (REGIONS_IN[id] || []).length + '</span></button>'; });
        h += '</div>';
      }
    }
    $('rList').innerHTML = h;
  }
  function renderRegionCard() {
    var l = L(), r = state.region ? REGION[state.region] : null, el = $('rCard');
    if (!r) { el.innerHTML = '<p class="hint">' + esc(l.hint) + '</p>'; return; }
    var h = '<div class="rhead"><h3>' + esc(T(r.name)) + '</h3><span class="other"' + otherAttr() + '>' + esc(O(r.name)) + '</span></div>';
    h += '<p class="rmeta">' + esc(T(D.countries[r.country])) + ' · ' + esc(l.climate) + esc(l.colon) + esc(T(r.climate)) + '</p>';
    h += '<p class="rtext">' + esc(T(r.text)) + '</p><dl class="rfacts">';
    var st = REGION_STYLES[r.id] || [];
    if (st.length) h += '<dt class="label">' + esc(l.stylesF) + '</dt><dd class="chips">' + st.map(styleChip).join('') + '</dd>';
    h += '<dt class="label">' + esc(l.grapesF) + '</dt><dd class="chips">' + r.grapes.map(grapeChip).join('') + '</dd>';
    var spots = (r.spots || []).filter(function (s) { return !s[4]; });
    if (spots.length) h += '<dt class="label">' + esc(l.spotsF) + '</dt><dd class="rspots">' + esc(spots.map(function (s) { return state.lang === 'zh' ? s[0] : s[1]; }).join(l.sep)) + '</dd>';
    h += '</dl>';
    el.innerHTML = h;
  }

  // ---------- chrome, language ----------
  function renderChrome() {
    var l = L();
    var page = $('page');
    page.className = 'page lang-' + state.lang;
    document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';
    $('btn-zh').setAttribute('aria-pressed', state.lang === 'zh');
    $('btn-en').setAttribute('aria-pressed', state.lang === 'en');
    $('btn-theme').textContent = l.theme;
    $('eyebrow').textContent = l.eyebrow;
    $('toc1').textContent = l.toc[0]; $('toc2').textContent = l.toc[1]; $('toc3').textContent = l.toc[2];
    $('footNote').textContent = l.footNote;
    document.title = state.lang === 'zh' ? '风土 Terroir · 葡萄酒入门' : '风土 Terroir · a wine primer';
  }
  function renderAll() {
    renderChrome(); renderHero(); renderMake(); renderGrapeTools(); renderGrapes();
    renderRegionsTop(); renderViewChips(); renderRegionList(); renderRegionCard();
    if (cur) { buildMarks(); placeAll(true); renderMapChrome(); }
  }
  function setLang(lang) {
    state.lang = lang;
    try { localStorage.setItem('terroir.lang', lang); } catch (e) {}
    renderAll();
  }

  // ---------- events ----------
  $('btn-zh').addEventListener('click', function () { setLang('zh'); });
  $('btn-en').addEventListener('click', function () { setLang('en'); });

  // light / dark: follows the system until chosen; the choice is shared with the rest of the site
  var root = document.documentElement;
  var mqDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function isDark() { var t = root.getAttribute('data-theme'); return t ? t === 'dark' : !!(mqDark && mqDark.matches); }
  function showTheme() { $('btn-theme').setAttribute('aria-pressed', isDark() ? 'true' : 'false'); }
  $('btn-theme').addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark', system = mqDark && mqDark.matches ? 'dark' : 'light';
    // picking what the system already shows clears the choice, so the page follows the system again
    if (next === system) root.removeAttribute('data-theme'); else root.setAttribute('data-theme', next);
    try { if (next === system) localStorage.removeItem('wentaoz.theme'); else localStorage.setItem('wentaoz.theme', next); } catch (e) {}
    showTheme();
  });
  if (mqDark && mqDark.addEventListener) mqDark.addEventListener('change', showTheme);
  showTheme();
  $('btn-theme').hidden = false;

  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('button, a') : null;
    if (!t) return;
    var d = t.dataset || {};
    if (d.style) { state.style = d.style; state.variant = 0; renderMake(); setHash('make=' + d.style); var tb = $('tab-' + d.style); if (tb) tb.focus(); return; }
    if (d.variant != null && t.closest('#stylePanel')) { state.variant = +d.variant; renderStyle(); return; }
    if (d.gostyle) { state.style = d.gostyle; state.variant = 0; renderMake(); setHash('make=' + d.gostyle); scrollToEl($('styleTabs')); return; }
    if (d.gc) { state.gc = d.gc; renderGrapeTools(); renderGrapes(); return; }
    if (d.grape) {
      var id = d.grape; state.open[id] = !state.open[id];
      renderGrapes();
      setHash(state.open[id] ? 'grape=' + id : '');
      var b = document.querySelector('[data-grape="' + id + '"]'); if (b) b.focus();
      return;
    }
    if (d.gogrape) { openGrape(d.gogrape, true); return; }
    if (d.goregion) { selectRegion(d.goregion, { scroll: !d.here }); return; }
    if (d.region) { selectRegion(d.region); return; }   // a dot on the map
    if (d.view) { setView(d.view); return; }
  });
  $('mapBack').addEventListener('click', zoomOut);
  // arrow keys move between the style tabs
  $('styleTabs').addEventListener('keydown', function (e) {
    var ids = STYLE_ORDER, i = ids.indexOf(state.style);
    var j = e.key === 'ArrowRight' ? i + 1 : e.key === 'ArrowLeft' ? i - 1 : e.key === 'Home' ? 0 : e.key === 'End' ? ids.length - 1 : null;
    if (j === null) return;
    e.preventDefault();
    state.style = ids[(j + ids.length) % ids.length]; state.variant = 0;
    renderMake(); $('tab-' + state.style).focus();
  });
  $('gSort').addEventListener('change', function (e) { state.gsort = e.target.value; renderGrapes(); });
  $('gSearch').addEventListener('input', function (e) { state.gq = e.target.value; renderGrapes(); });
  // skin-contact bars: the same words as their labels, on hover and focus
  var skinTip = function (e) {
    var b = e.target.closest && e.target.closest('.bar[data-skin]'); if (!b) return;
    var nm = L().skin[b.getAttribute('data-skin')], r = b.getBoundingClientRect();
    showTip(L().skinTip(nm[0], nm[1]), r.left + r.width / 2, r.top);
  };
  $('skinRows').addEventListener('pointerover', skinTip);
  $('skinRows').addEventListener('focusin', skinTip);
  $('skinRows').addEventListener('pointerout', hideTip);
  $('skinRows').addEventListener('focusout', hideTip);
  window.addEventListener('scroll', hideTip, { passive: true });

  // the map follows its frame's size
  var refit = function () { if (!cur) return; cancelAnimationFrame(anim); mapEl.classList.remove('moving'); setViewBox(targetBox()); placeAll(true); };
  if ('ResizeObserver' in window) new ResizeObserver(refit).observe(mapEl); else window.addEventListener('resize', refit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { items.forEach(function (it) { it.tw = null; }); if (cur) placeAll(true); });

  // the part in view is marked in the contents bar
  if ('IntersectionObserver' in window) {
    var links = [].slice.call(document.querySelectorAll('#toc a'));
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        links.forEach(function (a) { a.classList.toggle('on', a.getAttribute('href') === '#' + en.target.id); });
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    ['make', 'grapes', 'regions'].forEach(function (id) { io.observe($(id)); });
  }

  // ---------- boot: an address can open a style, a grape, a map view or a region ----------
  function fromHash() {
    var m = (location.hash || '').match(/^#(make|grape|map|region)=([a-z0-9-]+)$/);
    if (!m) return false;
    var key = m[1], id = m[2];
    if (key === 'make' && STYLE[id]) { state.style = id; renderMake(); scrollToEl($('make')); return true; }
    if (key === 'grape' && GRAPE[id]) { openGrape(id, true); return true; }
    if (key === 'map' && VIEW[id]) { setView(id, { quiet: true }); scrollToEl($('regions')); return 'map'; }
    if (key === 'region' && REGION[id]) { selectRegion(id, { scroll: true }); return 'map'; }
    return false;
  }
  renderAll();
  var routed = fromHash();
  if (routed !== 'map') setView('world', { quiet: true });
  window.addEventListener('hashchange', fromHash);
})();
</script>
