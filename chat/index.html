<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<!-- A private page: linked from nowhere on the site and kept out of search engines. The passcode the
     Worker checks is what keeps others from using it, since anyone can read this repository. -->
<meta name="robots" content="noindex, nofollow">
<title>闲聊 Small Talk</title>
<script>
/* Apply the theme picked with the Dark button on the homepage before first paint */
(function () { try { var t = localStorage.getItem('wentaoz.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20fill%3D%22%230F1720%22%2F%3E%3Cpath%20d%3D%22M6%207h20v13H14l-6%205v-5H6z%22%20fill%3D%22%233178D3%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..700&display=swap">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/marked@18.1.3/+esm">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/+esm">
<style>
/* One column of conversation between a header and the box you type in, both pinned. The homepage's
   colours: blue-black ink on white, and its film blue for the send button and links. Your messages sit
   in grey bubbles on the right; Claude's replies run full width on the left, as prose. */
:root {
  --bg: #FFFFFF;
  --ink: #0F1720;
  --ink-2: #51606F;
  --rule: #D3D9E0;
  --bubble: #EDF1F6;
  --code: #F3F5F8;
  --film: #3178D3;
  --alert: #B3261E;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --col: 46rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1218; --ink: #E9EDF2; --ink-2: #9FAAB8; --rule: #28323D;
    --bubble: #1A2430; --code: #141C25; --alert: #F2897C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1218; --ink: #E9EDF2; --ink-2: #9FAAB8; --rule: #28323D;
  --bubble: #1A2430; --code: #141C25; --alert: #F2897C;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 16px;
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--film); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }

/* header */
.bar {
  position: sticky; top: 0; z-index: 2;
  padding-top: env(safe-area-inset-top, 0px);
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule);
}
.bar-in {
  max-width: calc(var(--col) + 32px); margin: 0 auto;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 12px;
}
.brand { margin: 0; font-family: var(--display); font-size: 18px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.brand span { margin-left: 6px; font-weight: 500; font-stretch: 115%; color: var(--ink-2); }
.tools { margin-left: auto; display: flex; gap: 6px; }
.tool {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: 1px solid var(--rule); border-radius: 8px;
  padding: 5px 10px; font-size: 14px; line-height: 1.4; white-space: nowrap;
}
.tool:hover:not(:disabled) { background: var(--bubble); }
.tool:disabled { opacity: 0.45; }
.tool svg { flex: none; }
@media (max-width: 380px) { .brand span { display: none; } }

/* the conversation */
.main { flex: 1; width: 100%; max-width: calc(var(--col) + 32px); margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.empty { margin: 14vh 0 0; text-align: center; }
.empty h2 { margin: 0 0 6px; font-size: 24px; font-weight: 600; }
.empty p { margin: 0; color: var(--ink-2); font-size: 14px; }

.msg { margin: 0 0 22px; }
.msg.user { display: flex; justify-content: flex-end; }
.bubble {
  max-width: 85%;
  padding: 9px 14px;
  background: var(--bubble);
  border-radius: 16px 16px 4px 16px;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.stamp { margin: 6px 0 14px; text-align: center; font-size: 12px; color: var(--ink-2); }

/* Claude's replies, from Markdown */
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin: 0 0 0.8em; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 1.2em 0 0.4em; font-size: 1.05em; font-weight: 650; line-height: 1.4; }
.md h1, .md h2 { font-size: 1.15em; }
.md ul, .md ol { padding-left: 1.5em; }
.md li + li { margin-top: 0.25em; }
.md li > ul, .md li > ol { margin: 0.25em 0 0; }
.md a { color: inherit; text-decoration: underline; text-decoration-color: var(--film); text-decoration-thickness: 2px; text-underline-offset: 0.2em; }
.md code { font-family: var(--mono); font-size: 0.88em; background: var(--code); padding: 0.1em 0.35em; border-radius: 4px; }
.md pre { background: var(--code); padding: 12px 14px; border-radius: 8px; overflow-x: auto; line-height: 1.5; }
.md pre code { background: none; padding: 0; font-size: 13.5px; }
.md blockquote { padding-left: 12px; border-left: 3px solid var(--rule); color: var(--ink-2); }
.md table { display: block; overflow-x: auto; border-collapse: collapse; font-size: 15px; }
.md th, .md td { border: 1px solid var(--rule); padding: 5px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--code); font-weight: 600; }
.md hr { border: 0; border-top: 1px solid var(--rule); margin: 1.2em 0; }
.md .plain { white-space: pre-wrap; }

.flag { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); }
.acts { display: flex; align-items: center; gap: 2px; margin: 4px 0 0 -8px; font-size: 13px; color: var(--ink-2); }
.acts button { background: none; border: 0; border-radius: 6px; padding: 3px 8px; }
.acts button:hover { background: var(--bubble); color: var(--ink); }
.meta { padding: 3px 8px; font-variant-numeric: tabular-nums; }

/* Claude thinking, before the first words arrive */
.dots { display: inline-flex; gap: 5px; padding: 10px 0 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-2); opacity: 0.3; animation: blink 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: 0.2s; }
.dots i:nth-child(3) { animation-delay: 0.4s; }
.wait { margin-left: 8px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: none; } 40% { opacity: 0.9; transform: translateY(-2px); } }
@media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: 0.6; } }

/* the box you type in, and the passcode */
.dock {
  position: sticky; bottom: 0; z-index: 1;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to bottom, transparent, var(--bg) 14px);
}
.dock > * { max-width: var(--col); margin-left: auto; margin-right: auto; }
.notice { margin-bottom: 8px; font-size: 14px; color: var(--alert); }
.opts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin-bottom: 8px; font-size: 13px; color: var(--ink-2); }
.opt { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }   /* a label and its menu wrap together */
.opts select {
  min-width: 0; max-width: 100%;
  padding: 4px 8px;
  font-size: 14px; color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--rule); border-radius: 8px;
}
@media (pointer: coarse) { .opts select { font-size: 16px; } }   /* below 16px, iOS zooms in on it */
.composer, .lock-row {
  display: flex; align-items: flex-end; gap: 8px;
  padding: 6px 6px 6px 14px;
  background: var(--bg);
  border: 1px solid var(--rule); border-radius: 14px;
  box-shadow: 0 1px 2px rgb(15 23 32 / 0.05), 0 6px 20px rgb(15 23 32 / 0.06);
}
.composer:focus-within, .lock-row:focus-within { border-color: var(--film); }
.composer textarea, .lock-row input {
  flex: 1; min-width: 0;
  border: 0; outline: 0; background: none; resize: none;
  font-size: 16px; line-height: 1.5;      /* 16px keeps iOS from zooming in on focus */
  padding: 7px 0;
}
.composer textarea { max-height: 40vh; max-height: 40dvh; }
.send {
  flex: none; width: 36px; height: 36px;
  display: grid; place-items: center;
  border: 0; border-radius: 10px;
  background: var(--film); color: #FFFFFF;
}
.send:disabled { opacity: 0.35; }
.send.stop { background: var(--ink); color: var(--bg); }
.lock label { display: block; margin: 0 0 6px; font-weight: 600; }
.lock-row button { flex: none; border: 0; border-radius: 10px; padding: 6px 16px; background: var(--film); color: #FFFFFF; font-weight: 600; }
.lock-row button:disabled { opacity: 0.5; }
.lock .fine { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }
.lock .msg-line { margin: 8px 0 0; font-size: 14px; color: var(--alert); }
.lock .msg-line:empty { display: none; }

/* conversations kept on this device */
dialog {
  width: min(28rem, calc(100% - 32px));
  max-height: min(38rem, calc(100dvh - 64px));
  padding: 0;
  border: 1px solid var(--rule); border-radius: 14px;
  background: var(--bg); color: var(--ink);
  box-shadow: 0 20px 60px rgb(0 0 0 / 0.25);
}
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: rgb(12 18 24 / 0.45); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 10px 18px; border-bottom: 1px solid var(--rule); }
.sheet-head h2 { margin: 0; font-size: 16px; font-weight: 650; }
.x { background: none; border: 0; border-radius: 8px; width: 34px; height: 34px; font-size: 22px; line-height: 1; color: var(--ink-2); }
.x:hover { background: var(--bubble); color: var(--ink); }
.list { flex: 1; overflow-y: auto; margin: 0; padding: 6px; list-style: none; }
.list li { display: flex; align-items: center; border-radius: 10px; }
.list li.on { background: var(--bubble); }
.list .open { flex: 1; min-width: 0; display: grid; gap: 1px; padding: 8px 12px; background: none; border: 0; text-align: left; }
.list .t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.list .d { font-size: 12px; color: var(--ink-2); }
.list .tag { color: var(--alert); }
.list .del { flex: none; width: 36px; height: 36px; background: none; border: 0; border-radius: 8px; font-size: 18px; color: var(--ink-2); }
.list .del:hover { color: var(--alert); }
.none { margin: 0; padding: 28px 18px; text-align: center; color: var(--ink-2); font-size: 14px; }
.sheet-foot { padding: 10px 18px 14px; border-top: 1px solid var(--rule); }
.link { background: none; border: 0; padding: 0; font-size: 14px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 0.2em; }
.link:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="bar-in">
      <h1 class="brand">闲聊<span>Small Talk</span></h1>
      <div class="tools">
        <button type="button" class="tool" id="history-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>记录
        </button>
        <button type="button" class="tool" id="new-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>新对话
        </button>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="empty" id="empty">
      <h2>想聊点什么？</h2>
      <p>对话存在云端，换一台设备也能接着聊</p>
    </div>
    <div id="log" aria-label="对话"></div>
  </main>

  <footer class="dock">
    <p class="notice" id="notice" role="status" hidden></p>
    <form class="lock" id="lock" hidden>
      <label for="pass">口令</label>
      <div class="lock-row">
        <input id="pass" type="password" autocomplete="current-password" enterkeyhint="go" required>
        <button type="submit" id="lock-go">进入</button>
      </div>
      <p class="msg-line" id="lock-msg" role="status"></p>
      <p class="fine">这是私人页面，要口令才能用。口令只存在这台设备的浏览器里。</p>
    </form>
    <div class="opts" id="opts">
      <span class="opt"><label for="model">模型</label><select id="model"></select></span>
      <span class="opt"><label for="effort">思考</label><select id="effort" title="想得越多，回答越仔细，也越慢、越贵"></select></span>
    </div>
    <form class="composer" id="composer">
      <label class="sr" for="input">消息</label>
      <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
      <button type="submit" class="send" id="send" aria-label="发送"></button>
    </form>
  </footer>
</div>

<dialog id="history" aria-labelledby="history-title">
  <div class="sheet-head">
    <h2 id="history-title">对话记录</h2>
    <button type="button" class="x" data-close aria-label="关闭">×</button>
  </div>
  <ul class="list" id="history-list"></ul>
  <p class="none" id="history-none">还没有对话。</p>
  <div class="sheet-foot"><button type="button" class="link" id="forget">在这台设备上退出（忘掉口令，清掉这里存的对话）</button></div>
</dialog>

<script type="module">
import { MODELS, EFFORTS, modelInfo, effortOf, costOf, MAX_TEXT, checkChatInput } from './chat.js';

// ---------- settings ----------
// The Worker in workers/claude-chat: it holds the Anthropic API key, keeps the conversations, and
// answers only with the passcode
const CHAT_ENDPOINT = 'https://claude-chat.wentaozhang1997.workers.dev';
const SDK = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.133.0';
const MARKED = 'https://cdn.jsdelivr.net/npm/marked@18.1.3/+esm';
const PURIFY = 'https://cdn.jsdelivr.net/npm/dompurify@3.4.17/+esm';
const NOTE_EVERY = 60 * 60 * 1000;   // a new time note for Claude after an hour, or on a new day
const LOOK_EVERY = 15 * 1000;        // at most this often, a page coming back into view checks the cloud
// localStorage: the passcode; the model and effort picked last, for new conversations; the list of conversations
// and a copy of each, the originals being in the cloud; the one open; the unsent draft; and a message
// sent but not yet answered, which comes back to the box if the page reloads
const KEY = { pass: 'chat.passcode', model: 'chat.model', effort: 'chat.effort', index: 'chat.index', conv: 'chat.c.', current: 'chat.current', draft: 'chat.draft', sent: 'chat.sent' };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const log = $('log'), input = $('input'), sendBtn = $('send'), picker = $('model'), thinker = $('effort'), dialog = $('history');
const coarse = matchMedia('(pointer: coarse)').matches;   // a phone or tablet: Enter makes a new line
const ICON = {
  send: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  stop: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2.5" fill="currentColor"/></svg>',
};
let busy = null;   // the request in flight: { ctrl, stream, stopped, view }, view being the messages it shows
let passcode = store.get(KEY.pass) || '';
picker.innerHTML = MODELS.map((m) => `<option value="${m.id}">${esc(m.name)} · ${esc(m.note)}</option>`).join('');
const nameOf = (id) => (MODELS.find((m) => m.id === id) || { name: id }).name;
const EFFORT = { low: '低', medium: '中', high: '高', xhigh: '很高', max: '最高' };
const EFFORT_NOTE = { low: ' · 最快', max: ' · 最慢最贵' };
const anEffort = (e) => (EFFORTS.includes(e) ? e : '');   // '' is the model's own
// The first choice is the model's own effort, named for the model in use
function drawEffort() {
  thinker.innerHTML = `<option value="">默认（${EFFORT[modelInfo(conv.model).effort]}）</option>` +
    EFFORTS.map((e) => `<option value="${e}">${EFFORT[e]}${EFFORT_NOTE[e] || ''}</option>`).join('');
  thinker.value = conv.effort;
}

// ---------- conversations ----------
// A conversation is { id, title, model, effort, updated, version, synced, dirty, messages }, effort
// being '' for the model's own. Its messages are what the API sees ({ role, content }), in order, plus
// a few fields of the page's own that are left out when sending: at (when), model and effort (the
// ones asked), by (a fallback model that answered instead), cost, stopped and truncated. Claude's replies keep every block as it came, thinking included: the
// models check that the conversation behind each thinking block is unchanged, so a conversation only
// ever gains turns at the end or loses them from the end, and its messages array is never changed in
// place. A turn that brings an answer replaces it with a new one; a turn that doesn't leaves it be.
//
// The originals live in the cloud (the Worker's Durable Object), and this browser keeps a copy of
// each. version is the cloud's version the copy builds on, synced how many of its first messages the
// cloud has, and dirty marks a change the cloud doesn't have yet. A save sends only what changed.
// If another device saved first, the cloud refuses the save, and this device's version is kept as a
// new conversation rather than written over the other device's turns.
let index = [];   // { id, title, model, effort, updated, version, dirty }, the latest first
try { index = (JSON.parse(store.get(KEY.index)) || []).map((e) => ({ ...e, version: e.version || 0 })); } catch (e) {}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fresh = () => ({ id: newId(), title: '', model: modelInfo(store.get(KEY.model)).id, effort: anEffort(store.get(KEY.effort)), updated: 0, version: 0, synced: 0, dirty: false, messages: [] });
function load(id) {
  try {
    const c = JSON.parse(store.get(KEY.conv + id));
    // A conversation from before the cloud has no version; it goes up at the first chance
    if (c && Array.isArray(c.messages)) return { ...c, model: modelInfo(c.model).id, effort: anEffort(c.effort), version: c.version || 0, synced: c.synced || 0, dirty: c.dirty ?? !c.version };
  } catch (e) {}
  return null;
}
let wanted = store.get(KEY.current);   // the conversation open last time, fetched if this browser has no copy
let conv = load(wanted) || fresh();

// Keeps a copy in this browser. When the storage is full, the oldest copies of conversations the
// cloud already has make room.
function stash(c) {
  const json = JSON.stringify(c);
  while (!store.set(KEY.conv + c.id, json)) {
    const old = index.findLast((e) => e.id !== c.id && e.version && !e.dirty && store.get(KEY.conv + e.id) != null);
    if (!old) { notice('这台设备的存储满了。'); return; }
    store.del(KEY.conv + old.id);
  }
}
function enlist(c) {
  index = [{ id: c.id, title: c.title, model: c.model, effort: c.effort, updated: c.updated, version: c.version, dirty: c.dirty },
    ...index.filter((e) => e.id !== c.id)].sort((a, b) => b.updated - a.updated);
  store.set(KEY.index, JSON.stringify(index));
}
function unlist(id) {
  store.del(KEY.conv + id);
  index = index.filter((e) => e.id !== id);
  store.set(KEY.index, JSON.stringify(index));
}
function show(c) {
  conv = c;
  store.set(KEY.current, c.id);
  picker.value = c.model;
  drawEffort();
  notice('');
  render();
  scrollDown();
}
// How many messages two versions of a conversation share from the start
const common = (a, b) => { let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++; return i; };

// A turn that brought an answer: the open conversation becomes `next`, here at once, in the cloud soon
function commit(next) {
  conv.synced = Math.min(conv.synced, common(next, conv.messages));
  conv.messages = next;
  conv.updated = Date.now();
  if (!conv.title) conv.title = next.find((m) => m.role === 'user').content.replace(/\s+/g, ' ').slice(0, 40);
  conv.dirty = true;
  stash(conv);
  enlist(conv);
  store.set(KEY.current, conv.id);
  upload(conv);
}

// ---------- the cloud ----------
let lastLook = 0, queue = Promise.resolve();
// Everything that reads or writes the cloud runs one at a time, in order, so a look at the list never
// sees a save half done
function inOrder(fn) {
  const p = queue.then(fn);
  queue = p.catch(() => {});
  return p;
}
// A request to the Worker other than the chat itself. A wrong passcode asks for it again.
async function api(method, path, body) {
  const res = await fetch(CHAT_ENDPOINT + path, {
    method,
    headers: { Authorization: 'Bearer ' + encodeURIComponent(passcode), ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
    signal: AbortSignal.timeout(20000),
  });
  if (res.status === 401 && (await res.clone().json().catch(() => ({}))).error === 'bad_passcode') lock('口令不对，或者已经换了。请重新输入。');
  return res;
}

const upload = (c) => inOrder(() => push(c));
async function push(c) {
  if (!c.dirty || !passcode || !index.some((e) => e.id === c.id)) return;   // nothing new, signed out, or deleted
  const sent = c.messages, keep = Math.min(c.synced, sent.length), title = c.title, model = c.model, effort = c.effort;
  let res;
  try { res = await api('PUT', '/chats/' + c.id, { base: c.version, keep, append: sent.slice(keep), title, model, effort }); }
  catch (e) { return; }   // offline: it goes up with the next save, or the next look at the cloud
  if (res.status === 409) return fork(c, (await res.json().catch(() => ({}))).version || 0);
  if (!res.ok) return;
  c.version = (await res.json()).version;
  c.synced = common(c.messages, sent);
  c.dirty = c.synced < c.messages.length || c.title !== title || c.model !== model || c.effort !== effort;   // changed again meanwhile
  stash(c);
  enlist(c);
}

// Another device saved this conversation after this one last had it. This device's version becomes a
// new conversation; the original keeps the other device's turns and is fetched again when opened.
async function fork(c, version) {
  const copy = { ...c, id: newId(), title: (c.title + '（副本）').slice(0, 100), version: 0, synced: 0, dirty: true };
  store.del(KEY.conv + c.id);
  index = index.map((e) => (e.id === c.id ? { ...e, version, dirty: false } : e));
  stash(copy);
  enlist(copy);
  if (conv.id === c.id) { conv = copy; store.set(KEY.current, copy.id); render(); }
  notice(`这段对话在另一台设备上也有新消息。这台设备上的版本另存成了「${copy.title}」，原来那段保留另一台设备上的样子。`);
  await push(copy);
}

async function pull(id) {
  try {
    const res = await api('GET', '/chats/' + id);
    if (!res.ok) return null;
    const s = await res.json();
    const c = { id: s.id, title: s.title, model: modelInfo(s.model).id, effort: anEffort(s.effort), updated: s.updated, version: s.version, synced: s.messages.length, dirty: false, messages: s.messages };
    stash(c);
    enlist(c);
    return c;
  } catch (e) { return null; }
}

// What changed elsewhere: conversations added or deleted on other devices, and new turns in the open
// one. What this browser has and the cloud doesn't, it uploads.
const look = () => inOrder(async () => {
  if (!passcode) return;
  lastLook = Date.now();
  let chats;
  try {
    const res = await api('GET', '/chats');
    if (!res.ok) return;
    ({ chats } = await res.json());
  } catch (e) { return; }   // offline: the copies here will do
  const cloud = new Map(chats.map((s) => [s.id, s])), mine = new Map(index.map((e) => [e.id, e]));
  const next = chats.map((s) => (mine.get(s.id) || {}).dirty ? mine.get(s.id)
    : { id: s.id, title: s.title, model: modelInfo(s.model).id, effort: anEffort(s.effort), updated: s.updated, version: s.version, dirty: false });
  for (const e of index) {
    if (cloud.has(e.id)) continue;
    const c = e.id === conv.id ? conv : load(e.id);
    if (e.version && !e.dirty) {   // deleted on another device
      store.del(KEY.conv + e.id);
      if (e.id === conv.id && !busy) show(fresh());
    } else if (c && c.messages.length) {   // never uploaded, or deleted elsewhere after changing here
      if (c.version) Object.assign(c, { version: 0, synced: 0, dirty: true });
      next.push({ ...e, version: 0, dirty: true });
      upload(c);
    }
  }
  index = next.sort((a, b) => b.updated - a.updated);
  store.set(KEY.index, JSON.stringify(index));
  const id = conv.messages.length || !wanted ? conv.id : wanted;
  wanted = null;
  const s = cloud.get(id);
  if (s && !busy && !conv.dirty && (id !== conv.id || s.version > conv.version)) {
    const c = await pull(id);
    if (c && !busy && (conv.id === id || !conv.messages.length)) show(c);
  }
  if (conv.dirty) upload(conv);
  if (dialog.open) drawHistory();
});

async function openChat(id) {
  const e = index.find((x) => x.id === id);
  let c = load(id);
  if (!c || (e && !c.dirty && e.version > c.version)) c = (await inOrder(() => pull(id))) || c;
  if (c) show(c);
  else notice('打不开这段对话：连不上服务器。');
}

async function remove(id) {
  const e = index.find((x) => x.id === id);
  if (e && e.version) {
    const ok = await inOrder(() => api('DELETE', '/chats/' + id).then((r) => r.ok, () => false));
    if (!ok) { notice('没删掉：连不上服务器，等会儿再试。'); return; }
  }
  unlist(id);
  if (conv.id === id) show(fresh());
}

// ---------- time notes ----------
// Claude can't see a clock, so after the user's message the page adds a short system message with
// their local time: on the first message, then once an hour has passed or the day has changed. It is
// part of the conversation from then on, like any other turn.
function needsNote(now) {
  const last = conv.messages.findLast((m) => m.role === 'system');
  return !last || now - last.at >= NOTE_EVERY || new Date(last.at).toDateString() !== new Date(now).toDateString();
}
function noteFor(now) {
  const when = new Date(now).toLocaleString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  return `The user's local time: ${when} (${Intl.DateTimeFormat().resolvedOptions().timeZone}).`;
}

// ---------- drawing ----------
let toHtml = null;   // Markdown to safe HTML, once marked and DOMPurify have loaded
const drawn = new WeakMap();   // each reply's HTML, so a long conversation isn't parsed again on every turn
// Only what Markdown text needs. No images: one in a reply would be fetched from wherever its address
// points, which could carry words of the conversation off to that server.
const SAFE = {
  ALLOWED_TAGS: ['p', 'br', 'strong', 'em', 'del', 'code', 'pre', 'blockquote', 'ul', 'ol', 'li', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'a', 'table', 'thead', 'tbody', 'tr', 'th', 'td', 'hr'],
  ALLOWED_ATTR: ['href', 'title', 'align', 'start'],
};
Promise.all([import(MARKED), import(PURIFY)]).then(([{ Marked }, { default: purify }]) => {
  const marked = new Marked({ gfm: true, breaks: true });
  purify.addHook('afterSanitizeAttributes', (n) => { if (n.tagName === 'A') { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener noreferrer'); } });
  toHtml = (s) => purify.sanitize(marked.parse(s), SAFE);
  if (!busy) render();
}).catch(() => {});   // without them, replies show as plain text
const md = (s) => toHtml ? toHtml(s) : `<p class="plain">${esc(s)}</p>`;

const textOf = (m) => typeof m.content === 'string' ? m.content : m.content.filter((b) => b.type === 'text').map((b) => b.text).join('');
const money = (x) => '$' + x.toFixed(x < 0.1 ? 4 : 2);
const stamp = (t) => new Date(t).toLocaleString('zh-CN', { month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
function day(t) {
  const d = new Date(t), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
  return d.toLocaleDateString('zh-CN', d.getFullYear() === now.getFullYear() ? { month: 'long', day: 'numeric' } : { year: 'numeric', month: 'long', day: 'numeric' });
}

function replyHtml(m, i, last) {
  let html = drawn.get(m);
  if (!html) { html = md(textOf(m)); if (toHtml) drawn.set(m, html); }
  const flags = [m.stopped && '回复中断了', m.truncated && '回复太长，被截断了', m.by && `由 ${m.by} 回答`].filter(Boolean);
  const meta = [m.model && nameOf(m.model), EFFORT[m.effort], m.cost != null && money(m.cost)].filter(Boolean).join(' · ');
  return `<article class="msg claude" data-i="${i}"><div class="md">${html}</div>` +
    (flags.length ? `<p class="flag">（${esc(flags.join('；'))}）</p>` : '') +
    '<div class="acts"><button type="button" data-act="copy">复制</button>' +
    (last ? '<button type="button" data-act="again">重新生成</button>' : '') +
    (meta ? `<span class="meta" title="回答的模型、它想了多少，和这条回复大约花了多少钱">${esc(meta)}</span>` : '') +
    '</div></article>';
}

function render() {
  const ms = busy ? busy.view : conv.messages, out = [];
  ms.forEach((m, i) => {
    if (m.role === 'user') {
      // A time note follows the message it belongs to; it is drawn above it, as a time stamp
      const note = ms[i + 1] && ms[i + 1].role === 'system' ? ms[i + 1] : null;
      if (note) out.push(`<p class="stamp">${esc(stamp(note.at))}</p>`);
      out.push(`<article class="msg user"><div class="bubble">${esc(m.content)}</div></article>`);
    } else if (m.role === 'assistant') out.push(replyHtml(m, i, i === ms.length - 1 && !busy));
  });
  log.innerHTML = out.join('');
  $('empty').hidden = ms.length > 0;
  $('new-btn').disabled = !!busy || !ms.length;
}

const nearBottom = () => innerHeight + scrollY >= document.documentElement.scrollHeight - 120;
const scrollDown = () => scrollTo(0, document.documentElement.scrollHeight);
function notice(text) { $('notice').textContent = text; $('notice').hidden = !text; }

// ---------- talking to Claude ----------
function setBusy(on) {
  sendBtn.classList.toggle('stop', on);
  sendBtn.setAttribute('aria-label', on ? '停止' : '发送');
  sendBtn.innerHTML = on ? ICON.stop : ICON.send;
  sendBtn.disabled = !on && !input.value.trim();
  picker.disabled = on;
  thinker.disabled = on;
  $('history-btn').disabled = on;
  $('new-btn').disabled = on || !conv.messages.length;
}

// What goes back to the API of a reply. Empty text blocks are refused there. After a refusal
// fallback partway through a reply, the declining model's thinking before the switch is left out,
// while the fallback block stays where it was, as the API asks.
function keepable(content) {
  const cut = content.map((b) => b.type).lastIndexOf('fallback');
  return content.filter((b, i) => (b.type !== 'text' || b.text.trim()) && (i >= cut || b.type === 'text' || b.type === 'fallback'));
}

function problemText(err) {
  const st = err && err.status, why = String((err && err.message) || err);
  if (st === 429) return why === 'rate_limited' ? '发得太快了，等一分钟再试。' : 'Claude 那边限流了，稍后再试。';
  if (st === 503 && why === 'not_configured') return '服务器还没配置好：Worker 缺 ANTHROPIC_API_KEY 或 CHAT_PASSCODE。';
  if (st === 400 && why === 'too_long') return '这段对话太长了，开一个新对话吧。';
  if (st === 400 && /credit|balance|billing|spend/i.test(why)) return 'Anthropic API 的余额或花费上限用完了。';
  if (st === 400 && /retention/i.test(why)) return `这个模型要求组织开着 30 天的数据保留，换个模型试试：${why}`;
  if (st === 401 || st === 403) return `Anthropic API key 不能用了：${why}`;
  if (st >= 500) return 'Claude 暂时过载或出错了，稍后再试。';
  if (!st && /fetch|network|load failed|connection|terminated/i.test(why)) return '连不上服务器，检查一下网络。（在中国大陆，workers.dev 要翻墙才打得开。）';
  return `出错了：${why}`;
}

// A request that brought no answer: the message goes back in the box, so pressing send tries again
function giveBack(typed, why) {
  if (typed != null && !input.value.trim()) { input.value = typed; grow(); store.set(KEY.draft, typed); }
  notice(why);
}

// One turn. `base` is the conversation it builds on (all of it, or all but the last reply when asking
// again), and `extra` the user's new message with its time note, if any. The conversation itself
// changes only when an answer comes.
async function run(base, extra, typed) {
  notice('');
  const model = conv.model, effort = effortOf({ model, effort: conv.effort }), view = base.concat(extra);
  const body = { model, effort, messages: view.map(({ role, content }) => ({ role, content })) };
  const problem = checkChatInput(body);
  if (problem) return giveBack(typed, problem === 'too_long' ? '这段对话太长了，开一个新对话吧。' : `发不出去（${problem}）。`);

  const job = busy = { ctrl: new AbortController(), stream: null, stopped: false, view };
  setBusy(true);
  render();
  const node = document.createElement('article');
  node.className = 'msg claude';
  node.setAttribute('aria-busy', 'true');
  node.innerHTML = '<div class="md"><span class="dots" role="img" aria-label="Claude 在想"><i></i><i></i><i></i></span><span class="wait"></span></div>';
  log.append(node);
  scrollDown();
  const out = node.firstChild;
  // At high effort the thinking can go on for minutes: after a few seconds, count them
  const t0 = Date.now(), wait = out.querySelector('.wait');
  const tick = setInterval(() => {
    const sec = Math.round((Date.now() - t0) / 1000);
    if (sec >= 3) wait.textContent = sec < 60 ? `想了 ${sec} 秒` : `想了 ${Math.floor(sec / 60)} 分 ${String(sec % 60).padStart(2, '0')} 秒`;
  }, 1000);
  let text = '', queued = false;
  const paint = () => { clearInterval(tick); queued = false; const stick = nearBottom(); out.innerHTML = md(text); if (stick) scrollDown(); };
  try {
    const res = await fetch(CHAT_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + encodeURIComponent(passcode) },
      body: JSON.stringify(body),
      signal: job.ctrl.signal,
    });
    if (!res.ok) { const e = new Error((await res.json().catch(() => ({}))).error || res.statusText); e.status = res.status; throw e; }
    const { BetaMessageStream } = await import(`${SDK}/lib/BetaMessageStream.mjs/+esm`);
    const stream = job.stream = BetaMessageStream.fromReadableStream(res.body);
    if (job.stopped) stream.abort();
    stream.on('text', (d) => { text += d; if (!queued) { queued = true; requestAnimationFrame(paint); } });
    const msg = await stream.finalMessage();
    // A refusal can come partway through a reply, and the part already shown is not an answer
    if (msg.stop_reason === 'refusal') return giveBack(typed, 'Claude 的安全策略拦下了这条消息，没有回答。换个说法试试？');
    const content = keepable(msg.content);
    if (!content.some((b) => b.type === 'text')) return giveBack(typed, 'Claude 这次没说话，再试一次？');
    commit(view.concat([{
      role: 'assistant', content, at: Date.now(), model, effort, cost: costOf(model, msg.usage),
      by: msg.model && !msg.model.startsWith(model) ? msg.model : undefined,
      truncated: msg.stop_reason === 'max_tokens' || undefined,
    }]));
  } catch (err) {
    if (err.status === 401 && err.message === 'bad_passcode') {
      giveBack(typed, '');
      lock('口令不对，或者已经换了。请重新输入。');
    } else if (text.trim()) {
      // Stopped, or cut off partway: what came is kept, without its thinking, and 重新生成 asks again
      commit(view.concat([{ role: 'assistant', content: [{ type: 'text', text: text.trimEnd() }], at: Date.now(), model, effort, stopped: true }]));
      if (!job.stopped) notice('回复中途断了，点「重新生成」可以重来。');
    } else giveBack(typed, job.stopped ? '' : problemText(err));
  } finally {
    clearInterval(tick);
    store.del(KEY.sent);
    busy = null;
    const stick = nearBottom();
    render();
    setBusy(false);
    if (stick) scrollDown();
  }
}

function sendTyped() {
  const typed = input.value.trim();
  if (!typed || busy) return;
  if (!passcode) return lock('');
  if (typed.length > MAX_TEXT) return notice(`一条消息最多 ${MAX_TEXT} 个字符，这条有 ${typed.length} 个。`);
  const now = Date.now(), extra = [{ role: 'user', content: typed, at: now }];
  if (needsNote(now)) extra.push({ role: 'system', content: noteFor(now), at: now });
  input.value = '';
  grow();
  store.del(KEY.draft);
  store.set(KEY.sent, typed);
  run(conv.messages, extra, typed);
}

function again() {
  if (busy || !conv.messages.length || conv.messages.at(-1).role !== 'assistant') return;
  run(conv.messages.slice(0, -1), [], null);
}

function stop() {
  if (!busy) return;
  busy.stopped = true;
  busy.ctrl.abort();
  if (busy.stream) busy.stream.abort();
}

// ---------- the box you type in, and the model ----------
function grow() {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
  if (!busy) sendBtn.disabled = !input.value.trim();
}
input.addEventListener('input', () => { grow(); store.set(KEY.draft, input.value); });
input.addEventListener('keydown', (e) => {
  // On a computer Enter sends and Shift+Enter starts a new line; on a phone the button sends.
  // Never while an input method is still composing, as when picking a Chinese character.
  if (e.key !== 'Enter' || e.shiftKey || coarse || e.isComposing || e.keyCode === 229) return;
  e.preventDefault();
  sendTyped();
});
$('composer').addEventListener('submit', (e) => { e.preventDefault(); if (busy) stop(); else sendTyped(); });

// The model and the effort apply to this conversation from its next message on, and new conversations
// start with them. A change goes up to the cloud with the conversation.
function changed() {
  if (!conv.messages.length) return;
  conv.dirty = true;
  stash(conv);
  enlist(conv);
  upload(conv);
}
picker.addEventListener('change', () => {
  const id = modelInfo(picker.value).id;
  store.set(KEY.model, id);
  if (conv.model === id) return;
  conv.model = id;
  drawEffort();   // the default names the new model's effort
  changed();
});
thinker.addEventListener('change', () => {
  const e = anEffort(thinker.value);
  store.set(KEY.effort, e);
  if (conv.effort === e) return;
  conv.effort = e;
  changed();
});

log.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'again') return again();
  const m = (busy ? busy.view : conv.messages)[+b.closest('[data-i]').dataset.i];
  try {
    await navigator.clipboard.writeText(textOf(m));
    b.textContent = '已复制';
    setTimeout(() => { b.textContent = '复制'; }, 1500);
  } catch (err) {}
});

// ---------- passcode ----------
function lock(msg) {
  passcode = '';
  store.del(KEY.pass);
  $('composer').hidden = true;
  $('opts').hidden = true;
  $('lock').hidden = false;
  $('lock-msg').textContent = msg;
  $('pass').value = '';
  if (!coarse || msg) $('pass').focus();
}
function unlock() {
  $('lock').hidden = true;
  $('composer').hidden = false;
  $('opts').hidden = false;
  if (!coarse) input.focus();
}
$('lock').addEventListener('submit', async (e) => {
  e.preventDefault();
  const p = $('pass').value.trim();
  if (!p) return;
  const go = $('lock-go');
  go.disabled = true;
  $('lock-msg').textContent = '';
  try {
    // The Worker answers a GET with 204 when the passcode is right, without calling Claude
    const res = await fetch(CHAT_ENDPOINT, { headers: { Authorization: 'Bearer ' + encodeURIComponent(p) } });
    if (res.status === 204) { passcode = p; store.set(KEY.pass, p); notice(''); unlock(); look(); return; }
    const why = (await res.json().catch(() => ({}))).error;
    $('lock-msg').textContent = why === 'bad_passcode' ? '口令不对。' : why === 'rate_limited' ? '试得太快了，等一分钟再试。'
      : why === 'not_configured' ? '服务器还没设好口令：在 GitHub 加上 CHAT_PASSCODE 后重新部署。' : `出错了：${why || res.status}`;
  } catch (err) {
    $('lock-msg').textContent = '连不上服务器。（Worker 部署了吗？在中国大陆，workers.dev 要翻墙才打得开。）';
  } finally {
    go.disabled = false;
  }
});

// ---------- the list of conversations ----------
function drawHistory() {
  $('history-list').innerHTML = index.map((e) =>
    `<li${e.id === conv.id ? ' class="on"' : ''}><button type="button" class="open" data-open="${esc(e.id)}"><span class="t">${esc(e.title)}</span>` +
    `<span class="d">${esc(day(e.updated))}${e.model ? ' · ' + esc(nameOf(e.model)) : ''}${EFFORT[e.effort] ? ' · ' + EFFORT[e.effort] : ''}${e.dirty || !e.version ? ' · <span class="tag">还没存到云端</span>' : ''}</span></button>` +
    `<button type="button" class="del" data-del="${esc(e.id)}" aria-label="删除「${esc(e.title)}」">×</button></li>`).join('');
  $('history-none').hidden = index.length > 0;
}
$('history-btn').addEventListener('click', () => {
  drawHistory();
  dialog.showModal();
  if (Date.now() - lastLook > 3000) look();
});
dialog.addEventListener('click', async (e) => {
  // A click on the backdrop lands on the dialog itself
  if (e.target === dialog || e.target.closest('[data-close]')) return dialog.close();
  const open = e.target.closest('[data-open]'), del = e.target.closest('[data-del]');
  if (open) {
    dialog.close();
    await openChat(open.dataset.open);
  } else if (del) {
    const id = del.dataset.del, entry = index.find((x) => x.id === id);
    if (!confirm(`删除「${entry ? entry.title : ''}」？云端的也会删掉，找不回来了。`)) return;
    await remove(id);
    drawHistory();
  }
});
// Signing out also clears this browser's copies of what the cloud has; anything not uploaded yet
// stays, and goes up after the next sign-in
$('forget').addEventListener('click', () => {
  dialog.close();
  for (const e of index) if (e.version && !e.dirty) store.del(KEY.conv + e.id);
  index = index.filter((e) => !e.version || e.dirty);
  store.set(KEY.index, JSON.stringify(index));
  if (conv.version && !conv.dirty) show(fresh());
  lock('已退出。这台设备上存的对话也清掉了，云端的还在。');
});
$('new-btn').addEventListener('click', () => {
  if (busy) return;
  show(fresh());
  if (!coarse && passcode) input.focus();
});
// Coming back to the page, as after chatting on another device
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - lastLook > LOOK_EVERY) look();
});

// ---------- start ----------
input.value = store.get(KEY.draft) || store.get(KEY.sent) || '';
store.del(KEY.sent);
picker.value = conv.model;
drawEffort();
setBusy(false);
grow();
render();
scrollDown();
if (passcode) { unlock(); look(); } else lock('');
</script>
</body>
</html>
