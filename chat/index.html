<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<!-- A private page: linked from nowhere on the site and kept out of search engines. The accounts the
     Worker checks are what keep others from using it, since anyone can read this repository. -->
<meta name="robots" content="noindex, nofollow">
<title>闲聊 Small Talk</title>
<script>
/* Apply the theme picked with the Dark button on the homepage before first paint */
(function () { try { var t = localStorage.getItem('wentaoz.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20fill%3D%22%230F1720%22%2F%3E%3Cpath%20d%3D%22M6%207h20v13H14l-6%205v-5H6z%22%20fill%3D%22%233178D3%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..700&display=swap">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/marked@18.1.3/+esm">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/+esm">
<style>
/* The conversations down the left, as in Claude's apps, and the open one in a column beside them,
   with the box you type in pinned at its foot. On a narrow screen the list slides in over the page
   from a button in a top bar. The homepage's colours: blue-black ink on white, and its film blue for
   the send button and links. Your messages sit in grey bubbles on the right; Claude's replies run
   full width on the left, as prose. */
:root {
  --bg: #FFFFFF;
  --panel: #F6F8FA;      /* the list of conversations */
  --ink: #0F1720;
  --ink-2: #51606F;
  --rule: #D3D9E0;
  --bubble: #EDF1F6;
  --code: #F3F5F8;
  --film: #3178D3;
  --alert: #B3261E;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --col: 46rem;
  --side: 272px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1218; --panel: #10171F; --ink: #E9EDF2; --ink-2: #9FAAB8; --rule: #28323D;
    --bubble: #1A2430; --code: #141C25; --alert: #F2897C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1218; --panel: #10171F; --ink: #E9EDF2; --ink-2: #9FAAB8; --rule: #28323D;
  --bubble: #1A2430; --code: #141C25; --alert: #F2897C;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 16px;
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--film); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.brand { margin: 0; font-family: var(--display); font-size: 18px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.brand span { margin-left: 6px; font-weight: 500; font-stretch: 115%; color: var(--ink-2); }
.icon {
  flex: none; width: 36px; height: 36px;
  display: grid; place-items: center;
  background: none; border: 0; border-radius: 8px; color: var(--ink-2);
}
.icon:hover:not(:disabled) { background: var(--bubble); color: var(--ink); }
.icon:disabled { opacity: 0.4; }

/* the list of conversations */
.side {
  position: fixed; inset: 0 auto 0 0; z-index: 4;
  width: var(--side);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  background: var(--panel);
  border-right: 1px solid var(--rule);
}
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 10px 8px 18px; }
.new {
  display: flex; align-items: center; gap: 8px;
  margin: 2px 10px 8px; padding: 8px 12px;
  background: var(--bg); border: 1px solid var(--rule); border-radius: 10px;
  font-size: 14px; text-align: left;
}
.new:hover:not(:disabled) { border-color: var(--ink-2); }
.new:disabled { opacity: 0.5; }
.list { flex: 1; overflow-y: auto; margin: 0; padding: 2px 8px 8px; list-style: none; }
.list li { display: flex; align-items: center; border-radius: 10px; }
.list li:hover { background: color-mix(in srgb, var(--bubble) 60%, transparent); }
.list li.on { background: var(--bubble); }
.list .open { flex: 1; min-width: 0; display: grid; gap: 1px; padding: 7px 4px 7px 10px; background: none; border: 0; text-align: left; font-size: 14px; }
.list .t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.list .d { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; color: var(--ink-2); }
.list .tag { color: var(--alert); }
.list .del { flex: none; width: 32px; height: 32px; margin-right: 2px; background: none; border: 0; border-radius: 8px; font-size: 17px; color: var(--ink-2); visibility: hidden; }
.list li:hover .del, .list li:focus-within .del, .list li.on .del { visibility: visible; }
.list .del:hover { color: var(--alert); }
@media (pointer: coarse) { .list .del { visibility: visible; } }
.side.busy .list, .side.busy .new { pointer-events: none; opacity: 0.6; }   /* while a reply comes */
.none { margin: 0; padding: 20px 18px; color: var(--ink-2); font-size: 14px; }
.side-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); }
.who { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14px; font-weight: 600; }
.side-foot .link { flex: none; }
.link { background: none; border: 0; padding: 0; font-size: 13px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 0.2em; text-align: left; }
.link:hover { color: var(--ink); }
.scrim { position: fixed; inset: 0; z-index: 3; background: rgb(12 18 24 / 0.45); }

.app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; margin-left: var(--side); }
.bar { display: none; }
.only-narrow { display: none; }
@media (max-width: 899px) {
  .side {
    width: min(var(--side), 86vw);
    transform: translateX(-100%); visibility: hidden;
    transition: transform 0.2s ease, visibility 0.2s;
  }
  .side-open .side { transform: none; visibility: visible; box-shadow: 0 0 40px rgb(0 0 0 / 0.25); }
  .app { margin-left: 0; }
  .only-narrow { display: grid; }
  .bar {
    display: block;
    position: sticky; top: 0; z-index: 2;
    padding-top: env(safe-area-inset-top, 0px);
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--rule);
  }
  .bar-in {
    display: flex; align-items: center; gap: 6px;
    padding: 6px max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px));
  }
  .bar .brand { flex: 1; font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }

/* the conversation */
.main { flex: 1; width: 100%; max-width: calc(var(--col) + 32px); margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.empty { margin: 14vh 0 0; text-align: center; }
.empty h2 { margin: 0 0 6px; font-size: 24px; font-weight: 600; }
.empty p { margin: 0; color: var(--ink-2); font-size: 14px; }

.msg { margin: 0 0 22px; }
.msg.user { display: flex; justify-content: flex-end; }
.bubble {
  max-width: 85%;
  padding: 9px 14px;
  background: var(--bubble);
  border-radius: 16px 16px 4px 16px;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.files { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: flex-start; gap: 6px; margin: 3px 0 6px; white-space: normal; }
.files:last-child { margin-bottom: 3px; }
.files img { display: block; max-width: 160px; max-height: 160px; border-radius: 8px; }
.doc { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 5px 10px; background: var(--bg); border-radius: 8px; font-size: 13px; }
.doc b, .chip .ic { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: var(--ink-2); }
.stamp { margin: 6px 0 14px; text-align: center; font-size: 12px; color: var(--ink-2); }

/* Claude's replies, from Markdown */
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin: 0 0 0.8em; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 1.2em 0 0.4em; font-size: 1.05em; font-weight: 650; line-height: 1.4; }
.md h1, .md h2 { font-size: 1.15em; }
.md ul, .md ol { padding-left: 1.5em; }
.md li + li { margin-top: 0.25em; }
.md li > ul, .md li > ol { margin: 0.25em 0 0; }
.md a { color: inherit; text-decoration: underline; text-decoration-color: var(--film); text-decoration-thickness: 2px; text-underline-offset: 0.2em; }
.md code { font-family: var(--mono); font-size: 0.88em; background: var(--code); padding: 0.1em 0.35em; border-radius: 4px; }
.md pre { background: var(--code); padding: 12px 14px; border-radius: 8px; overflow-x: auto; line-height: 1.5; }
.md pre code { background: none; padding: 0; font-size: 13.5px; }
.md blockquote { padding-left: 12px; border-left: 3px solid var(--rule); color: var(--ink-2); }
.md table { display: block; overflow-x: auto; border-collapse: collapse; font-size: 15px; }
.md th, .md td { border: 1px solid var(--rule); padding: 5px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--code); font-weight: 600; }
.md hr { border: 0; border-top: 1px solid var(--rule); margin: 1.2em 0; }
.md .plain { white-space: pre-wrap; }
.md .search { font-size: 13px; color: var(--ink-2); }
.md .search q { quotes: "「" "」"; }
.md .search q + q { margin-left: 4px; }
.md .search .dots { padding: 0 0 0 6px; vertical-align: middle; }
.md .search .dots i { width: 5px; height: 5px; }
.sources { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 0; font-size: 12.5px; line-height: 1.4; }
.sources .lab { color: var(--ink-2); margin-right: 2px; }
.sources a {
  display: inline-block; max-width: min(100%, 280px);
  padding: 3px 10px; border-radius: 999px;
  background: var(--bubble); color: var(--ink); text-decoration: none;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.sources a:hover { background: color-mix(in srgb, var(--film) 14%, var(--bubble)); }
.sources a b { margin-right: 6px; font-weight: 600; color: var(--ink-2); }

.flag { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); }
.acts { display: flex; align-items: center; gap: 2px; margin: 4px 0 0 -8px; font-size: 13px; color: var(--ink-2); }
.acts button { background: none; border: 0; border-radius: 6px; padding: 3px 8px; }
.acts button:hover { background: var(--bubble); color: var(--ink); }
.meta { padding: 3px 8px; font-variant-numeric: tabular-nums; }

/* Claude thinking, before the first words arrive */
.dots { display: inline-flex; gap: 5px; padding: 10px 0 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-2); opacity: 0.3; animation: blink 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: 0.2s; }
.dots i:nth-child(3) { animation-delay: 0.4s; }
.wait { margin-left: 8px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: none; } 40% { opacity: 0.9; transform: translateY(-2px); } }
@media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: 0.6; } }

/* the box you type in, and signing in */
.dock {
  position: sticky; bottom: 0; z-index: 1;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to bottom, transparent, var(--bg) 14px);
}
.dock > * { max-width: var(--col); margin-left: auto; margin-right: auto; }
.notice { margin-bottom: 8px; font-size: 14px; color: var(--alert); }
.opts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin-bottom: 8px; font-size: 13px; color: var(--ink-2); }
.opt { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }   /* a label and its menu wrap together */
.opts select {
  min-width: 0; max-width: 100%;
  padding: 4px 8px;
  font-size: 14px; color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--rule); border-radius: 8px;
}
@media (pointer: coarse) { .opts select { font-size: 16px; } }   /* below 16px, iOS zooms in on it */
.composer, .fields {
  background: var(--bg);
  border: 1px solid var(--rule); border-radius: 14px;
  box-shadow: 0 1px 2px rgb(15 23 32 / 0.05), 0 6px 20px rgb(15 23 32 / 0.06);
}
.composer { padding: 6px; }
.composer:focus-within, .fields:focus-within, .composer.drop { border-color: var(--film); }
.composer.drop { background: color-mix(in srgb, var(--film) 6%, var(--bg)); }
.row { display: flex; align-items: flex-end; gap: 6px; }
.composer textarea, .fields input {
  flex: 1; min-width: 0;
  border: 0; outline: 0; background: none; resize: none;
  font-size: 16px; line-height: 1.5;      /* 16px keeps iOS from zooming in on focus */
  padding: 7px 2px;
}
.composer textarea { max-height: 40vh; max-height: 40dvh; }
.send {
  flex: none; width: 36px; height: 36px;
  display: grid; place-items: center;
  border: 0; border-radius: 10px;
  background: var(--film); color: #FFFFFF;
}
.send:disabled { opacity: 0.35; }
.send.stop { background: var(--ink); color: var(--bg); }
.tray { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 2px 8px; }
.chip {
  position: relative;
  display: inline-flex; align-items: center; gap: 8px;
  max-width: 230px; padding: 4px 28px 4px 4px;
  background: var(--bubble); border-radius: 10px;
  font-size: 13px; line-height: 1.3;
}
.chip img, .chip .ic { flex: none; width: 36px; height: 36px; border-radius: 6px; object-fit: cover; }
.chip .ic { display: grid; place-items: center; background: var(--bg); }
.chip .nm { min-width: 0; display: grid; }
.chip .nm span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.chip .sz { font-size: 12px; color: var(--ink-2); }
.chip.up { opacity: 0.65; }
.chip .rm { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--ink-2); font-size: 15px; line-height: 1; }
.chip .rm:hover { background: var(--bg); color: var(--ink); }
.lock { display: grid; gap: 10px; }
.lock-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0; }
.lock-head b { font-size: 17px; font-weight: 600; }
.fields { display: grid; overflow: hidden; }
.fields input { padding: 10px 14px; }
.fields input + input { border-top: 1px solid var(--rule); }
.lock-go { justify-self: start; border: 0; border-radius: 10px; padding: 7px 22px; background: var(--film); color: #FFFFFF; font-weight: 600; }
.lock-go:disabled { opacity: 0.5; }
.lock .fine { margin: 0; font-size: 13px; color: var(--ink-2); }
.lock .msg-line { margin: 0; font-size: 14px; color: var(--alert); }
.lock .msg-line:empty { display: none; }
</style>
</head>
<body>
<aside class="side" id="side" aria-label="对话">
  <div class="side-head">
    <h1 class="brand">闲聊<span>Small Talk</span></h1>
    <button type="button" class="icon only-narrow" id="side-close" aria-label="收起对话列表">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <button type="button" class="new" id="new-btn">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>新对话
  </button>
  <ul class="list" id="chat-list"></ul>
  <p class="none" id="chat-none">还没有对话。</p>
  <div class="side-foot" id="side-foot" hidden>
    <span class="who" id="who"></span>
    <button type="button" class="link" id="forget" title="退出这个账号，并清掉这台设备上存的对话；云端的还在">退出登录</button>
  </div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<div class="app">
  <header class="bar">
    <div class="bar-in">
      <button type="button" class="icon" id="side-btn" aria-label="对话列表" aria-controls="side" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <p class="brand">闲聊<span>Small Talk</span></p>
      <button type="button" class="icon" id="new-top" aria-label="新对话">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main class="main">
    <div class="empty" id="empty">
      <h2>想聊点什么？</h2>
      <p>对话存在云端，换一台设备也能接着聊</p>
    </div>
    <div id="log" aria-label="对话内容"></div>
  </main>

  <footer class="dock">
    <p class="notice" id="notice" role="status" hidden></p>
    <form class="lock" id="lock" hidden>
      <p class="lock-head"><b id="lock-title">登录</b><button type="button" class="link" id="lock-switch">没有账号？注册</button></p>
      <div class="fields">
        <input id="acct-name" name="username" aria-label="用户名" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        <input id="acct-pass" name="password" type="password" aria-label="密码" autocomplete="current-password" required>
        <input id="acct-invite" name="invite" type="password" aria-label="邀请码" placeholder="邀请码" autocomplete="off" hidden>
      </div>
      <button type="submit" class="lock-go" id="lock-go">登录</button>
      <p class="msg-line" id="lock-msg" role="status"></p>
      <p class="fine" id="lock-fine"></p>
    </form>
    <div class="opts" id="opts">
      <span class="opt"><label for="model">模型</label><select id="model"></select></span>
      <span class="opt"><label for="effort">Effort</label><select id="effort" title="想得越多，回答越仔细，也越慢、越贵"></select></span>
    </div>
    <form class="composer" id="composer">
      <div class="tray" id="tray" hidden></div>
      <div class="row">
        <button type="button" class="icon" id="clip" aria-label="加文件：图片、PDF 或纯文本">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20.5 11.5 12.3 19.7a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <label class="sr" for="input">消息</label>
        <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
        <button type="submit" class="send" id="send" aria-label="发送"></button>
      </div>
      <input type="file" id="pick" multiple hidden
        accept="image/*,application/pdf,text/*,.md,.markdown,.csv,.tsv,.json,.log,.xml,.yaml,.yml,.toml,.ini,.tex,.py,.js,.mjs,.ts,.tsx,.jsx,.html,.css,.c,.cc,.cpp,.h,.hpp,.java,.go,.rs,.rb,.sh,.sql,.r,.swift,.kt">
    </form>
  </footer>
</div>

<script type="module">
import { MODELS, EFFORTS, FILE_KINDS, MAX_FILE, MAX_FILES, MIN_PASSWORD, modelInfo, effortOf, costOf, MAX_TEXT, checkChatInput, checkAccount } from './chat.js';

// ---------- settings ----------
// The Worker in workers/claude-chat: it holds the Anthropic API key, keeps each user's conversations
// and files, and answers only someone signed in
const CHAT_ENDPOINT = 'https://claude-chat.wentaozhang1997.workers.dev';
const SDK = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.133.0';
const MARKED = 'https://cdn.jsdelivr.net/npm/marked@18.1.3/+esm';
const PURIFY = 'https://cdn.jsdelivr.net/npm/dompurify@3.4.17/+esm';
const NOTE_EVERY = 60 * 60 * 1000;   // a new time note for Claude after an hour, or on a new day
const LOOK_EVERY = 15 * 1000;        // at most this often, a page coming back into view checks the cloud
const IMAGE_EDGE = 2048;             // pixels on an image's long side, at most, as it is uploaded
const MAX_RESUMES = 3;               // times a reply paused partway through its searches is carried on
// localStorage: who is signed in on this browser, as the token the Worker gave and the account's id
// and name. Then, for each account under a prefix of its own: the model and effort picked last, for
// new conversations; the list of conversations and a copy of each, the originals being in the cloud;
// the one open; the unsent draft; and a message sent but not yet answered, which comes back to the
// box if the page reloads. Before there were accounts these had no prefix but 'chat.', and the
// passcode was kept too.
const AUTH = { token: 'chat.token', me: 'chat.me', flash: 'chat.flash', passcode: 'chat.passcode' };
const keysOf = (p) => ({ model: p + 'model', effort: p + 'effort', index: p + 'index', conv: p + 'c.', current: p + 'current', draft: p + 'draft', sent: p + 'sent' });
const prefixOf = (id) => `chat.u.${id}:`;   // ':' can't be in a name, so no account's keys start with another's

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const log = $('log'), input = $('input'), sendBtn = $('send'), picker = $('model'), thinker = $('effort'), side = $('side');
const coarse = matchMedia('(pointer: coarse)').matches;   // a phone or tablet: Enter makes a new line
const narrow = matchMedia('(max-width: 899px)');           // the list of conversations slides in
const ICON = {
  send: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  stop: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2.5" fill="currentColor"/></svg>',
};
let busy = null;   // the request in flight: { ctrl, stream, stopped, view }, view being the messages it shows
let token = store.get(AUTH.token) || '', me = null;
try { me = JSON.parse(store.get(AUTH.me)); } catch (e) {}
if (!token || !me || typeof me.id !== 'string' || typeof me.name !== 'string') { token = ''; me = null; }
// Signed out, the page works on keys nothing else uses, and shows nobody's conversations
const KEY = keysOf(me ? prefixOf(me.id) : 'chat.out:');
const auth = () => 'Bearer ' + token;
picker.innerHTML = MODELS.map((m) => `<option value="${m.id}">${esc(m.name)}</option>`).join('');
const nameOf = (id) => (MODELS.find((m) => m.id === id) || { name: id }).name;
const anEffort = (e) => (EFFORTS.includes(e) ? e : '');   // '' is the model's own
// The first choice is the model's own effort, named for the model in use
function drawEffort() {
  thinker.innerHTML = `<option value="">default (${modelInfo(conv.model).effort})</option>` +
    EFFORTS.map((e) => `<option value="${e}">${e}</option>`).join('');
  thinker.value = conv.effort;
}

// ---------- conversations ----------
// A conversation is { id, title, model, effort, updated, version, synced, dirty, messages }, effort
// being '' for the model's own. Its messages are what the API sees ({ role, content }), in order, plus
// a few fields of the page's own that are left out when sending: at (when), files (the name, size and
// a thumbnail of each file a message carries), model and effort (the ones asked), by (a fallback
// model that answered instead), cost, stopped and truncated. Claude's replies keep every block as it
// came, thinking included: the models check that the conversation behind each thinking block is
// unchanged, so a conversation only ever gains turns at the end or loses them from the end, and its
// messages array is never changed in place. A turn that brings an answer replaces it with a new one;
// a turn that doesn't leaves it be.
//
// The originals live in the cloud (the Worker's Durable Object), and this browser keeps a copy of
// each. version is the cloud's version the copy builds on, synced how many of its first messages the
// cloud has, and dirty marks a change the cloud doesn't have yet. A save sends only what changed.
// If another device saved first, the cloud refuses the save, and this device's version is kept as a
// new conversation rather than written over the other device's turns.
let index = [];   // { id, title, model, effort, updated, version, dirty }, the latest first
try { index = (JSON.parse(store.get(KEY.index)) || []).map((e) => ({ ...e, version: e.version || 0 })); } catch (e) {}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fresh = () => ({ id: newId(), title: '', model: modelInfo(store.get(KEY.model)).id, effort: anEffort(store.get(KEY.effort)), updated: 0, version: 0, synced: 0, dirty: false, messages: [] });
function load(id) {
  try {
    const c = JSON.parse(store.get(KEY.conv + id));
    // A conversation from before the cloud has no version; it goes up at the first chance
    if (c && Array.isArray(c.messages)) return { ...c, model: modelInfo(c.model).id, effort: anEffort(c.effort), version: c.version || 0, synced: c.synced || 0, dirty: c.dirty ?? !c.version };
  } catch (e) {}
  return null;
}
let wanted = store.get(KEY.current);   // the conversation open last time, fetched if this browser has no copy
let conv = load(wanted) || fresh();

// Keeps a copy in this browser. When the storage is full, the oldest copies of conversations the
// cloud already has make room.
function stash(c) {
  const json = JSON.stringify(c);
  while (!store.set(KEY.conv + c.id, json)) {
    const old = index.findLast((e) => e.id !== c.id && e.version && !e.dirty && store.get(KEY.conv + e.id) != null);
    if (!old) { notice('这台设备的存储满了。'); return; }
    store.del(KEY.conv + old.id);
  }
}
function saveIndex() {
  store.set(KEY.index, JSON.stringify(index));
  drawList();
}
function enlist(c) {
  index = [{ id: c.id, title: c.title, model: c.model, effort: c.effort, updated: c.updated, version: c.version, dirty: c.dirty },
    ...index.filter((e) => e.id !== c.id)].sort((a, b) => b.updated - a.updated);
  saveIndex();
}
function unlist(id) {
  store.del(KEY.conv + id);
  index = index.filter((e) => e.id !== id);
  saveIndex();
}
function show(c) {
  conv = c;
  store.set(KEY.current, c.id);
  picker.value = c.model;
  drawEffort();
  notice('');
  render();
  drawList();
  scrollDown();
}
// How many messages two versions of a conversation share from the start
const common = (a, b) => { let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++; return i; };
const userText = (m) => typeof m.content === 'string' ? m.content : m.content.filter((b) => b.type === 'text').map((b) => b.text).join('');
const titleOf = (m) => (userText(m) || (m.files && m.files[0] && m.files[0].name) || '附件').replace(/\s+/g, ' ').trim().slice(0, 40);

// A turn that brought an answer: the open conversation becomes `next`, here at once, in the cloud soon
function commit(next) {
  conv.synced = Math.min(conv.synced, common(next, conv.messages));
  conv.messages = next;
  conv.updated = Date.now();
  if (!conv.title) conv.title = titleOf(next.find((m) => m.role === 'user'));
  conv.dirty = true;
  stash(conv);
  enlist(conv);
  store.set(KEY.current, conv.id);
  upload(conv);
}

// ---------- the cloud ----------
let lastLook = 0, queue = Promise.resolve();
// Everything that reads or writes the cloud runs one at a time, in order, so a look at the list never
// sees a save half done
function inOrder(fn) {
  const p = queue.then(fn);
  queue = p.catch(() => {});
  return p;
}
// A request to the Worker other than the chat itself. A session that has ended asks to sign in again.
const ended = async (res) => res.status === 401 && (await res.clone().json().catch(() => ({}))).error === 'bad_session';
const EXPIRED = '登录过期了，请重新登录。';
async function api(method, path, body) {
  const res = await fetch(CHAT_ENDPOINT + path, {
    method,
    headers: { Authorization: auth(), ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
    signal: AbortSignal.timeout(20000),
  });
  if (await ended(res)) signOut(EXPIRED, false);
  return res;
}

const upload = (c) => inOrder(() => push(c));
async function push(c) {
  if (!c.dirty || !token || !index.some((e) => e.id === c.id)) return;   // nothing new, signed out, or deleted
  const sent = c.messages, keep = Math.min(c.synced, sent.length), title = c.title, model = c.model, effort = c.effort;
  let res;
  try { res = await api('PUT', '/chats/' + c.id, { base: c.version, keep, append: sent.slice(keep), title, model, effort }); }
  catch (e) { return; }   // offline: it goes up with the next save, or the next look at the cloud
  if (res.status === 409) return fork(c, (await res.json().catch(() => ({}))).version || 0);
  if (!res.ok) return;
  c.version = (await res.json()).version;
  c.synced = common(c.messages, sent);
  c.dirty = c.synced < c.messages.length || c.title !== title || c.model !== model || c.effort !== effort;   // changed again meanwhile
  stash(c);
  enlist(c);
}

// Another device saved this conversation after this one last had it. This device's version becomes a
// new conversation; the original keeps the other device's turns and is fetched again when opened.
async function fork(c, version) {
  const copy = { ...c, id: newId(), title: (c.title + '（副本）').slice(0, 100), version: 0, synced: 0, dirty: true };
  store.del(KEY.conv + c.id);
  index = index.map((e) => (e.id === c.id ? { ...e, version, dirty: false } : e));
  stash(copy);
  enlist(copy);
  if (conv.id === c.id) { conv = copy; store.set(KEY.current, copy.id); render(); drawList(); }
  notice(`这段对话在另一台设备上也有新消息。这台设备上的版本另存成了「${copy.title}」，原来那段保留另一台设备上的样子。`);
  await push(copy);
}

async function pull(id) {
  try {
    const res = await api('GET', '/chats/' + id);
    if (!res.ok) return null;
    const s = await res.json();
    const c = { id: s.id, title: s.title, model: modelInfo(s.model).id, effort: anEffort(s.effort), updated: s.updated, version: s.version, synced: s.messages.length, dirty: false, messages: s.messages };
    stash(c);
    enlist(c);
    return c;
  } catch (e) { return null; }
}

// What changed elsewhere: conversations added or deleted on other devices, and new turns in the open
// one. What this browser has and the cloud doesn't, it uploads.
const look = () => inOrder(async () => {
  if (!token) return;
  lastLook = Date.now();
  let chats;
  try {
    const res = await api('GET', '/chats');
    if (!res.ok) return;
    ({ chats } = await res.json());
  } catch (e) { return; }   // offline: the copies here will do
  const cloud = new Map(chats.map((s) => [s.id, s])), mine = new Map(index.map((e) => [e.id, e]));
  const next = chats.map((s) => (mine.get(s.id) || {}).dirty ? mine.get(s.id)
    : { id: s.id, title: s.title, model: modelInfo(s.model).id, effort: anEffort(s.effort), updated: s.updated, version: s.version, dirty: false });
  for (const e of index) {
    if (cloud.has(e.id)) continue;
    const c = e.id === conv.id ? conv : load(e.id);
    if (e.version && !e.dirty) {   // deleted on another device
      store.del(KEY.conv + e.id);
      if (e.id === conv.id && !busy) show(fresh());
    } else if (c && c.messages.length) {   // never uploaded, or deleted elsewhere after changing here
      if (c.version) Object.assign(c, { version: 0, synced: 0, dirty: true });
      next.push({ ...e, version: 0, dirty: true });
      upload(c);
    }
  }
  index = next.sort((a, b) => b.updated - a.updated);
  saveIndex();
  const id = conv.messages.length || !wanted ? conv.id : wanted;
  wanted = null;
  const s = cloud.get(id);
  if (s && !busy && !conv.dirty && (id !== conv.id || s.version > conv.version)) {
    const c = await pull(id);
    if (c && !busy && (conv.id === id || !conv.messages.length)) show(c);
  }
  if (conv.dirty) upload(conv);
});

async function openChat(id) {
  if (busy) return;
  const e = index.find((x) => x.id === id);
  let c = load(id);
  if (!c || (e && !c.dirty && e.version > c.version)) c = (await inOrder(() => pull(id))) || c;
  if (c && !busy) show(c);
  else if (!c) notice('打不开这段对话：连不上服务器。');
}

async function remove(id) {
  const e = index.find((x) => x.id === id);
  if (e && e.version) {
    const ok = await inOrder(() => api('DELETE', '/chats/' + id).then((r) => r.ok, () => false));
    if (!ok) { notice('没删掉：连不上服务器，等会儿再试。'); return; }
  }
  unlist(id);
  if (conv.id === id) show(fresh());
}

// ---------- files ----------
// A file picked, pasted or dropped goes up through the Worker to the Files API at once, and the
// message carries only its id, with its name, size and, for an image, a thumbnail for drawing the
// conversation. Images are first made at most IMAGE_EDGE pixels on their long side, and anything but
// JPEG, PNG, GIF and WebP becomes JPEG; text files go up as plain text whatever their extension.
let tray = [];   // { key, name, size, kind, thumb, id, ready }, for the next message
const TEXT_NAME = /\.(txt|md|markdown|csv|tsv|json|log|xml|ya?ml|toml|ini|tex|py|m?js|tsx?|jsx|html?|css|c|cc|cpp|h|hpp|java|go|rs|rb|sh|sql|r|swift|kt)$/i;
const kindOf = (f) => /^image\//.test(f.type) ? 'image' : (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) ? 'pdf'
  : (/^text\//.test(f.type) || f.type === 'application/json' || TEXT_NAME.test(f.name)) ? 'text' : '';
const sizeOf = (n) => n < 1024 * 1024 ? Math.max(1, Math.round(n / 1024)) + ' KB' : (n / 1024 / 1024).toFixed(1) + ' MB';
const THUMB = /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/;

function canvasOf(img, edge) {
  const k = Math.min(1, edge / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.width * k));
  c.height = Math.max(1, Math.round(img.height * k));
  const g = c.getContext('2d');
  g.fillStyle = '#FFFFFF';   // what shows through a transparent PNG once it is a JPEG
  g.fillRect(0, 0, c.width, c.height);
  g.drawImage(img, 0, 0, c.width, c.height);
  return c;
}

// What goes up for a file: { blob, type, name }
async function prepare(f, item) {
  if (item.kind === 'image') {
    let img;
    try { img = await createImageBitmap(f); } catch (e) { throw new Error('读不出这张图'); }
    item.thumb = canvasOf(img, 240).toDataURL('image/jpeg', 0.75);
    drawTray();
    if (Math.max(img.width, img.height) <= IMAGE_EDGE && f.size <= MAX_FILE.image && FILE_KINDS[f.type]) return { blob: f, type: f.type, name: f.name };
    const blob = await new Promise((ok) => canvasOf(img, IMAGE_EDGE).toBlob(ok, 'image/jpeg', 0.88));
    return { blob, type: 'image/jpeg', name: (f.name || 'image').replace(/\.[^.]*$/, '') + '.jpg' };
  }
  if (item.kind === 'pdf') {
    if (f.size > MAX_FILE.pdf) throw new Error(`PDF 最大 ${MAX_FILE.pdf / 1024 / 1024} MB`);
    return { blob: f, type: 'application/pdf', name: f.name };
  }
  const text = await f.text();
  if (text.includes('\u0000')) throw new Error('看起来不是纯文本');
  const blob = new Blob([text], { type: 'text/plain' });
  if (blob.size > MAX_FILE.text) throw new Error(`文本最大 ${MAX_FILE.text / 1024 / 1024} MB`);
  return { blob, type: 'text/plain', name: f.name };
}

function addFiles(list) {
  for (const f of list) {
    if (tray.length >= MAX_FILES) { notice(`一条消息最多带 ${MAX_FILES} 个文件。`); break; }
    const item = { key: newId(), name: f.name || '文件', size: f.size, kind: kindOf(f), ready: false };
    if (!item.kind) { notice(`「${item.name}」传不了：只能传图片、PDF 和纯文本文件（txt、md、csv、代码……）。`); continue; }
    tray.push(item);
    drawTray();
    prepare(f, item).then(async ({ blob, type, name }) => {
      const res = await fetch(CHAT_ENDPOINT + '/files', {
        method: 'POST',
        headers: { Authorization: auth(), 'Content-Type': type, 'X-File-Name': encodeURIComponent(name) },
        body: blob,
      });
      const r = await res.json().catch(() => ({}));
      if (res.status === 401 && r.error === 'bad_session') { signOut(EXPIRED, false); throw new Error(EXPIRED); }
      if (!res.ok) throw new Error(r.error === 'too_big' ? '文件太大了' : r.error === 'rate_limited' ? '传得太快了，等一分钟' : r.error || res.status);
      if (!tray.includes(item)) return forgetFile(r.id);   // taken off while it went up
      Object.assign(item, { id: r.id, name: r.name || name, size: r.size || blob.size, ready: true });
      drawTray();
    }).catch((err) => {
      if (!tray.includes(item)) return;
      tray = tray.filter((x) => x !== item);
      drawTray();
      notice(`「${item.name}」没传上去：${err.message}`);
    });
  }
}
// A file taken off before sending isn't needed any more; the Worker deletes it unless a saved
// conversation carries it
const forgetFile = (id) => { if (id) fetch(CHAT_ENDPOINT + '/files/' + id, { method: 'DELETE', headers: { Authorization: auth() } }).catch(() => {}); };

function drawTray() {
  const el = $('tray');
  el.hidden = !tray.length;
  el.innerHTML = tray.map((f) => `<span class="chip${f.ready ? '' : ' up'}" data-key="${f.key}">` +
    (THUMB.test(f.thumb || '') ? `<img src="${f.thumb}" alt="">` : `<span class="ic">${f.kind === 'pdf' ? 'PDF' : f.kind === 'text' ? 'TXT' : 'IMG'}</span>`) +
    `<span class="nm"><span>${esc(f.name)}</span><span class="sz">${f.ready ? sizeOf(f.size) : '上传中…'}</span></span>` +
    `<button type="button" class="rm" aria-label="去掉「${esc(f.name)}」">×</button></span>`).join('');
  updateSend();
}
$('tray').addEventListener('click', (e) => {
  const b = e.target.closest('.rm');
  if (!b) return;
  const item = tray.find((f) => f.key === b.parentNode.dataset.key);
  tray = tray.filter((f) => f !== item);
  if (item && item.id) forgetFile(item.id);
  drawTray();
});
$('clip').addEventListener('click', () => $('pick').click());
$('pick').addEventListener('change', (e) => { addFiles([...e.target.files]); e.target.value = ''; });
input.addEventListener('paste', (e) => {
  const files = [...((e.clipboardData && e.clipboardData.files) || [])];
  if (files.length) { e.preventDefault(); addFiles(files); }
});
// Files dragged anywhere onto the page land in the box. A file dropped while the box is hidden
// (signed out) is caught all the same, so the browser doesn't leave the page to show it.
const composer = $('composer');
const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
const usable = () => token && !composer.hidden;
document.addEventListener('dragover', (e) => { if (!hasFiles(e)) return; e.preventDefault(); composer.classList.toggle('drop', !!usable()); });
document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) composer.classList.remove('drop'); });
document.addEventListener('drop', (e) => {
  composer.classList.remove('drop');
  if (!hasFiles(e)) return;
  e.preventDefault();
  if (usable()) addFiles([...e.dataTransfer.files]);
});

// The content of a message with files: the files first, then its text
const contentOf = (text, files) => !files.length ? text : [
  ...files.map((f) => f.kind === 'image' ? { type: 'image', source: { type: 'file', file_id: f.id } }
    : { type: 'document', source: { type: 'file', file_id: f.id }, title: f.name }),
  ...(text ? [{ type: 'text', text }] : []),
];

// ---------- time notes ----------
// Claude can't see a clock, so after the user's message the page adds a short system message with
// their local time: on the first message, then once an hour has passed or the day has changed. It is
// part of the conversation from then on, like any other turn.
function needsNote(now) {
  const last = conv.messages.findLast((m) => m.role === 'system');
  return !last || now - last.at >= NOTE_EVERY || new Date(last.at).toDateString() !== new Date(now).toDateString();
}
function noteFor(now) {
  const when = new Date(now).toLocaleString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  return `The user's local time: ${when} (${Intl.DateTimeFormat().resolvedOptions().timeZone}).`;
}

// ---------- drawing ----------
let toHtml = null;   // Markdown to safe HTML, once marked and DOMPurify have loaded
const drawn = new WeakMap();   // each reply's HTML, so a long conversation isn't parsed again on every turn
// Only what Markdown text needs. No images: one in a reply would be fetched from wherever its address
// points, which could carry words of the conversation off to that server.
const SAFE = {
  ALLOWED_TAGS: ['p', 'br', 'strong', 'em', 'del', 'code', 'pre', 'blockquote', 'ul', 'ol', 'li', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'a', 'table', 'thead', 'tbody', 'tr', 'th', 'td', 'hr'],
  ALLOWED_ATTR: ['href', 'title', 'align', 'start'],
};
Promise.all([import(MARKED), import(PURIFY)]).then(([{ Marked }, { default: purify }]) => {
  const marked = new Marked({ gfm: true, breaks: true });
  purify.addHook('afterSanitizeAttributes', (n) => { if (n.tagName === 'A') { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener noreferrer'); } });
  toHtml = (s) => purify.sanitize(marked.parse(s), SAFE);
  if (!busy) render();
}).catch(() => {});   // without them, replies show as plain text
const md = (s) => toHtml ? toHtml(s) : `<p class="plain">${esc(s)}</p>`;

const DOTS = '<span class="dots" role="img" aria-label="Claude 在想"><i></i><i></i><i></i></span>';

// A reply as the page draws it: its runs of text, and the web searches Claude ran between them, each
// one running until its results are in. Thinking and the results themselves aren't drawn.
function partsOf(content) {
  const parts = [], answered = new Set(content.filter((b) => b.type === 'web_search_tool_result').map((b) => b.tool_use_id));
  let text = '';
  for (const b of content) {
    if (b.type === 'text') text += b.text;
    else if (b.type === 'server_tool_use' && b.name === 'web_search') {
      if (text.trim()) parts.push({ text });
      text = '';
      let query = '';
      try { query = String((b.input && b.input.query) || ''); } catch (e) {}   // still arriving
      const search = { query, running: !answered.has(b.id) }, last = parts.at(-1);
      if (last && last.searches) last.searches.push(search);
      else parts.push({ searches: [search] });
    }
  }
  if (text.trim()) parts.push({ text });
  return parts;
}
const textOf = (m) => typeof m.content === 'string' ? m.content : partsOf(m.content).filter((p) => p.text).map((p) => p.text.trim()).join('\n\n');
function bodyHtml(content) {
  return partsOf(content).map((p) => p.text ? md(p.text)
    : `<p class="search">${p.searches.some((q) => q.running) ? '正在搜索' : '搜索了'}：${p.searches.map((q) => `<q>${esc(q.query || '…')}</q>`).join('')}` +
      `${p.searches.some((q) => q.running) ? DOTS.replace('Claude 在想', '在搜索') : ''}</p>`).join('');
}
// The pages Claude cited, in the order it first cited them, each once
const hostOf = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
function sourcesHtml(content) {
  const cited = new Map();
  for (const b of content) {
    if (b.type !== 'text' || !Array.isArray(b.citations)) continue;
    for (const c of b.citations) if (c && c.type === 'web_search_result_location' && /^https?:\/\//i.test(c.url) && !cited.has(c.url)) cited.set(c.url, c);
  }
  if (!cited.size) return '';
  return '<div class="sources"><span class="lab">来源</span>' + [...cited.values()].map((c) =>
    `<a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer" title="${esc(c.cited_text || c.title || c.url)}"><b>${esc(hostOf(c.url))}</b>${esc(c.title || '')}</a>`).join('') + '</div>';
}
const money = (x) => '$' + x.toFixed(x < 0.1 ? 4 : 2);
const stamp = (t) => new Date(t).toLocaleString('zh-CN', { month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
function day(t) {
  const d = new Date(t), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
  return d.toLocaleDateString('zh-CN', d.getFullYear() === now.getFullYear() ? { month: 'long', day: 'numeric' } : { year: 'numeric', month: 'long', day: 'numeric' });
}

function userHtml(m) {
  // A thumbnail is drawn only if it is one this page made; anything else a file's name
  const files = (m.files || []).map((f) => THUMB.test(f.thumb || '') ? `<img src="${f.thumb}" alt="${esc(f.name)}" title="${esc(f.name)}">`
    : `<span class="doc"><b>${f.kind === 'pdf' ? 'PDF' : f.kind === 'image' ? 'IMG' : 'TXT'}</b>${esc(f.name)}</span>`).join('');
  return `<article class="msg user"><div class="bubble">${files ? `<div class="files">${files}</div>` : ''}${esc(userText(m))}</div></article>`;
}

function replyHtml(m, i, last) {
  let html = drawn.get(m);
  if (!html) { html = `<div class="md">${bodyHtml(m.content)}</div>` + sourcesHtml(m.content); if (toHtml) drawn.set(m, html); }
  const flags = [m.stopped && '回复中断了', m.truncated && '回复太长，被截断了', m.by && `由 ${m.by} 回答`].filter(Boolean);
  const meta = [m.model && nameOf(m.model), m.effort, m.cost != null && money(m.cost)].filter(Boolean).join(' · ');
  return `<article class="msg claude" data-i="${i}">${html}` +
    (flags.length ? `<p class="flag">（${esc(flags.join('；'))}）</p>` : '') +
    '<div class="acts"><button type="button" data-act="copy">复制</button>' +
    (last ? '<button type="button" data-act="again">重新生成</button>' : '') +
    (meta ? `<span class="meta" title="回答的模型、它的 effort，和这条回复大约花了多少钱">${esc(meta)}</span>` : '') +
    '</div></article>';
}

function render() {
  const ms = busy ? busy.view : conv.messages, out = [];
  ms.forEach((m, i) => {
    if (m.role === 'user') {
      // A time note follows the message it belongs to; it is drawn above it, as a time stamp
      const note = ms[i + 1] && ms[i + 1].role === 'system' ? ms[i + 1] : null;
      if (note) out.push(`<p class="stamp">${esc(stamp(note.at))}</p>`);
      out.push(userHtml(m));
    } else if (m.role === 'assistant') out.push(replyHtml(m, i, i === ms.length - 1 && !busy));
  });
  log.innerHTML = out.join('');
  $('empty').hidden = ms.length > 0;
  $('new-btn').disabled = $('new-top').disabled = !!busy || !ms.length;
}

const nearBottom = () => innerHeight + scrollY >= document.documentElement.scrollHeight - 120;
const scrollDown = () => scrollTo(0, document.documentElement.scrollHeight);
function notice(text) { $('notice').textContent = text; $('notice').hidden = !text; }

// ---------- the list of conversations ----------
function drawList() {
  $('chat-list').innerHTML = index.map((e) =>
    `<li${e.id === conv.id ? ' class="on"' : ''}><button type="button" class="open" data-open="${esc(e.id)}"${e.id === conv.id ? ' aria-current="true"' : ''}><span class="t">${esc(e.title)}</span>` +
    `<span class="d">${esc(day(e.updated))}${e.model ? ' · ' + esc(nameOf(e.model)) : ''}${anEffort(e.effort) ? ' · ' + e.effort : ''}${e.dirty || !e.version ? ' · <span class="tag">还没存到云端</span>' : ''}</span></button>` +
    `<button type="button" class="del" data-del="${esc(e.id)}" aria-label="删除「${esc(e.title)}」">×</button></li>`).join('');

}
// On a narrow screen the list slides in over the page

}

$('side-btn').addEventListener('click', () => openSide(true));
$('side-close').addEventListener('click', () => openSide(false));
$('scrim').addEventListener('click', () => openSide(false));

narrow.addEventListener('change', () => openSide(false));
$('chat-list').addEventListener('click', async (e) => {

}

// ---------- talking to Claude ----------
function updateSend() {
  if (busy) return;
  sendBtn.disabled = tray.some((f) => !f.ready) || !(input.value.trim() || tray.length);
}
function setBusy(on) {
  sendBtn.classList.toggle('stop', on);
  sendBtn.setAttribute('aria-label', on ? '停止' : '发送');
  sendBtn.innerHTML = on ? ICON.stop : ICON.send;
  sendBtn.disabled = false;
  updateSend();
  picker.disabled = on;
  thinker.disabled = on;
  side.classList.toggle('busy', on);
  $('new-btn').disabled = $('new-top').disabled = on || !conv.messages.length;
}

// What goes back to the API of a reply. Empty text blocks are refused there. After a refusal
// fallback partway through a reply, the declining model's thinking before the switch is left out,
// while the fallback block stays where it was, as the API asks.
function keepable(content) {
  const cut = content.map((b) => b.type).lastIndexOf('fallback');
  return content.filter((b, i) => (b.type !== 'text' || b.text.trim()) && (i >= cut || b.type === 'text' || b.type === 'fallback'));
}

function problemText(err) {
  const st = err && err.status, why = String((err && err.message) || err);
  if (st === 429) return why === 'rate_limited' ? '发得太快了，等一分钟再试。' : 'Claude 那边限流了，稍后再试。';
  if (st === 403 && why === 'not_your_file') return '有个附件已经失效了，去掉它，重新传一次。';
  if (st === 503 && why === 'not_configured') return '服务器还没配置好：Worker 缺 ANTHROPIC_API_KEY 或 CHAT_PASSCODE。';
  if (st === 400 && why === 'too_long') return '这段对话太长了，开一个新对话吧。';
  if (st === 400 && /credit|balance|billing|spend/i.test(why)) return 'Anthropic API 的余额或花费上限用完了。';
  if (st === 400 && /retention/i.test(why)) return `这个模型要求组织开着 30 天的数据保留，换个模型试试：${why}`;
  if (st === 401 || st === 403) return `Anthropic API key 不能用了：${why}`;
  if (st >= 500) return 'Claude 暂时过载或出错了，稍后再试。';
  if (!st && /fetch|network|load failed|connection|terminated/i.test(why)) return '连不上服务器，检查一下网络。（在中国大陆，workers.dev 要翻墙才打得开。）';
  return `出错了：${why}`;
}

// A request that brought no answer: the message and its files go back in the box, so pressing send
// tries again
function giveBack(typed, why) {
  if (typed && !input.value.trim()) { input.value = typed.text; grow(); store.set(KEY.draft, typed.text); }
  if (typed && typed.files.length && !tray.length) { tray = typed.files.map((f) => ({ ...f, key: newId(), ready: true })); drawTray(); }
  notice(why);
}

// One turn. `base` is the conversation it builds on (all of it, or all but the last reply when asking
// again), and `extra` the user's new message with its time note, if any. The conversation itself
// changes only when an answer comes. A long run of searches can make the API pause a reply partway
// (stop reason pause_turn): the reply so far then goes back as it is, and the API carries on with it.
async function run(base, extra, typed) {
  notice('');
  const model = conv.model, effort = effortOf({ model, effort: conv.effort }), view = base.concat(extra);
  const ask = (sofar) => ({ model, effort, messages: (sofar.length ? view.concat([{ role: 'assistant', content: sofar }]) : view).map(({ role, content }) => ({ role, content })) });
  const problem = checkChatInput(ask([]));
  if (problem) return giveBack(typed, problem === 'too_long' ? '这段对话太长了，开一个新对话吧。' : `发不出去（${problem}）。`);

  const job = busy = { ctrl: new AbortController(), stream: null, stopped: false, view };
  setBusy(true);
  render();
  const node = document.createElement('article');
  node.className = 'msg claude';
  node.setAttribute('aria-busy', 'true');
  node.innerHTML = `<div class="md">${DOTS}<span class="wait"></span></div>`;
  log.append(node);
  scrollDown();
  const out = node.firstChild;
  // At high effort the thinking can go on for minutes: after a few seconds, count them
  const t0 = Date.now(), wait = out.querySelector('.wait');
  const tick = setInterval(() => {
    const sec = Math.round((Date.now() - t0) / 1000);
    if (sec >= 3) wait.textContent = sec < 60 ? `想了 ${sec} 秒` : `想了 ${Math.floor(sec / 60)} 分 ${String(sec % 60).padStart(2, '0')} 秒`;
  }, 1000);
  // What has come: the reply so far from the requests before a pause, and the one coming in now
  let sofar = [], snap = null, queued = false, shown = '';
  const live = () => (snap ? sofar.concat(snap.content) : sofar);
  const paint = () => {
    queued = false;
    const html = bodyHtml(live());
    if (!html || html === shown) return;   // still thinking: the dots and the timer stay
    clearInterval(tick);
    shown = html;
    const stick = nearBottom();
    out.innerHTML = html;
    if (stick) scrollDown();
  };
  let msg, cost;
  try {
    const { BetaMessageStream } = await import(`${SDK}/lib/BetaMessageStream.mjs/+esm`);
    for (let round = 0; ; round++) {
      const res = await fetch(CHAT_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: auth() },
        body: JSON.stringify(ask(sofar)),
        signal: job.ctrl.signal,
      });
      if (!res.ok) { const e = new Error((await res.json().catch(() => ({}))).error || res.statusText); e.status = res.status; throw e; }
      const stream = job.stream = BetaMessageStream.fromReadableStream(res.body);
      if (job.stopped) stream.abort();
      stream.on('streamEvent', (e, s) => { snap = s; if (!queued) { queued = true; requestAnimationFrame(paint); } });
      msg = await stream.finalMessage();
      const c = costOf(model, msg.usage);
      if (c != null) cost = (cost || 0) + c;
      // A refusal can come partway through a reply, and the part already shown is not an answer
      if (msg.stop_reason === 'refusal') return giveBack(typed, 'Claude 的安全策略拦下了这条消息，没有回答。换个说法试试？');
      sofar = sofar.concat(keepable(msg.content));
      snap = null;
      if (msg.stop_reason !== 'pause_turn') break;
      if (round === MAX_RESUMES) throw new Error('paused too often');   // kept as far as it got, below
    }
    if (!sofar.some((b) => b.type === 'text')) return giveBack(typed, 'Claude 这次没说话，再试一次？');
    commit(view.concat([{
      role: 'assistant', content: sofar, at: Date.now(), model, effort, cost,
      by: msg.model && !msg.model.startsWith(model) ? msg.model : undefined,
      truncated: msg.stop_reason === 'max_tokens' || undefined,
    }]));
  } catch (err) {
    const text = textOf({ content: live() });
    if (err.status === 401 && err.message === 'bad_session') {
      giveBack(typed, '');
      signOut(EXPIRED, false);
    } else if (text.trim()) {
      // Stopped, or cut off partway: what came is kept as plain text, without its thinking and
      // searches, and 重新生成 asks again
      commit(view.concat([{ role: 'assistant', content: [{ type: 'text', text: text.trimEnd() }], at: Date.now(), model, effort, stopped: true }]));
      if (!job.stopped) notice('回复中途断了，点「重新生成」可以重来。');
    } else giveBack(typed, job.stopped ? '' : problemText(err));
  } finally {
    clearInterval(tick);
    store.del(KEY.sent);
    busy = null;
    const stick = nearBottom();
    render();
    setBusy(false);
    if (stick) scrollDown();
  }
}

function sendTyped() {
  const text = input.value.trim();
  if (busy || tray.some((f) => !f.ready)) return;
  const files = tray.slice();
  if (!text && !files.length) return;
  if (!token) return;
  if (text.length > MAX_TEXT) return notice(`一条消息最多 ${MAX_TEXT} 个字符，这条有 ${text.length} 个。`);
  const now = Date.now(), user = { role: 'user', content: contentOf(text, files), at: now };
  if (files.length) user.files = files.map(({ id, name, size, kind, thumb }) => ({ id, name, size, kind, ...(thumb ? { thumb } : {}) }));
  const extra = [user];
  if (needsNote(now)) extra.push({ role: 'system', content: noteFor(now), at: now });
  input.value = '';
  tray = [];
  drawTray();
  grow();
  store.del(KEY.draft);
  store.set(KEY.sent, text);
  run(conv.messages, extra, { text, files });
}

function again() {
  if (busy || !conv.messages.length || conv.messages.at(-1).role !== 'assistant') return;
  run(conv.messages.slice(0, -1), [], null);
}

function stop() {
  if (!busy) return;
  busy.stopped = true;
  busy.ctrl.abort();
  if (busy.stream) busy.stream.abort();
}

// ---------- the box you type in, the model and the effort ----------
function grow() {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
  updateSend();
}
input.addEventListener('input', () => { grow(); store.set(KEY.draft, input.value); });
input.addEventListener('keydown', (e) => {
  // On a computer Enter sends and Shift+Enter starts a new line; on a phone the button sends.
  // Never while an input method is still composing, as when picking a Chinese character.
  if (e.key !== 'Enter' || e.shiftKey || coarse || e.isComposing || e.keyCode === 229) return;
  e.preventDefault();
  sendTyped();
});
composer.addEventListener('submit', (e) => { e.preventDefault(); if (busy) stop(); else sendTyped(); });

// The model and the effort apply to this conversation from its next message on, and new conversations
// start with them. A change goes up to the cloud with the conversation.
function changed() {
  if (!conv.messages.length) return;
  conv.dirty = true;
  stash(conv);
  enlist(conv);
  upload(conv);
}
picker.addEventListener('change', () => {
  const id = modelInfo(picker.value).id;
  store.set(KEY.model, id);
  if (conv.model === id) return;
  conv.model = id;
  drawEffort();   // the default names the new model's effort
  changed();
});
thinker.addEventListener('change', () => {
  const e = anEffort(thinker.value);
  store.set(KEY.effort, e);
  if (conv.effort === e) return;
  conv.effort = e;
  changed();
});

log.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'again') return again();
  const m = (busy ? busy.view : conv.messages)[+b.closest('[data-i]').dataset.i];
  try {
    await navigator.clipboard.writeText(textOf(m));
    b.textContent = '已复制';
    setTimeout(() => { b.textContent = '复制'; }, 1500);
  } catch (err) {}
});

// ---------- accounts ----------
// Each user signs in with their own name and password, and anyone with the invite code can open an
// account. Signing in or out reloads the page, which then reads that account's own keys.
let joining = false;   // the form opens an account rather than signing in
const legacy = store.get(AUTH.passcode);   // a browser that used the passcode, from before there were accounts
function drawLock() {
  $('lock-title').textContent = $('lock-go').textContent = joining ? '注册' : '登录';
  $('lock-switch').textContent = joining ? '已有账号？登录' : '没有账号？注册';
  $('acct-invite').hidden = !joining;

  $('acct-pass').placeholder = joining ? `密码：至少 ${MIN_PASSWORD} 个字符` : '密码';
  $('lock-fine').textContent = !joining ? '这是私人页面，登录后才能用。'
    : legacy && $('acct-invite').value === legacy ? '现在要用账号了。邀请码就是原来的口令，已经替你填好；原来的对话归第一个注册的账号。'
    : '注册要邀请码，找网站的主人要。';
}
function lock(msg) {

  $('opts').hidden = true;
  $('lock').hidden = false;
  $('lock-msg').textContent = msg;
  drawLock();
  if (!coarse) $(joining || !$('acct-name').value ? 'acct-name' : 'acct-pass').focus();
}
function unlock() {
  $('lock').hidden = true;
  composer.hidden = false;
  $('opts').hidden = false;
  $('who').textContent = me.name;
  $('side-foot').hidden = false;

}
$('lock-switch').addEventListener('click', () => {
  joining = !joining;
  $('lock-msg').textContent = '';
  drawLock();
  if (!coarse) $('acct-name').focus();
});

// The copies from before there were accounts belong to the first account, which took over their
// originals in the cloud
function adopt(p) {
  const from = keysOf('chat.'), to = keysOf(p), moves = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(from.conv)) moves.push([k, to.conv + k.slice(from.conv.length)]);
    }
  } catch (e) { return; }
  for (const k of ['model', 'effort', 'index', 'current', 'draft', 'sent']) moves.push([from[k], to[k]]);
  for (const [a, b] of moves) {
    const v = store.get(a);
    if (v == null) continue;
    store.del(a);
    if (store.get(b) == null && !store.set(b, v)) store.set(a, v);
  }
}

const SIGN_IN = {
  bad_login: '用户名或密码不对。',
  bad_invite: '邀请码不对。',
  name_taken: '这个用户名有人用了，换一个吧。',
  bad_name: '用户名要 2 到 24 个字：字母、数字、汉字，或者 . _ -',
  weak_password: `密码至少要 ${MIN_PASSWORD} 个字符。`,
  rate_limited: '试得太快了，等一分钟再试。',
  not_configured: '服务器还没配置好：Worker 缺 ANTHROPIC_API_KEY 或 CHAT_PASSCODE。',
  bad_passcode: '服务器还没更新好，等一两分钟再试。',
};
$('lock').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = $('acct-name').value.trim(), password = $('acct-pass').value, invite = $('acct-invite').value.trim();
  const say = (t) => { $('lock-msg').textContent = t; };
  if (!name || !password || (joining && !invite)) return;
  const problem = joining && checkAccount(name, password);
  if (problem) return say(SIGN_IN[problem]);
  const go = $('lock-go');
  go.disabled = true;
  say('');
  try {
    const res = await fetch(CHAT_ENDPOINT + (joining ? '/account' : '/login'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(joining ? { name, password, invite } : { name, password }),
    });
    const r = await res.json().catch(() => ({}));
    if (!res.ok || !r.token) return say(SIGN_IN[r.error] || `出错了：${r.error || res.status}`);
    if (!store.set(AUTH.token, r.token) || !store.set(AUTH.me, JSON.stringify({ id: r.id, name: r.name }))) {
      store.del(AUTH.token);
      return say('这个浏览器存不下登录状态：是不是关掉了网站数据？');
    }
    store.del(AUTH.passcode);
    if (r.first) adopt(prefixOf(r.id));
    location.reload();
  } catch (err) {
    say('连不上服务器。（Worker 部署了吗？在中国大陆，workers.dev 要翻墙才打得开。）');
  } finally {
    go.disabled = false;
  }
});

// Signing out ends the session in the cloud too, and clears this browser's copies of what the cloud
// has; anything not uploaded yet stays, and goes up when the same account signs in again
function signOut(msg, tell = true) {
  if (!token) return;   // already on the way out
  if (tell) fetch(CHAT_ENDPOINT + '/logout', { method: 'POST', headers: { Authorization: auth() }, keepalive: true }).catch(() => {});
  for (const e of index) if (e.version && !e.dirty) store.del(KEY.conv + e.id);
  store.set(KEY.index, JSON.stringify(index.filter((e) => !e.version || e.dirty)));
  if (store.get(AUTH.token) === token) { store.del(AUTH.token); store.del(AUTH.me); }   // unless another tab signed in since
  token = '';
  try { sessionStorage.setItem(AUTH.flash, msg); } catch (e) {}
  location.reload();
}
// Signing in or out in another tab: this one follows, unless a reply is still coming
addEventListener('storage', (e) => { if (e.key === AUTH.token && (e.newValue || '') !== token && !busy) location.reload(); });

// Coming back to the page, as after chatting on another device
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - lastLook > LOOK_EVERY) look();
});

// ---------- start ----------
input.value = store.get(KEY.draft) || store.get(KEY.sent) || '';
store.del(KEY.sent);
picker.value = conv.model;
drawEffort();
setBusy(false);
grow();
render();
drawList();
scrollDown();
if (token) { unlock(); look(); }
else {
  let flash = '';
  try { flash = sessionStorage.getItem(AUTH.flash) || ''; sessionStorage.removeItem(AUTH.flash); } catch (e) {}
  $('chat-none').textContent = '登录后，这里是你的对话。';
  if (legacy) { joining = true; $('acct-invite').value = legacy; }
  lock(flash);
}
</script>
</body>
</html>
