<style>
/* The conversations down the left, as in Claude's apps, and the open one in a column beside them,
   with the box you type in pinned at its foot. On a narrow screen the list slides in over the page
   from a button in a top bar. The homepage's colours: blue-black ink on white, and its film blue for
   the send button and links. Your messages sit in grey bubbles on the right; Claude's replies run
   full width on the left, as prose. */
:root {
  --bg: #FFFFFF;
  --panel: #F6F8FA;      /* the list of conversations */
  --ink: #0F1720;
  --ink-2: #51606F;
  --rule: #D3D9E0;
  --bubble: #EDF1F6;
  --code: #F3F5F8;
  --film: #3178D3;
  --alert: #B3261E;
  --hl-kw: #CF222E; --hl-str: #0A3069; --hl-num: #0550AE; --hl-fn: #8250DF; --hl-var: #953800; --hl-tag: #116329;   /* code */
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --col: 46rem;
  --side: 272px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1218; --panel: #10171F; --ink: #E9EDF2; --ink-2: #9FAAB8; --rule: #28323D;
    --bubble: #1A2430; --code: #141C25; --alert: #F2897C;
    --hl-kw: #FF7B72; --hl-str: #A5D6FF; --hl-num: #79C0FF; --hl-fn: #D2A8FF; --hl-var: #FFA657; --hl-tag: #7EE787;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1218; --panel: #10171F; --ink: #E9EDF2; --ink-2: #9FAAB8; --rule: #28323D;
  --bubble: #1A2430; --code: #141C25; --alert: #F2897C;
  --hl-kw: #FF7B72; --hl-str: #A5D6FF; --hl-num: #79C0FF; --hl-fn: #D2A8FF; --hl-var: #FFA657; --hl-tag: #7EE787;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 16px;
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--film); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.brand { margin: 0; font-family: var(--display); font-size: 18px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.brand span { margin-left: 6px; font-weight: 500; font-stretch: 115%; color: var(--ink-2); }
.icon {
  flex: none; width: 36px; height: 36px;
  display: grid; place-items: center;
  background: none; border: 0; border-radius: 8px; color: var(--ink-2);
}
.icon:hover:not(:disabled) { background: var(--bubble); color: var(--ink); }
.icon:disabled { opacity: 0.4; }

/* the list of conversations */
.side {
  position: fixed; inset: 0 auto 0 0; z-index: 4;
  width: var(--side);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  background: var(--panel);
  border-right: 1px solid var(--rule);
}
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 10px 8px 18px; }
.new {
  display: flex; align-items: center; gap: 8px;
  margin: 2px 10px 8px; padding: 8px 12px;
  background: var(--bg); border: 1px solid var(--rule); border-radius: 10px;
  font-size: 14px; text-align: left;
}
.new:hover:not(:disabled) { border-color: var(--ink-2); }
.new:disabled { opacity: 0.5; }
.list { flex: 1; overflow-y: auto; margin: 0; padding: 2px 8px 8px; list-style: none; }
.list li { display: flex; align-items: center; border-radius: 10px; }
.list li:hover { background: color-mix(in srgb, var(--bubble) 60%, transparent); }
.list li.on { background: var(--bubble); }
.list .open { flex: 1; min-width: 0; display: grid; gap: 1px; padding: 7px 4px 7px 10px; background: none; border: 0; text-align: left; font-size: 14px; }
.list .t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.list .d { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; color: var(--ink-2); }
.list .tag { color: var(--alert); }
.list .tag.live { color: var(--film); }
.list .more { flex: none; width: 32px; height: 32px; margin-right: 2px; background: none; border: 0; border-radius: 8px; font-size: 16px; letter-spacing: 1px; color: var(--ink-2); visibility: hidden; }
.list li:hover .more, .list li:focus-within .more, .list li.on .more, .list .more[aria-expanded="true"] { visibility: visible; }
.list .more:hover, .list .more[aria-expanded="true"] { background: var(--bg); color: var(--ink); }
@media (pointer: coarse) { .list .more { visibility: visible; } }
.list .rename { flex: 1; min-width: 0; margin: 4px; padding: 5px 7px; font-size: 14px; background: var(--bg); border: 1px solid var(--film); border-radius: 7px; outline: 0; }
.list mark { background: color-mix(in srgb, var(--film) 24%, transparent); color: inherit; border-radius: 2px; }
.find { margin: 0 10px 6px; }
.find input { width: 100%; padding: 6px 10px; font-size: 14px; background: var(--bg); border: 1px solid var(--rule); border-radius: 9px; outline: 0; }
.find input:focus { border-color: var(--film); }
@media (pointer: coarse) { .find input { font-size: 16px; } }
/* a conversation's menu: rename, export, delete */
.menu { position: fixed; z-index: 6; min-width: 156px; padding: 4px; background: var(--bg); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 10px 30px rgb(15 23 32 / 0.18); }
.menu button { display: block; width: 100%; padding: 7px 12px; background: none; border: 0; border-radius: 7px; text-align: left; font-size: 14px; }
.menu button:hover, .menu button:focus-visible { background: var(--bubble); outline: 0; }
.menu .danger { color: var(--alert); }
.none { margin: 0; padding: 20px 18px; color: var(--ink-2); font-size: 14px; }
.side-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); }
.who { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0; background: none; border: 0; text-align: left; font-size: 14px; font-weight: 600; }
.who:hover { text-decoration: underline; text-underline-offset: 0.2em; }
/* the account: what it spent, and its password */
dialog.sheet { width: min(440px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); padding: 0; background: var(--bg); color: var(--ink); border: 1px solid var(--rule); border-radius: 14px; box-shadow: 0 20px 60px rgb(0 0 0 / 0.28); }
dialog.sheet::backdrop { background: rgb(12 18 24 / 0.45); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px 0 20px; }
.sheet-head h2 { margin: 0; font-size: 18px; font-weight: 600; }
.sheet section { padding: 6px 20px 16px; }
.sheet section + section { border-top: 1px solid var(--rule); padding-top: 14px; }
.sheet h3 { margin: 4px 0 8px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.usage { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.usage th { padding: 0 0 4px; font-weight: 500; font-size: 12.5px; color: var(--ink-2); text-align: right; }
.usage td { padding: 3px 0; vertical-align: baseline; }
.usage td + td, .usage th + th { text-align: right; padding-left: 12px; }
.usage .sub { display: block; font-size: 12.5px; color: var(--ink-2); }
.sheet .fine { margin: 10px 0 0; font-size: 12.5px; color: var(--ink-2); }
.sheet #install-go { margin-top: 12px; }
.sheet #pw-form { display: grid; gap: 10px; }
.sheet .msg-line { margin: 0; font-size: 14px; color: var(--alert); }
.sheet .msg-line.ok { color: var(--film); }
.sheet .msg-line:empty { display: none; }
.side-foot .link { flex: none; }
.link { background: none; border: 0; padding: 0; font-size: 13px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 0.2em; text-align: left; }
.link:hover { color: var(--ink); }
.scrim { position: fixed; inset: 0; z-index: 3; background: rgb(12 18 24 / 0.45); }

.app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; margin-left: var(--side); }
.bar { display: none; }
.only-narrow { display: none; }
@media (max-width: 899px) {
  .side {
    width: min(var(--side), 86vw);
    transform: translateX(-100%); visibility: hidden;
    transition: transform 0.2s ease, visibility 0.2s;
  }
  .side-open .side { transform: none; visibility: visible; box-shadow: 0 0 40px rgb(0 0 0 / 0.25); }
  .app { margin-left: 0; }
  .only-narrow { display: grid; }
  .bar {
    display: block;
    position: sticky; top: 0; z-index: 2;
    padding-top: env(safe-area-inset-top, 0px);
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--rule);
  }
  .bar-in {
    display: flex; align-items: center; gap: 6px;
    padding: 6px max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px));
  }
  .bar .brand { flex: 1; font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }

/* the conversation */
.main { flex: 1; width: 100%; max-width: calc(var(--col) + 32px); margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.empty { margin: 14vh 0 0; text-align: center; }
.empty h2 { margin: 0 0 6px; font-size: 24px; font-weight: 600; }
.empty p { margin: 0; color: var(--ink-2); font-size: 14px; }

.msg { margin: 0 0 22px; }
.msg.user { display: flex; flex-direction: column; align-items: flex-end; }
.msg.user .acts { margin: 3px -8px 0 0; }
/* the last message, being changed where it is */
.edit { width: min(100%, 40rem); padding: 8px 10px 8px 14px; background: var(--bg); border: 1px solid var(--film); border-radius: 14px; }
.edit .files { justify-content: flex-start; }
.edit textarea { display: block; width: 100%; max-height: 50vh; max-height: 50dvh; padding: 2px 0; border: 0; outline: 0; background: none; resize: none; font-size: 16px; line-height: 1.5; }
.edit-acts { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
.edit-acts button { padding: 5px 14px; border: 1px solid var(--rule); border-radius: 9px; background: none; font-size: 14px; }
.edit-acts button:hover { background: var(--bubble); }
.edit-acts .go { border-color: var(--film); background: var(--film); color: #FFFFFF; font-weight: 600; }
.edit-acts .go:hover { background: var(--film); }
.bubble {
  max-width: 85%;
  padding: 9px 14px;
  background: var(--bubble);
  border-radius: 16px 16px 4px 16px;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.files { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: flex-start; gap: 6px; margin: 3px 0 6px; white-space: normal; }
.files:last-child { margin-bottom: 3px; }
.files img { display: block; max-width: 160px; max-height: 160px; border-radius: 8px; }
.doc { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 5px 10px; background: var(--bg); border: 0; border-radius: 8px; font: inherit; font-size: 13px; color: inherit; text-align: left; }
button.doc:hover { box-shadow: 0 0 0 1px var(--film); }
.doc b, .chip .ic { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: var(--ink-2); }
.stamp { margin: 6px 0 14px; text-align: center; font-size: 12px; color: var(--ink-2); }

/* Claude's replies, from Markdown */
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin: 0 0 0.8em; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 1.2em 0 0.4em; font-size: 1.05em; font-weight: 650; line-height: 1.4; }
.md h1, .md h2 { font-size: 1.15em; }
.md ul, .md ol { padding-left: 1.5em; }
.md li + li { margin-top: 0.25em; }
.md li > ul, .md li > ol { margin: 0.25em 0 0; }
.md a { color: inherit; text-decoration: underline; text-decoration-color: var(--film); text-decoration-thickness: 2px; text-underline-offset: 0.2em; }
.md code { font-family: var(--mono); font-size: 0.88em; background: var(--code); padding: 0.1em 0.35em; border-radius: 4px; }
.md pre { background: var(--code); padding: 12px 14px; border-radius: 8px; overflow-x: auto; line-height: 1.5; }
.md pre code { background: none; padding: 0; font-size: 13.5px; }
.md blockquote { padding-left: 12px; border-left: 3px solid var(--rule); color: var(--ink-2); }
.md table { display: block; overflow-x: auto; border-collapse: collapse; font-size: 15px; }
.md th, .md td { border: 1px solid var(--rule); padding: 5px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--code); font-weight: 600; }
.md hr { border: 0; border-top: 1px solid var(--rule); margin: 1.2em 0; }
.md .plain { white-space: pre-wrap; }
/* Claude's thinking, as a summary: open while it thinks, folded once it answers */
.md .think { margin: 0 0 0.8em; font-size: 14px; color: var(--ink-2); }
.md .think summary { display: inline-flex; align-items: center; gap: 7px; list-style: none; cursor: pointer; user-select: none; -webkit-user-select: none; }
.md .think summary::-webkit-details-marker { display: none; }
.md .think summary::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-1px) rotate(-45deg); transition: transform 0.15s; }
.md .think[open] summary::after { transform: translateY(-3px) rotate(45deg); }
.md .think summary:hover { color: var(--ink); }
.md .think-body { margin: 6px 0 0; padding: 0 0 0 12px; border-left: 2px solid var(--rule); }
.md .think-body > :last-child { margin-bottom: 0; }
/* math, by KaTeX; until it loads, its TeX */
.md .katex { font-size: 1.08em; }
.md .katex-display { margin: 0.4em 0; padding: 2px 0; overflow-x: auto; overflow-y: hidden; }
.md code.tex { background: none; padding: 0; }
/* code: a bar with its language and a copy button, and colours by highlight.js */
.md .code { margin: 0 0 0.8em; background: var(--code); border-radius: 8px; overflow: hidden; }
.md .code pre { margin: 0; padding-top: 4px; border-radius: 0; }
.md .code-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 4px 0 14px; font: 12px/1.6 var(--mono); color: var(--ink-2); }
.md .code-bar button { border: 0; border-radius: 6px; padding: 2px 8px; background: none; font: 12px/1.6 var(--ui); color: var(--ink-2); }
.md .code-bar button:hover { background: var(--bubble); color: var(--ink); }
.md .hljs-comment, .md .hljs-quote { color: var(--ink-2); font-style: italic; }
.md .hljs-keyword, .md .hljs-doctag, .md .hljs-template-tag, .md .hljs-selector-tag, .md .hljs-type, .md .hljs-meta, .md .hljs-deletion { color: var(--hl-kw); }
.md .hljs-string, .md .hljs-regexp, .md .hljs-meta .hljs-string, .md .hljs-addition { color: var(--hl-str); }
.md .hljs-number, .md .hljs-literal, .md .hljs-symbol, .md .hljs-bullet, .md .hljs-built_in, .md .hljs-attr, .md .hljs-attribute, .md .hljs-property, .md .hljs-selector-attr, .md .hljs-selector-class, .md .hljs-selector-id, .md .hljs-link { color: var(--hl-num); }
.md .hljs-title, .md .hljs-section { color: var(--hl-fn); }
.md .hljs-variable, .md .hljs-template-variable { color: var(--hl-var); }
.md .hljs-name, .md .hljs-tag, .md .hljs-selector-pseudo { color: var(--hl-tag); }
.md .hljs-emphasis { font-style: italic; }
.md .hljs-strong { font-weight: 600; }
.md .search { font-size: 13px; color: var(--ink-2); }
.md .search q { quotes: "「" "」"; }
.md .search q + q { margin-left: 4px; }
.md .search .dots { padding: 0 0 0 6px; vertical-align: middle; }
.msg.claude .net { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }
.md .search .read + .read::before { content: "·"; margin: 0 6px; }
.md .search .read a { color: inherit; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 2px; }
.md .search .read a:hover { color: var(--film); text-decoration-color: currentColor; }
.md .search .dots i { width: 5px; height: 5px; }
.sources { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 0; font-size: 12.5px; line-height: 1.4; }
.sources .lab { color: var(--ink-2); margin-right: 2px; }
.sources a {
  display: inline-block; max-width: min(100%, 280px);
  padding: 3px 10px; border-radius: 999px;
  background: var(--bubble); color: var(--ink); text-decoration: none;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.sources a:hover { background: color-mix(in srgb, var(--film) 14%, var(--bubble)); }
.sources a b { margin-right: 6px; font-weight: 600; color: var(--ink-2); }

.flag { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); }
.acts { display: flex; align-items: center; gap: 2px; margin: 4px 0 0 -8px; font-size: 13px; color: var(--ink-2); }
.acts button { background: none; border: 0; border-radius: 6px; padding: 3px 8px; }
.acts button:hover { background: var(--bubble); color: var(--ink); }
.meta { padding: 3px 8px; font-variant-numeric: tabular-nums; }

/* Claude thinking, before the first words arrive */
.dots { display: inline-flex; gap: 5px; padding: 10px 0 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-2); opacity: 0.3; animation: blink 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: 0.2s; }
.dots i:nth-child(3) { animation-delay: 0.4s; }
.wait { margin-left: 8px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: none; } 40% { opacity: 0.9; transform: translateY(-2px); } }
@media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: 0.6; } }

/* the box you type in, and signing in */
.dock {
  position: sticky; bottom: 0; z-index: 1;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to bottom, transparent, var(--bg) 14px);
}
.dock > * { max-width: var(--col); margin-left: auto; margin-right: auto; }
.notice { margin-bottom: 8px; font-size: 14px; color: var(--alert); }
.opts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin-bottom: 8px; font-size: 13px; color: var(--ink-2); }
.opt { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }   /* a label and its menu wrap together */
.opts select {
  min-width: 0; max-width: 100%;
  padding: 4px 8px;
  font-size: 14px; color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--rule); border-radius: 8px;
}

<script type="module">
import { MODELS, EFFORTS, FILE_KINDS, MAX_FILE, MAX_FILES, MIN_PASSWORD, modelInfo, effortOf, costOf, MAX_TEXT, MAX_STORED, MAX_FETCHES, checkChatInput, checkAccount } from './chat.js';

// ---------- settings ----------
// The Worker in workers/claude-chat: it holds the Anthropic API key, keeps each user's conversations
// and files, and answers only someone signed in
const CHAT_ENDPOINT = 'https://claude-chat.wentaozhang1997.workers.dev';
const SDK = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.133.0';
const MARKED = 'https://cdn.jsdelivr.net/npm/marked@18.1.3/+esm';
const PURIFY = 'https://cdn.jsdelivr.net/npm/dompurify@3.4.17/+esm';
const KATEX = 'https://cdn.jsdelivr.net/npm/katex@0.19.1/+esm';
const KATEX_CSS = 'https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css';
const HLJS = 'https://cdn.jsdelivr.net/npm/highlight.js@11.12.0/lib/common/+esm';
const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.5.438';   // the reader, fetched the first time it opens
const NOTE_EVERY = 60 * 60 * 1000;   // a new time note for Claude after an hour, or on a new day
const LOOK_EVERY = 15 * 1000;        // at most this often, a page coming back into view checks the cloud
const IMAGE_EDGE = 2048;             // pixels on an image's long side, at most, as it is uploaded
const MAX_RESUMES = 3;               // times a reply paused partway through its searches is carried on
// localStorage: who is signed in on this browser, as the token the Worker gave and the account's id
// and name. Then, for each account under a prefix of its own: the model and effort picked last, for
// new conversations; the list of conversations and a copy of each, the originals being in the cloud;
// the one open; the unsent draft; and a message sent but not yet answered, which comes back to the
// box if the page reloads. Before there were accounts these had no prefix but 'chat.', and the
// passcode was kept too.
const AUTH = { token: 'chat.token', me: 'chat.me', flash: 'chat.flash', passcode: 'chat.passcode' };
const keysOf = (p) => ({ model: p + 'model', effort: p + 'effort', index: p + 'index', conv: p + 'c.', current: p + 'current', draft: p + 'draft', sent: p + 'sent', jobs: p + 'jobs' });
const prefixOf = (id) => `chat.u.${id}:`;   // ':' can't be in a name, so no account's keys start with another's

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const log = $('log'), input = $('input'), sendBtn = $('send'), picker = $('model'), thinker = $('effort');
const coarse = matchMedia('(pointer: coarse)').matches;   // a phone or tablet: Enter makes a new line
const narrow = matchMedia('(max-width: 899px)');           // the list of conversations slides in
const ICON = {
  send: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  stop: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2.5" fill="currentColor"/></svg>',
};
// The replies coming in, by conversation: { c, ctrl, stream, stopped, view, node, typed, started },
// view being the messages the reply follows and node the reply as it is drawn. A conversation can be
// left while its reply comes, and others asked meanwhile; each reply lands in its own conversation.
const jobs = new Map();
// Messages that got no answer while another conversation was open, by conversation:
// { c, typed, why, at }. The list marks them, and opening one puts the message back in the box.
const missed = new Map();
let token = store.get(AUTH.token) || '', me = null;
try { me = JSON.parse(store.get(AUTH.me)); } catch (e) {}
if (!token || !me || typeof me.id !== 'string' || typeof me.name !== 'string') { token = ''; me = null; }
// Signed out, the page works on keys nothing else uses, and shows nobody's conversations
const KEY = keysOf(me ? prefixOf(me.id) : 'chat.out:');
const auth = () => 'Bearer ' + token;
picker.innerHTML = MODELS.map((m) => `<option value="${m.id}">${esc(m.name)}</option>`).join('');
const nameOf = (id) => (MODELS.find((m) => m.id === id) || { name: id }).name;
const anEffort = (e) => (EFFORTS.includes(e) ? e : '');   // '' is the model's own
// The first choice is the model's own effort, named for the model in use
function drawEffort() {
  thinker.innerHTML = `<option value="">default (${modelInfo(conv.model).effort})</option>` +
    EFFORTS.map((e) => `<option value="${e}">${e}</option>`).join('');
  thinker.value = conv.effort;
}

// ---------- conversations ----------
// A conversation is { id, title, model, effort, updated, version, synced, dirty, messages }, effort
// being '' for the model's own. Its messages are what the API sees ({ role, content }), in order, plus
// a few fields of the page's own that are left out when sending: at (when), files (the name, size and
// a thumbnail of each file a message carries), model and effort (the ones asked), by (a fallback
// model that answered instead), cost, stopped and truncated. Claude's replies keep every block as it
// came, thinking included: the models check that the conversation behind each thinking block is
// unchanged, so a conversation only ever gains turns at the end or loses them from the end, and its
// messages array is never changed in place. A turn that brings an answer replaces it with a new one;
// a turn that doesn't leaves it be.
//
// The originals live in the cloud (the Worker's Durable Object), and this browser keeps a copy of
// each. version is the cloud's version the copy builds on, synced how many of its first messages the
// cloud has, and dirty marks a change the cloud doesn't have yet. A save sends only what changed.
// If another device saved first, the cloud refuses the save, and this device's version is kept as a
// new conversation rather than written over the other device's turns.
let index = [];   // { id, title, model, effort, updated, version, dirty }, the latest first
try { index = (JSON.parse(store.get(KEY.index)) || []).map((e) => ({ ...e, version: e.version || 0 })); } catch (e) {}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fresh = () => ({ id: newId(), title: '', model: modelInfo(store.get(KEY.model)).id, effort: anEffort(store.get(KEY.effort)), updated: 0, version: 0, synced: 0, dirty: false, messages: [] });
function load(id) {
  try {
    const c = JSON.parse(store.get(KEY.conv + id));
    // A conversation from before the cloud has no version; it goes up at the first chance
    if (c && Array.isArray(c.messages)) return { ...c, model: modelInfo(c.model).id, effort: anEffort(c.effort), version: c.version || 0, synced: c.synced || 0, dirty: c.dirty ?? !c.version };
  } catch (e) {}
  return null;
}
let wanted = store.get(KEY.current);   // the conversation open last time, fetched if this browser has no copy
let conv = load(wanted) || fresh();

// Keeps a copy in this browser. When the storage is full, the oldest copies of conversations the
// cloud already has make room.
function stash(c) {
  const json = JSON.stringify(c);
  while (!store.set(KEY.conv + c.id, json)) {
    const old = index.findLast((e) => e.id !== c.id && e.version && !e.dirty && store.get(KEY.conv + e.id) != null);
    if (!old) { notice('这台设备的存储满了。'); return; }
    store.del(KEY.conv + old.id);
  }
}
function saveIndex() {
  store.set(KEY.index, JSON.stringify(index));
  drawList();
}
function enlist(c) {
  index = [{ id: c.id, title: c.title, model: c.model, effort: c.effort, updated: c.updated, version: c.version, dirty: c.dirty },
    ...index.filter((e) => e.id !== c.id)].sort((a, b) => b.updated - a.updated);
  saveIndex();
}
function unlist(id) {
  store.del(KEY.conv + id);
  index = index.filter((e) => e.id !== id);
  saveIndex();
}
function show(c) {
  conv = c;
  store.set(KEY.current, c.id);
  picker.value = c.model;
  drawEffort();
  notice('');
  render();
  drawList();
  scrollDown();
}
// How many messages two versions of a conversation share from the start
const common = (a, b) => { let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++; return i; };
const userText = (m) => typeof m.content === 'string' ? m.content : m.content.filter((b) => b.type === 'text').map((b) => b.text).join('');
const titleOf = (m) => (userText(m) || (m.files && m.files[0] && m.files[0].name) || '附件').replace(/\s+/g, ' ').trim().slice(0, 40);

// A turn that brought an answer: conversation c becomes `next`, here at once, in the cloud soon. It
// need not be the one open: the answer may have come while another was being read.
function commit(c, next) {

  c.messages = next;
  c.updated = Date.now();
  if (!c.title) c.title = titleOf(next.find((m) => m.role === 'user'));

// ---------- the cloud ----------
let lastLook = 0, queue = Promise.resolve();

const ended = async (res) => res.status === 401 && (await res.clone().json().catch(() => ({}))).error === 'bad_session';

async function api(method, path, body) {

    body: body ? JSON.stringify(body) : undefined,

  let res;
  try { res = await api('PUT', '/chats/' + c.id, { base: c.version, keep, append: sent.slice(keep), title, model, effort }); }
  catch (e) { return; }   // offline: it goes up with the next save, or the next look at the cloud

async function fork(c, version) {

  store.del(KEY.conv + c.id);
  index = index.map((e) => (e.id === c.id ? { ...e, version, dirty: false } : e));
  stash(copy);
  enlist(copy);
  if (conv.id === c.id) { conv = copy; store.set(KEY.current, copy.id); render(); drawList(); }
  notice(`这段对话在另一台设备上也有新消息。这台设备上的版本另存成了「${copy.title}」，原来那段保留另一台设备上的样子。`);

async function pull(id) {
  try {
    const res = await api('GET', '/chats/' + id);
    if (!res.ok) return null;
    const s = await res.json();
    const c = { id: s.id, title: s.title, model: modelInfo(s.model).id, effort: anEffort(s.effort), updated: s.updated, version: s.version, synced: s.messages.length, dirty: false, messages: s.messages };

    enlist(c);

}

// What changed elsewhere: conversations added or deleted on other devices, and new turns in the open

const look = () => inOrder(async () => {
  if (!token) return;
  lastLook = Date.now();
  let chats;
  try {
    const res = await api('GET', '/chats');
    if (!res.ok) return;
    ({ chats } = await res.json());
  } catch (e) { return; }   // offline: the copies here will do
  const cloud = new Map(chats.map((s) => [s.id, s])), mine = new Map(index.map((e) => [e.id, e]));
  const next = chats.map((s) => (mine.get(s.id) || {}).dirty ? mine.get(s.id)
    : { id: s.id, title: s.title, model: modelInfo(s.model).id, effort: anEffort(s.effort), updated: s.updated, version: s.version, dirty: false });
  for (const e of index) {
    if (cloud.has(e.id)) continue;
    const c = e.id === conv.id ? conv : (jobs.get(e.id) || {}).c || load(e.id);
    if (e.version && !e.dirty) {   // deleted on another device
      store.del(KEY.conv + e.id);
      if (e.id === conv.id && !jobs.has(e.id)) show(fresh());
    } else if (c && c.messages.length) {   // never uploaded, or deleted elsewhere after changing here
      if (c.version) Object.assign(c, { version: 0, synced: 0, dirty: true });
      next.push({ ...e, version: 0, dirty: true });
      upload(c);
    }
  }
  index = next.sort((a, b) => b.updated - a.updated);
  saveIndex();
  const id = conv.messages.length || jobs.has(conv.id) || !wanted ? conv.id : wanted;
  wanted = null;
  const s = cloud.get(id);
  if (s && !jobs.has(id) && !conv.dirty && (id !== conv.id || s.version > conv.version)) {
    const c = await pull(id);
    if (c && !jobs.has(id) && (conv.id === id || (!conv.messages.length && !jobs.has(conv.id)))) show(c);
  }
  if (conv.dirty) upload(conv);
});

// Opening a conversation whose reply is coming shows the reply as far as it has got; opening one
// whose message got no answer puts the message back in the box
async function openChat(id) {
  const job = jobs.get(id), miss = missed.get(id);
  if (job) return show(job.c);
  const e = index.find((x) => x.id === id);
  let c = miss && !e ? miss.c : load(id);
  if (!c || (e && !c.dirty && e.version > c.version)) c = (await inOrder(() => pull(id))) || c;
  if (!c) return notice('打不开这段对话：连不上服务器。');
  show(jobs.has(id) ? jobs.get(id).c : c);
  if (miss && missed.get(id) === miss) {
    missed.delete(id);
    drawList();
    giveBack(miss.typed, miss.why);
  }
}

async function remove(id) {
  if (jobs.has(id)) return;
  const e = index.find((x) => x.id === id);
  if (e && e.version) {
    const ok = await inOrder(() => api('DELETE', '/chats/' + id).then((r) => r.ok, () => false));
    if (!ok) { notice('没删掉：连不上服务器，等会儿再试。'); return; }
  }

// ---------- files ----------
// A file picked, pasted or dropped goes up through the Worker to the Files API at once, and the
// message carries only its id, with its name, size and, for an image, a thumbnail for drawing the
// conversation. Images are first made at most IMAGE_EDGE pixels on their long side, and anything but
// JPEG, PNG, GIF and WebP becomes JPEG; text files go up as plain text whatever their extension.
let tray = [];   // { key, name, size, kind, thumb, id, ready }, for the next message

function canvasOf(img, edge) {
  const k = Math.min(1, edge / Math.max(img.width, img.height));

  c.width = Math.max(1, Math.round(img.width * k));
  c.height = Math.max(1, Math.round(img.height * k));

  g.fillStyle = '#FFFFFF';   // what shows through a transparent PNG once it is a JPEG

}

async function prepare(f, item) {
  if (item.kind === 'image') {
    let img;
    try { img = await createImageBitmap(f); } catch (e) { throw new Error('读不出这张图'); }
    item.thumb = canvasOf(img, 240).toDataURL('image/jpeg', 0.75);
    drawTray();
    if (Math.max(img.width, img.height) <= IMAGE_EDGE && f.size <= MAX_FILE.image && FILE_KINDS[f.type]) return { blob: f, type: f.type, name: f.name };
    const blob = await new Promise((ok) => canvasOf(img, IMAGE_EDGE).toBlob(ok, 'image/jpeg', 0.88));

  }
  if (item.kind === 'pdf') {
    if (f.size > MAX_FILE.pdf) throw new Error(`PDF 最大 ${MAX_FILE.pdf / 1024 / 1024} MB`);

  if (text.includes('\u0000')) throw new Error('看起来不是纯文本');

  if (blob.size > MAX_FILE.text) throw new Error(`文本最大 ${MAX_FILE.text / 1024 / 1024} MB`);
  return { blob, type: 'text/plain', name: f.name };
}

function addFiles(list) {
  for (const f of list) {
    if (tray.length >= MAX_FILES) { notice(`一条消息最多带 ${MAX_FILES} 个文件。`); break; }
    const item = { key: newId(), name: f.name || '文件', size: f.size, kind: kindOf(f), ready: false };
    if (!item.kind) { notice(`「${item.name}」传不了：只能传图片、PDF 和纯文本文件（txt、md、csv、代码……）。`); continue; }
    tray.push(item);
    drawTray();
    prepare(f, item).then(async ({ blob, type, name }) => {
      const res = await fetch(CHAT_ENDPOINT + '/files', {
        method: 'POST',
        headers: { Authorization: auth(), 'Content-Type': type, 'X-File-Name': encodeURIComponent(name) },
        body: blob,
      });
      const r = await res.json().catch(() => ({}));
      if (res.status === 401 && r.error === 'bad_session') { signOut(EXPIRED, false); throw new Error(EXPIRED); }
      if (!res.ok) throw new Error(r.error === 'too_big' ? '文件太大了' : r.error === 'rate_limited' ? '传得太快了，等一分钟' : r.error || res.status);

      Object.assign(item, { id: r.id, name: r.name || name, size: r.size || blob.size, ready: true });
      drawTray();
    }).catch((err) => {
      if (!tray.includes(item)) return;
      tray = tray.filter((x) => x !== item);

}

const forgetFile = (id) => { if (id) fetch(CHAT_ENDPOINT + '/files/' + id, { method: 'DELETE', headers: { Authorization: auth() } }).catch(() => {}); };

    (THUMB.test(f.thumb || '') ? `<img src="${f.thumb}" alt="">` : `<span class="ic">${f.kind === 'pdf' ? 'PDF' : f.kind === 'text' ? 'TXT' : 'IMG'}</span>`) +
    `<span class="nm"${f.kind === 'pdf' && f.ready ? ` data-pdf="${esc(f.id)}" data-name="${esc(f.name)}" title="打开来读"` : ''}><span>${esc(f.name)}</span><span class="sz">${f.ready ? sizeOf(f.size) : f.link ? '在取…' : '上传中…'}</span></span>` +

const DOTS = '<span class="dots" role="img" aria-label="Claude 在想"><i></i><i></i><i></i></span>';

// A conversation as a Markdown file, saved by the browser: what was said, the thinking summaries,

function markdownOf(c) {
  const when = (t) => new Date(t).toLocaleString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
  const out = [`# ${c.title || '对话'}`, ''];
  for (const m of c.messages) {
    if (m.role === 'user') {
      out.push(`**我**${m.at ? `（${when(m.at)}）` : ''}：`, '');
      if (m.files && m.files.length) out.push(m.files.map((f) => `[附件：${f.name}]`).join(' '), '');
      if (userText(m)) out.push(userText(m), '');
    } else if (m.role === 'assistant') {
      const head = [m.by || (m.model && nameOf(m.model)), m.effort].filter(Boolean).join(' · ');
      out.push(`**Claude**${head ? `（${head}）` : ''}：`, '');
      for (const p of partsOf(m.content)) {
        if (p.text) out.push(p.text.trim(), '');
        else if (p.think != null) out.push(['> **思考过程**', ...p.think.trim().split('\n')].join('\n> '), '');
        else if (p.reads) {

    const res = await fetch(CHAT_ENDPOINT + '/files/from-link', { method: 'POST', headers: { Authorization: auth(), 'Content-Type': 'application/json' }, body: JSON.stringify({ url: u.href }) });
    const r = await res.json().catch(() => ({}));
    if (res.status === 401 && r.error === 'bad_session') { signOut(EXPIRED, false); throw new Error(EXPIRED); }
    if (!res.ok) throw new Error(LINK_FAILS[r.error] || (/^link_status_\d+$/.test(r.error) ? `这个链接打不开（${r.error.slice(12)}）。` : `出错了：${r.error || res.status}`));
    if (!tray.includes(item)) return forgetFile(r.id);   // taken off while it came
    Object.assign(item, { id: r.id, name: r.name || name, size: r.size, ready: true });
    drawTray();
  })().catch((err) => {

    tray = tray.filter((x) => x !== item);

}

// ---------- the PDF reader ----------
// A PDF a message carries opens beside the conversation (over it, on a narrow screen), drawn by pdf.js
// from the copy the Worker keeps of each PDF. Text can be found in it, and a selection quoted into the
// box with its page, for asking Claude about.
// pdf.js once loaded, with the PDF it shows (id, and the task that loaded it); and the bytes of the
// PDFs opened this visit, the latest up to 64 MB of them, so that going back to one fetches nothing
const pdfjs = {}, pdfBytes = new Map(), PDF_BYTES = 64 * 1024 * 1024;
let readerSeq = 0;
function keepBytes(id, bytes) {
  pdfBytes.set(id, bytes);
  let total = 0;
  for (const b of pdfBytes.values()) total += b.length;
  for (const [k, b] of pdfBytes) {
    if (total <= PDF_BYTES || k === id) break;
    pdfBytes.delete(k);
    total -= b.length;
  }
}
const dropTask = (task) => task.destroy().catch(() => {});
// Loads pdf.js and sets up the viewer, once, however many PDFs are opened while it loads; after a
// failure, the next PDF opened tries again. The viewer waits for pdf.js's stylesheet, which gives the
// pages their size: a page without one is never seen, and so never drawn.
let readerLoad = null, readerStyle = null;
function readerLib() {
  return readerLoad ||= setUpReader().catch((e) => { readerLoad = null; throw e; });
}
function readerCss() {
  return readerStyle ||= new Promise((ok, fail) => {
    const link = Object.assign(document.createElement('link'), { rel: 'stylesheet', href: `${PDFJS}/web/pdf_viewer.css` });
    link.onload = ok;
    link.onerror = () => { link.remove(); readerStyle = null; fail(new Error('css')); };
    document.head.append(link);
  });
}
async function setUpReader() {
  let lib, ui;
  try {
    [lib] = await Promise.all([import(`${PDFJS}/build/pdf.min.mjs`), readerCss()]);
    lib.GlobalWorkerOptions.workerSrc = `${PDFJS}/build/pdf.worker.min.mjs`;
    globalThis.pdfjsLib = lib;   // the viewer finds pdf.js here
    ui = await import(`${PDFJS}/web/pdf_viewer.mjs`);
  } catch (e) { throw new Error('阅读器没加载上：连不上 jsDelivr，检查一下网络再试。'); }
  const bus = new ui.EventBus();
  const links = new ui.PDFLinkService({ eventBus: bus, externalLinkTarget: ui.LinkTarget.BLANK, externalLinkRel: 'noopener noreferrer' });
  const finder = new ui.PDFFindController({ eventBus: bus, linkService: links });
  const viewer = new ui.PDFViewer({ container: $('reader-scroll'), viewer: $('reader-pages'), eventBus: bus, linkService: links, findController: finder });
  links.setViewer(viewer);
  bus.on('pagesinit', () => { viewer.currentScaleValue = 'page-width'; });
  bus.on('pagechanging', ({ pageNumber }) => { $('reader-at').textContent = `${pageNumber} / ${viewer.pagesCount}`; });
  bus.on('updatefindmatchescount', ({ matchesCount }) => { $('reader-found').textContent = matchesCount.total ? `${matchesCount.current} / ${matchesCount.total}` : ''; });
  bus.on('updatefindcontrolstate', ({ state }) => { if (state === 1) $('reader-found').textContent = '没找到'; });

  // none. Pages that change size are looked at again for which ones are in view, to be drawn.
  const resized = new ResizeObserver(() => {

}
async function openReader(id, name) {
  if (!id) return;
  const seq = ++readerSeq, say = (t) => { $('reader-msg').textContent = t; $('reader-msg').hidden = !t; };
  document.body.classList.add('reading');
  $('reader').hidden = false;
  $('reader-name').textContent = name || 'PDF';
  if (pdfjs.id === id) return say('');   // still there, at the page it was left on
  $('reader-at').textContent = '';
  $('reader-found').textContent = '';
  $('reader-find').value = '';
  say('在打开…');
  try {
    const { lib, viewer, links } = await readerLib();
    if (pdfjs.task) {   // the one before goes at once, not to be seen under this one's name
      viewer.setDocument(null);
      links.setDocument(null);
      dropTask(pdfjs.task);
      pdfjs.task = pdfjs.id = null;
    }
    let bytes = pdfBytes.get(id);
    if (!bytes) {
      const res = await fetch(CHAT_ENDPOINT + '/files/' + id, { headers: { Authorization: auth() } });
      if (await ended(res)) return signOut(EXPIRED, false);
      if (res.status === 404) throw new Error('这份 PDF 是加阅读器之前发的，当时没存副本，打不开。');
      if (!res.ok) throw new Error('打不开：连不上服务器。');
      bytes = new Uint8Array(await res.arrayBuffer());
      keepBytes(id, bytes);
    }
    if (seq !== readerSeq) return;   // another one was opened meanwhile, or the reader closed
    // pdf.js hands the bytes to its worker, which takes them, hence a copy
    const task = lib.getDocument({ data: bytes.slice(), cMapUrl: `${PDFJS}/cmaps/`, cMapPacked: true, standardFontDataUrl: `${PDFJS}/standard_fonts/`, wasmUrl: `${PDFJS}/wasm/`, iccUrl: `${PDFJS}/iccs/` });

      dropTask(task);
      throw new Error('这份 PDF 打不开，可能坏了。');
    }
    if (seq !== readerSeq) return dropTask(task);
    viewer.setDocument(doc);
    links.setDocument(doc, null);
    Object.assign(pdfjs, { id, task });
    $('reader-at').textContent = `1 / ${doc.numPages}`;

    if (seq === readerSeq) say(e.message || '打不开这份 PDF。');
  }
}
function closeReader() {
  readerSeq++;
  document.body.classList.remove('reading');
  $('reader').hidden = true;
  $('reader-quote').hidden = true;

}
$('reader-close').addEventListener('click', closeReader);
$('reader-in').addEventListener('click', () => { if (pdfjs.viewer && pdfjs.viewer.pdfDocument) pdfjs.viewer.increaseScale(); });
$('reader-out').addEventListener('click', () => { if (pdfjs.viewer && pdfjs.viewer.pdfDocument) pdfjs.viewer.decreaseScale(); });
// Finding: as it is typed, and Enter (Shift+Enter) for the next (the one before)
function findInPdf(again, back) {

// Quoting: a selection in the PDF shows the button, which puts it in the box with its page. What was

let picked = null, pressed = 0;

// ---------- searching ----------
// The titles here are searched at once, and the words of every message by the cloud, a moment after
// typing stops. The cloud gives older messages their words a few at a time, so while some still lack

let findTimer = 0, findSeq = 0;
$('find').addEventListener('input', () => {

// ---------- talking to Claude ----------
// The send button, the menus and 新对话, for the conversation open: while its reply comes, the button
// stops it and the menus wait. Other conversations can be asked meanwhile.
function updateSend() {
  const job = jobs.get(conv.id), stopping = !!job;
  if (sendBtn.classList.contains('stop') !== stopping || !sendBtn.firstChild) {
    sendBtn.classList.toggle('stop', stopping);
    sendBtn.setAttribute('aria-label', stopping ? '停止' : '发送');

// What goes back to the API of a reply. Empty text blocks are refused there. After a refusal
// fallback partway through a reply, the declining model's thinking before the switch is left out,
// while the fallback block stays where it was, as the API asks.
function keepable(content) {
  const cut = content.map((b) => b.type).lastIndexOf('fallback');
  return content.filter((b, i) => (b.type !== 'text' || b.text.trim()) && (i >= cut || b.type === 'text' || b.type === 'fallback'));
}

function problemText(err) {
  const st = err && err.status, why = String((err && err.message) || err);
  if (err && err.kind === 'connection_error') return '连接中途断了，没收到回复，再发一次试试。';
  if (err && err.kind === 'lost') return '这条回复在服务器上断了，再发一次试试。';
  if (st === 404 && why === 'no_reply') return '这条回复在服务器上找不到了，再发一次试试。';
  if (st === 429) return why === 'rate_limited' ? '发得太快了，等一分钟再试。' : 'Claude 那边限流了，稍后再试。';
  if (st === 403 && why === 'not_your_file') return '有个附件已经失效了，去掉它，重新传一次。';
  if (st === 503 && why === 'not_configured') return '服务器还没配置好：Worker 缺 ANTHROPIC_API_KEY 或 CHAT_PASSCODE。';
  if (st === 400 && why === 'too_long') return '这段对话太长了，开一个新对话吧。';
  if (st === 400 && /credit|balance|billing|spend/i.test(why)) return 'Anthropic API 的余额或花费上限用完了。';
  if (st === 400 && /retention/i.test(why)) return `这个模型要求组织开着 30 天的数据保留，换个模型试试：${why}`;
  if (st === 401 || st === 403) return `Anthropic API key 不能用了：${why}`;
  if (st >= 500) return 'Claude 暂时过载或出错了，稍后再试。';
  if (!st && /stream ended/i.test(why)) return '连接中途断了，没收到回复，再发一次试试。';
  if (!st && /fetch|network|load failed|connection|terminated/i.test(why)) return '连不上服务器，检查一下网络。（在中国大陆，workers.dev 要翻墙才打得开。）';
  return `出错了：${why}`;
}

// A request that brought no answer: the message and its files go back in the box, so pressing send
// tries again
function giveBack(typed, why) {
  if (typed && typed.edit) {   // a changed message: back in its editor, drawn once no reply is coming
    const i = lastAsked(conv.messages);
    if (i >= 0) editing = { id: conv.id, msg: conv.messages[i], text: typed.text, focus: true };
    if (!jobs.has(conv.id)) render();
    return notice(why);
  }
  if (typed && !input.value.trim()) { input.value = typed.text; grow(); store.set(KEY.draft, typed.text); }
  if (typed && typed.files.length && !tray.length) { tray = typed.files.map((f) => ({ ...f, key: newId(), ready: true })); drawTray(); }
  notice(why);
}

// ---------- a reply that outlasts a lost connection ----------
// Claude's reply is asked for, and read to its end, by the user's own object at the Worker, whatever
// becomes of this page's connection (see workers/claude-chat/store.js). The page reads its lines as
// they come and keeps them. When the connection drops (a lift, a train, a phone put away), it waits
// for the network and asks for the rest of the same reply, from the line it had got to, and reads
// on where it was: nothing is asked twice, and nothing is lost. A reply coming is noted in this
// browser too, so that a page closed or reloaded meanwhile reads on from the server when it opens.
const RETRY = [1000, 2000, 4000, 8000, 15000];   // ms between tries after a lost connection, the last over and over
const notedJobs = () => { try { return JSON.parse(store.get(KEY.jobs)) || {}; } catch (e) { return {}; } };
function note(id, j) {   // conversation id -> what reading on needs, or null once the reply has ended
  const all = notedJobs();
  if (j) all[id] = j;
  else delete all[id];
  if (Object.keys(all).length) store.set(KEY.jobs, JSON.stringify(all));
  else store.del(KEY.jobs);
}
// A reply's lines as they come, whole, each kept in `lines`; the blank lines that keep a quiet
// connection open are dropped. A line saying the reply failed at the server becomes an error that
// isn't tried again.
function keeper(lines) {
  const dec = new TextDecoder(), enc = new TextEncoder();
  let rest = '';
  return new TransformStream({
    transform(chunk, controller) {
      const parts = (rest + dec.decode(chunk, { stream: true })).split('\n');
      rest = parts.pop();
      for (const line of parts) {
        if (!line.trim()) continue;
        if (line.startsWith('{"type":"error"')) {
          const x = JSON.parse(line);
          throw Object.assign(new Error(x.error.message), { status: x.status, kind: x.error.type, failed: true });
        }
        lines.push(line);
        controller.enqueue(enc.encode(line + '\n'));
      }
    },
  });
}
// The lines read before a lost connection, then the rest as it comes
function replay(before, rest) {
  if (!before.length) return rest;
  let head = new TextEncoder().encode(before.join('\n') + '\n');
  const reader = rest.getReader();
  return new ReadableStream({
    async pull(controller) {
      if (head) { controller.enqueue(head); head = null; return; }
      const { done, value } = await reader.read();
      if (done) controller.close();
      else controller.enqueue(value);
    },
    cancel: (reason) => reader.cancel(reason),
  });
}

const failed = (e) => (e && e.failed ? e : e && e.cause && e.cause.failed ? e.cause : null);

// back, the page is looked at again, or the reply is stopped
function lost(job, tries) {
  job.net.hidden = false;

    const seen = () => { if (document.visibilityState === 'visible') done(); };
    const done = () => { clearTimeout(t); removeEventListener('online', done); document.removeEventListener('visibilitychange', seen); job.wake = null; ok(); };
    const t = setTimeout(done, RETRY[Math.min(tries, RETRY.length - 1)]);

// Reads reply `rid` to its end and returns its message: asked for with `body`, unless the server has

// connection. `onEvent` gets each event, those read before a lost connection again too.

  const { BetaMessageStream } = await import(`${SDK}/lib/BetaMessageStream.mjs/+esm`);
  const lines = [];

    if (job.stopped) throw new Error('stopped');
    const following = asked;
    let res;
    try {
      res = following ? await fetch(`${CHAT_ENDPOINT}/replies/${rid}?from=${lines.length}`, { headers: { Authorization: auth() }, signal: job.ctrl.signal })

    } catch (e) {

      if (following && (res.status === 429 || res.status >= 500)) { await lost(job, tries++); continue; }
      throw e;
    }
    asked = true;
    job.net.hidden = true;
    const had = lines.length;
    const stream = job.stream = BetaMessageStream.fromReadableStream(replay(lines.slice(), res.body.pipeThrough(keeper(lines))));
    if (job.stopped) stream.abort();
    stream.on('streamEvent', onEvent);

      const msg = await stream.finalMessage();
      if (msg.stop_reason) return msg;   // whole; one that ended before its end reads on
    } catch (e) {

// One turn. `base` is the conversation it builds on (all of it, all but the last reply when asking
// again, or all before the last message when that is changed), and `extra` the user's new message
// with its time note, if any. The conversation itself changes only when an answer comes, and
// `retitle` then gives a changed first message its own title. A long run of searches can make the
// API pause a reply partway (stop reason pause_turn): the reply so far then goes back as it is, and
// the API carries on with it. `resumed` is a reply this browser noted, read on after a reload.
async function run(c, base, extra, typed, { retitle = false, resumed = null } = {}) {
  notice('');

  const ask = (sofar) => ({ model, effort, messages: (sofar.length ? view.concat([{ role: 'assistant', content: sofar }]) : view).map(({ role, content }) => ({ role, content })) });
  const problem = checkChatInput(ask([]));
  if (problem) return giveBack(typed, problem === 'too_long' ? '这段对话太长了，开一个新对话吧。' : `发不出去（${problem}）。`);

  const node = document.createElement('article');
  node.className = 'msg claude';
  node.setAttribute('aria-busy', 'true');
  node.innerHTML = `<div class="md">${DOTS}<span class="wait"></span></div><p class="net" role="status" hidden>网络断了。Claude 那边还在接着回答，网络一回来就接着收。</p>`;
  const job = { c, ctrl: new AbortController(), stream: null, stopped: false, view, node, typed, started: resumed ? resumed.started : Date.now(), opened: new Map(),
    rid: null, rids: [], wake: null, net: node.querySelector('.net') };

  if (c === conv) store.set(KEY.current, c.id);   // a page reloaded meanwhile opens it
  // A summary the reader opens or closes stays so while the reply goes on
  node.addEventListener('click', (e) => {
    const d = e.target.closest('summary') && e.target.closest('details.think');
    if (d) job.opened.set(+d.dataset.k, !d.open);
  });
  jobs.set(c.id, job);
  render();
  drawList();
  scrollDown();
  const out = node.firstChild;
  const here = () => conv === c;   // the conversation is the one open
  // No answer: the message goes back in the box, or, if another conversation is open now, waits in
  // this one, which the list marks
  const fail = (why) => {
    if (here()) return giveBack(typed, why);
    const title = c.title || titleOf(view.find((m) => m.role === 'user'));
    if (!typed) return notice(`「${title}」重新生成没成功：${why}`);
    missed.set(c.id, { c, typed, why, at: Date.now() });   // the reason shows when it is opened
    notice(`「${title}」没收到回复，在左边点开它，消息会回到输入框。`);
  };

  const t0 = job.started, wait = out.querySelector('.wait');
  const tick = setInterval(() => {
    if (shown) return paint();   // the thinking shown counts its seconds
    const sec = Math.round((Date.now() - t0) / 1000);
    if (sec >= 3) wait.textContent = sec < 60 ? `想了 ${sec} 秒` : `想了 ${Math.floor(sec / 60)} 分 ${String(sec % 60).padStart(2, '0')} 秒`;

  // What has come: the reply so far from the requests before a pause, and the one coming in now
  let sofar = [], snap = null, queued = false, shown = '', firstWord = 0;
  const live = () => (snap ? sofar.concat(snap.content) : sofar);
  const thoughtFor = () => (firstWord ? Math.max(1, Math.round((firstWord - t0) / 1000)) : 0);
  const paint = () => {
    queued = false;
    const html = bodyHtml(live(), { live: true, opened: job.opened, secs: Math.round((Date.now() - t0) / 1000), thought: thoughtFor() });
    if (!html || html === shown) return;   // nothing to show yet: the dots and the timer stay
    shown = html;
    const stick = node.isConnected && nearBottom();
    out.innerHTML = html;
    if (stick) scrollDown();
  };
  let msg, cost = resumed ? resumed.cost : undefined;
  if (resumed) sofar = resumed.sofar || [];
  const onEvent = (e, s) => {
    snap = s;
    if (!firstWord && s.content.some((b) => (b.type === 'text' && b.text) || b.type === 'server_tool_use')) firstWord = Date.now();
    if (!queued) { queued = true; requestAnimationFrame(paint); }
  };
  try {
    for (let round = resumed ? resumed.round : 0; ; round++) {
      const again = resumed && round === resumed.round, rid = again ? resumed.rid : newId();
      job.rid = rid;
      job.rids.push(rid);
      note(c.id, { rid, round, keep: base.length, extra, typed, sofar, cost, retitle, model, effort, started: job.started });
      msg = await follow(job, rid, again ? null : JSON.stringify({ ...ask(sofar), reply: rid }), onEvent);
      const spent = costOf(model, msg.usage);
      if (spent != null) cost = (cost || 0) + spent;
      // A refusal can come partway through a reply, and the part already shown is not an answer
      if (msg.stop_reason === 'refusal') return fail('Claude 的安全策略拦下了这条消息，没有回答。换个说法试试？');
      sofar = sofar.concat(keepable(msg.content));
      snap = null;
      if (msg.stop_reason !== 'pause_turn') break;
      if (round === MAX_RESUMES) throw new Error('paused too often');   // kept as far as it got, below
    }
    if (!sofar.some((b) => b.type === 'text')) return fail('Claude 这次没说话，再试一次？');
    const pondered = sofar.some((b) => b.type === 'thinking' && b.thinking && b.thinking.trim()), first = !base.some((m) => m.role === 'assistant');
    const reply = {
      role: 'assistant', content: sofar, at: Date.now(), model, effort, cost, thought: pondered ? thoughtFor() || undefined : undefined,
      by: msg.model && !msg.model.startsWith(model) ? msg.model : undefined,
      truncated: msg.stop_reason === 'max_tokens' || undefined,
    };
    // What Claude read comes with its reply; a PDF it fetched comes whole, and can make the reply too
    // big for the cloud to keep, so it isn't kept
    if (JSON.stringify(reply).length > MAX_STORED) return fail('Claude 读到的东西太大，这条回复存不下。网上的 PDF 请用回形针旁边的链接按钮加进来，再问一次。');
    if (retitle) c.title = '';
    commit(c, view.concat([reply]));
    if (first) nameIt(c);
  } catch (err) {
    const text = textOf({ content: live() });
    if (err.status === 401 && err.message === 'bad_session') {
      if (here()) giveBack(typed, '');
      signOut(EXPIRED, false);
    } else if (text.trim()) {
      // Stopped, or cut off partway: what came is kept as plain text, without its thinking and
      // searches, and 重新生成 asks again
      commit(c, view.concat([{ role: 'assistant', content: [{ type: 'text', text: text.trimEnd() }], at: Date.now(), model, effort, stopped: true }]));
      if (!job.stopped) notice(here() ? '回复中途断了，点「重新生成」可以重来。' : `「${c.title}」的回复中途断了，打开它点「重新生成」可以重来。`);
    } else if (job.stopped) giveBack(typed, '');   // stopped before a word: the message goes back in the box
    else fail(problemText(err));
  } finally {
    clearInterval(tick);
    if (job.wake) job.wake();
    note(c.id, null);
    // The server keeps each reply until it is told the page has it: told now, as far as the network allows
    for (const rid of job.rids) api('DELETE', '/replies/' + rid).catch(() => {});
    ended = true;
    if (release) release();
    if (typed && store.get(KEY.sent) === typed.text) store.del(KEY.sent);
    jobs.delete(c.id);
    if (here()) {
      const stick = nearBottom();
      render();
      if (stick) scrollDown();
    } else updateSend();
    drawList();
  }
}

// After its first answer, Haiku names a conversation whose first message is long, or only files: till
// then, and if no name comes, its first 40 characters are its title. A title changed meanwhile stays.
async function nameIt(c) {
  const user = c.messages.find((m) => m.role === 'user'), reply = c.messages.find((m) => m.role === 'assistant');
  const said = userText(user), before = c.title;
  if ((said && said.length <= 20) || before !== titleOf(user)) return;
  let title = '';
  try {
    const res = await api('POST', '/title', { user: said || (user.files || []).map((f) => f.name).join('、'), reply: textOf(reply).slice(0, 2000) });
    if (res.ok) ({ title } = await res.json());
  } catch (e) { return; }
  const now = jobs.has(c.id) ? jobs.get(c.id).c : conv.id === c.id ? conv : load(c.id);
  if (title && now && now.title === before && index.some((e) => e.id === c.id)) setTitle(c.id, title);
}

function sendTyped() {
  const text = input.value.trim();
  if (jobs.has(conv.id) || tray.some((f) => !f.ready)) return;
  const files = tray.slice();
  if (!text && !files.length) return;
  if (!token) return;
  if (text.length > MAX_TEXT) return notice(`一条消息最多 ${MAX_TEXT} 个字符，这条有 ${text.length} 个。`);
  const now = Date.now(), user = { role: 'user', content: contentOf(text, files), at: now };
  if (files.length) user.files = files.map(({ id, name, size, kind, thumb, link }) => ({ id, name, size, kind, ...(thumb ? { thumb } : {}), ...(link ? { link } : {}) }));
  const extra = [user];
  if (needsNote(now)) extra.push({ role: 'system', content: noteFor(now), at: now });
  input.value = '';
  tray = [];
  drawTray();
  grow();
  store.del(KEY.draft);
  store.set(KEY.sent, text);
  if (missed.delete(conv.id)) drawList();
  run(conv, conv.messages, extra, { text, files });
}

function again() {
  if (jobs.has(conv.id) || !conv.messages.length || conv.messages.at(-1).role !== 'assistant') return;
  run(conv, conv.messages.slice(0, -1), [], null);
}

// ---------- changing the last message ----------
// The last message can be changed where it is and sent again. It and the reply to it then give way to
// the new one, as a conversation only ever loses turns from its end, so the earlier turns keep their
// thinking. Its files stay with it. Enter sends on a computer, Escape lets it be.
function fitEdit(box) {
  box.style.height = 'auto';
  box.style.height = box.scrollHeight + 'px';
}
function startEdit() {
  const i = lastAsked(conv.messages);
  if (i < 0 || jobs.has(conv.id) || !token) return;
  editing = { id: conv.id, msg: conv.messages[i], text: userText(conv.messages[i]), focus: true };
  render();
}
function endEdit() {
  editing = null;
  render();
}
function sendEdit() {
  const c = conv, i = lastAsked(c.messages);
  if (!editing || jobs.has(c.id) || !token || i < 0 || c.messages[i] !== editing.msg) return endEdit();
  const old = c.messages[i], text = editing.text.trim(), held = Array.isArray(old.content) ? old.content.filter((b) => b.type !== 'text') : [];
  if (!text && !held.length) return;   // nothing left to send
  if (text.length > MAX_TEXT) return notice(`一条消息最多 ${MAX_TEXT} 个字符，这条有 ${text.length} 个。`);
  const now = Date.now(), base = c.messages.slice(0, i);
  const user = { role: 'user', content: held.length ? held.concat(text ? [{ type: 'text', text }] : []) : text, at: now, ...(old.files ? { files: old.files } : {}) };
  const extra = [user];
  if (needsNote(now, base)) extra.push({ role: 'system', content: noteFor(now), at: now });
  // A first message's own title follows it; a name given by Haiku or by hand stays
  const retitle = !base.some((m) => m.role === 'user') && c.title === titleOf(old);
  editing = null;
  store.set(KEY.sent, text);
  if (missed.delete(c.id)) drawList();
  run(c, base, extra, { text, files: old.files || [], edit: true }, { retitle });
}

// Stops the reply coming in the conversation open
function stop() {
  const job = jobs.get(conv.id);
  if (!job) return;
  job.stopped = true;
  job.ctrl.abort();
  if (job.stream) job.stream.abort();
  if (job.wake) job.wake();
  // The reply would go on at the server, which is told, as far as the network allows
  if (job.rid) api('POST', `/replies/${job.rid}/stop`).catch(() => {});
}

// Replies that were coming when this page was last closed or reloaded read on from the server, in
// the conversations they were coming in: a new one, kept only once it has an answer, made again
// from what was noted. A reply another tab is still reading is left to it.
async function readOn() {
  const was = wanted;   // the conversation open last time, before the cloud is looked at
  for (const [id, j] of Object.entries(notedJobs())) {
    if (jobs.has(id) || !j || !j.rid || !j.extra) continue;
    if (navigator.locks && !(await navigator.locks.request('chat.reply:' + id, { ifAvailable: true }, (held) => !!held))) continue;
    const c = (conv.id === id ? conv : load(id)) || (j.keep === 0 ? { ...fresh(), id, model: j.model, effort: anEffort(j.effort) } : null);
    if (!c || c.messages.length < j.keep) { note(id, null); continue; }
    if (was === id && conv.id !== id && !conv.messages.length && !jobs.has(conv.id)) show(c);
    run(c, c.messages.slice(0, j.keep), j.extra, j.typed, { retitle: j.retitle, resumed: j });
  }
}

// ---------- the box you type in, the model and the effort ----------
function grow() {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
  updateSend();
}
input.addEventListener('input', () => { grow(); store.set(KEY.draft, input.value); });
input.addEventListener('keydown', (e) => {
  // On a computer Enter sends and Shift+Enter starts a new line; on a phone the button sends.
  // Never while an input method is still composing, as when picking a Chinese character.
  if (e.key !== 'Enter' || e.shiftKey || coarse || e.isComposing || e.keyCode === 229) return;
  e.preventDefault();
  sendTyped();
});
composer.addEventListener('submit', (e) => { e.preventDefault(); if (jobs.has(conv.id)) stop(); else sendTyped(); });

// The model and the effort apply to this conversation from its next message on, and new conversations
// start with them. A change goes up to the cloud with the conversation.
function changed() {
  if (!conv.messages.length) return;
  conv.dirty = true;
  stash(conv);
  enlist(conv);
  upload(conv);
}
picker.addEventListener('change', () => {
  const id = modelInfo(picker.value).id;
  store.set(KEY.model, id);
  if (conv.model === id) return;
  conv.model = id;
  drawEffort();   // the default names the new model's effort
  changed();
});
thinker.addEventListener('change', () => {
  const e = anEffort(thinker.value);
  store.set(KEY.effort, e);
  if (conv.effort === e) return;
  conv.effort = e;
  changed();
});

log.addEventListener('click', async (e) => {
  const pdf = e.target.closest('[data-pdf]');
  if (pdf) return openReader(pdf.dataset.pdf, pdf.dataset.name);
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'again') return again();
  if (b.dataset.act === 'edit') return startEdit();
  if (b.dataset.act === 'edit-cancel') return endEdit();
  if (b.dataset.act === 'edit-send') return sendEdit();
  const code = b.dataset.act === 'copy-code' && b.closest('.code');
  const job = jobs.get(conv.id), m = !code && (job ? job.view : conv.messages)[+b.closest('[data-i]').dataset.i];
  try {
    await navigator.clipboard.writeText(code ? code.querySelector('pre').textContent : textOf(m));
    b.textContent = '已复制';
    setTimeout(() => { b.textContent = '复制'; }, 1500);
  } catch (err) {}
});

log.addEventListener('input', (e) => {
  if (!editing || !e.target.matches('.edit textarea')) return;
  editing.text = e.target.value;
  fitEdit(e.target);
});
log.addEventListener('keydown', (e) => {
  if (!e.target.matches('.edit textarea')) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); endEdit(); }
  else if (e.key === 'Enter' && !e.shiftKey && !coarse && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); sendEdit(); }
});

// ---------- accounts ----------
// Each user signs in with their own name and password, and anyone with the invite code can open an
// account. Signing in or out reloads the page, which then reads that account's own keys.
let joining = false;   // the form opens an account rather than signing in
const legacy = store.get(AUTH.passcode);   // a browser that used the passcode, from before there were accounts
function drawLock() {
  $('lock-title').textContent = $('lock-go').textContent = joining ? '注册' : '登录';
  $('lock-switch').textContent = joining ? '已有账号？登录' : '没有账号？注册';
  $('acct-invite').hidden = !joining;
  $('acct-invite').required = joining;
  $('acct-pass').setAttribute('autocomplete', joining ? 'new-password' : 'current-password');
  $('acct-name').placeholder = joining ? '用户名：2 到 24 个字，不分大小写' : '用户名';
  $('acct-pass').placeholder = joining ? `密码：至少 ${MIN_PASSWORD} 个字符` : '密码';
  $('lock-fine').textContent = !joining ? '这是私人页面，登录后才能用。'
    : legacy && $('acct-invite').value === legacy ? '现在要用账号了。邀请码就是原来的口令，已经替你填好；原来的对话归第一个注册的账号。'
    : '注册要邀请码，找网站的主人要。';
}
function lock(msg) {
  composer.hidden = true;
  $('opts').hidden = true;
  $('lock').hidden = false;
  $('lock-msg').textContent = msg;
  drawLock();
  if (!coarse) $(joining || !$('acct-name').value ? 'acct-name' : 'acct-pass').focus();
}
function unlock() {
  $('lock').hidden = true;
  composer.hidden = false;
  $('opts').hidden = false;
  $('who').textContent = me.name;
  $('side-foot').hidden = false;
  $('find-box').hidden = false;
  if (!coarse) input.focus();
}
$('lock-switch').addEventListener('click', () => {
  joining = !joining;
  $('lock-msg').textContent = '';
  drawLock();
  if (!coarse) $('acct-name').focus();
});

// The copies from before there were accounts belong to the first account, which took over their
// originals in the cloud
function adopt(p) {
  const from = keysOf('chat.'), to = keysOf(p), moves = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(from.conv)) moves.push([k, to.conv + k.slice(from.conv.length)]);
    }
  } catch (e) { return; }
  for (const k of ['model', 'effort', 'index', 'current', 'draft', 'sent']) moves.push([from[k], to[k]]);
  for (const [a, b] of moves) {
    const v = store.get(a);
    if (v == null) continue;
    store.del(a);
    if (store.get(b) == null && !store.set(b, v)) store.set(a, v);
  }
}

const SIGN_IN = {
  bad_login: '用户名或密码不对。',
  bad_invite: '邀请码不对。',
  name_taken: '这个用户名有人用了，换一个吧。',
  bad_name: '用户名要 2 到 24 个字：字母、数字、汉字，或者 . _ -',
  weak_password: `密码至少要 ${MIN_PASSWORD} 个字符。`,
  rate_limited: '试得太快了，等一分钟再试。',
  not_configured: '服务器还没配置好：Worker 缺 ANTHROPIC_API_KEY 或 CHAT_PASSCODE。',
  bad_passcode: '服务器还没更新好，等一两分钟再试。',
};
$('lock').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = $('acct-name').value.trim(), password = $('acct-pass').value, invite = $('acct-invite').value.trim();
  const say = (t) => { $('lock-msg').textContent = t; };
  if (!name || !password || (joining && !invite)) return;
  const problem = joining && checkAccount(name, password);
  if (problem) return say(SIGN_IN[problem]);
  const go = $('lock-go');
  go.disabled = true;
  say('');
  try {
    const res = await fetch(CHAT_ENDPOINT + (joining ? '/account' : '/login'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(joining ? { name, password, invite } : { name, password }),
    });
    const r = await res.json().catch(() => ({}));
    if (!res.ok || !r.token) return say(SIGN_IN[r.error] || `出错了：${r.error || res.status}`);
    if (!store.set(AUTH.token, r.token) || !store.set(AUTH.me, JSON.stringify({ id: r.id, name: r.name }))) {
      store.del(AUTH.token);
      return say('这个浏览器存不下登录状态：是不是关掉了网站数据？');
    }
    store.del(AUTH.passcode);
    if (r.first) adopt(prefixOf(r.id));
    location.reload();
  } catch (err) {
    say('连不上服务器。（Worker 部署了吗？在中国大陆，workers.dev 要翻墙才打得开。）');
  } finally {
    go.disabled = false;
  }
});

// ---------- the account: what it spent, and its password ----------
// The cost is the Worker's, from each reply's usage, by month (UTC). The first account sees every
// account's too, which the others are told.
$('who').addEventListener('click', async () => {
  closeSide();
  $('pw-form').reset();
  $('pw-user').value = me.name;
  $('pw-msg').textContent = '';
  $('usage').innerHTML = '<p class="fine">在读…</p>';
  drawInstall();

    if (!res.ok) throw new Error(res.status);

});
// ---------- the home screen ----------
// Added to the home screen, the page opens like an app, on its own, without the browser's address bar.
// Chrome and Edge offer to install it (beforeinstallprompt), which the account panel's button does;
// on an iPhone or iPad it is Safari's share menu, which the panel describes. Opened from the home
// screen, the panel leaves it out.
let installer = null;
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installer = e; drawInstall(); });
addEventListener('appinstalled', () => { installer = null; drawInstall(); });
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function drawInstall() {
  const apple = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  $('install-sec').hidden = standalone();
  $('install-go').hidden = !installer;
  $('install-how').textContent = (installer ? '' : apple ? '在 Safari 里点分享按钮，再点「添加到主屏幕」。' : '在浏览器的菜单里选「添加到主屏幕」或「安装应用」。') +
    '之后从主屏幕打开，就像一个 App，没有浏览器的地址栏；第一次打开可能要再登录一次。';
}
$('install-go').addEventListener('click', async () => {
  const ask = installer;
  if (!ask) return;
  installer = null;
  ask.prompt();
  await ask.userChoice.catch(() => {});
  drawInstall();
});

const monthOf = (m) => `${+m.slice(5)} 月`;
const dollars = (x) => (x ? money(x) : '$0');
function drawUsage({ mine, all }) {
  const now = new Date().toISOString().slice(0, 7), d = new Date();
  d.setUTCDate(1);
  d.setUTCMonth(d.getUTCMonth() - 1);
  const last = d.toISOString().slice(0, 7);
  const rows = (mine.some((r) => r.month === now) ? mine : [{ month: now, cost: 0, replies: 0, searches: 0 }, ...mine]).map((r) =>
    `<tr><td>${r.month === now ? `这个月（${monthOf(r.month)}）` : monthOf(r.month)}<span class="sub">${r.replies} 条回复${r.searches ? ` · ${r.searches} 次搜索` : ''}</span></td><td>${dollars(r.cost)}</td></tr>`).join('');
  let html = `<table class="usage">${rows}</table>`;
  if (all) {
    const by = new Map();
    for (const r of all) { const x = by.get(r.name) || { now: 0, last: 0 }; x[r.month === now ? 'now' : 'last'] += r.cost; by.set(r.name, x); }
    html += `<h3 style="margin-top:14px">所有账号</h3><table class="usage"><tr><th></th><th>${monthOf(now)}</th><th>${monthOf(last)}</th></tr>` +
      ([...by].sort((a, b) => b[1].now - a[1].now || b[1].last - a[1].last).map(([name, x]) => `<tr><td>${esc(name)}</td><td>${dollars(x.now)}</td><td>${dollars(x.last)}</td></tr>`).join('') ||
        '<tr><td colspan="3">还没有花费。</td></tr>') + '</table>';
  }
  html += `<p class="fine">按每条回复用掉的 token 和搜索算，美元，按 UTC 分月，从这个功能上线起开始记。${all ? '' : '网站的主人能看到每个账号的花费。'}</p>`;
  $('usage').innerHTML = html;
}
$('pw-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = $('pw-old').value, next = $('pw-new').value, msg = $('pw-msg');
  const say = (t, ok) => { msg.textContent = t; msg.classList.toggle('ok', !!ok); };
  const problem = checkAccount(me.name, next);
  if (problem) return say(SIGN_IN[problem]);
  $('pw-go').disabled = true;
  say('');
  try {
    const res = await api('POST', '/password', { password, next });
    const why = res.ok ? '' : (await res.json().catch(() => ({}))).error;
    if (res.ok) { $('pw-form').reset(); $('pw-user').value = me.name; }
    say(res.ok ? '密码改好了。其他设备上的登录都退出了。' : why === 'bad_password' ? '现在的密码不对。' : SIGN_IN[why] || `出错了：${why || res.status}`, res.ok);
  } catch (err) {
    say('连不上服务器。');
  } finally {
    $('pw-go').disabled = false;
  }
});

// Signing out ends the session in the cloud too, and clears this browser's copies of what the cloud
// has; anything not uploaded yet stays, and goes up when the same account signs in again
function signOut(msg, tell = true) {
  if (!token) return;   // already on the way out
  if (tell) fetch(CHAT_ENDPOINT + '/logout', { method: 'POST', headers: { Authorization: auth() }, keepalive: true }).catch(() => {});
  for (const e of index) if (e.version && !e.dirty) store.del(KEY.conv + e.id);
  store.set(KEY.index, JSON.stringify(index.filter((e) => !e.version || e.dirty)));
  if (store.get(AUTH.token) === token) { store.del(AUTH.token); store.del(AUTH.me); }   // unless another tab signed in since
  token = '';
  try { sessionStorage.setItem(AUTH.flash, msg); } catch (e) {}
  location.reload();
}
// Signing in or out in another tab: this one follows, unless a reply is still coming
addEventListener('storage', (e) => { if (e.key === AUTH.token && (e.newValue || '') !== token && !jobs.size) location.reload(); });

// Coming back to the page, as after chatting on another device
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - lastLook > LOOK_EVERY) look();
});

// ---------- start ----------
const coming = Object.values(notedJobs()).some((j) => j && j.typed && j.typed.text === store.get(KEY.sent));
input.value = store.get(KEY.draft) || (coming ? '' : store.get(KEY.sent)) || '';
if (!coming) store.del(KEY.sent);
picker.value = conv.model;
drawEffort();
grow();
render();
drawList();
scrollDown();
if (token) { unlock(); look(); readOn(); }
else {
  let flash = '';
  try { flash = sessionStorage.getItem(AUTH.flash) || ''; sessionStorage.removeItem(AUTH.flash); } catch (e) {}
  if (legacy) { joining = true; $('acct-invite').value = legacy; }
  lock(flash);
}
</script>
</body>
</html>
