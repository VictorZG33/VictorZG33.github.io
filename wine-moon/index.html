<title>醉月历 Wine Moon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* Layout: one 720px column like a cellar almanac; the day verdict is the hero, data set in mono,
   sections divided by rules; the four day types carry the only color on the page. */
:root {
  --bg: #EFEEE8;            /* limestone */
  --surface: #F7F6F1;
  --fg: #1F1A1C;            /* ink with a wine bias */
  --muted: #6B6366;
  --rule: #D5D1C8;
  --rule-strong: #9C958F;
  --fruit: #8A1C2D;         /* garnet */
  --flower: #A9781A;        /* ochre gold */
  --leaf: #2C6A4A;          /* bottle green */
  --root: #6E4A2C;          /* umber */
  --fruit-soft: #EBD3D6;
  --flower-soft: #EFE3C2;
  --leaf-soft: #D2E4D8;
  --root-soft: #E5D8CB;
  --oph: rgba(31, 26, 28, 0.18);
  --accent: var(--fruit);
  --accent-soft: var(--fruit-soft);
  --font-display-latin: "Bodoni Moda", "Didot", "Bodoni 72", "Times New Roman", serif;
  --font-display-cjk: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", "SimSun", serif;
  --font-body: "IBM Plex Sans", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17141A; --surface: #1F1B22; --fg: #ECE6DF; --muted: #9A918E; --rule: #352F36; --rule-strong: #5A535B;
    --fruit: #E0667A; --flower: #E2B657; --leaf: #6FBF93; --root: #C28E62;
    --fruit-soft: #3B2228; --flower-soft: #3A2F17; --leaf-soft: #1C3328; --root-soft: #33261B;
    --oph: rgba(236, 230, 223, 0.22);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17141A; --surface: #1F1B22; --fg: #ECE6DF; --muted: #9A918E; --rule: #352F36; --rule-strong: #5A535B;
  --fruit: #E0667A; --flower: #E2B657; --leaf: #6FBF93; --root: #C28E62;
  --fruit-soft: #3B2228; --flower-soft: #3A2F17; --leaf-soft: #1C3328; --root-soft: #33261B;
  --oph: rgba(236, 230, 223, 0.22);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.page {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
.day-fruit  { --accent: var(--fruit);  --accent-soft: var(--fruit-soft); }
.day-flower { --accent: var(--flower); --accent-soft: var(--flower-soft); }
.day-leaf   { --accent: var(--leaf);   --accent-soft: var(--leaf-soft); }
.day-root   { --accent: var(--root);   --accent-soft: var(--root-soft); }
.c-fruit  { color: var(--fruit); }  .c-flower { color: var(--flower); }
.c-leaf   { color: var(--leaf); }   .c-root   { color: var(--root); }
.bg-fruit { background: var(--fruit); } .bg-flower { background: var(--flower); }
.bg-leaf  { background: var(--leaf); }  .bg-root   { background: var(--root); }

/* home link back to wentaoz.com */
.home { display: inline-block; margin-bottom: 8px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
.home:hover, .home:focus-visible { color: var(--fg); }
.home:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--rule-strong); }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand .name { font-family: var(--font-display-cjk); font-weight: 900; font-size: 20px; letter-spacing: 0.04em; }
.brand .name-latin { font-family: var(--font-display-latin); font-style: italic; font-size: 20px; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.lang { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 999px; overflow: hidden; flex: none; }
.lang button {
  appearance: none; border: 0; background: transparent; color: var(--muted); font: 500 12px/1 var(--font-body);
  padding: 7px 11px; cursor: pointer; letter-spacing: 0.04em;
}
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.lang button:focus-visible, .ctl button:focus-visible, .ctl input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* hero */
.hero { padding-block: 22px 8px; }
.when { font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; font-variant-numeric: tabular-nums; }
.when .live { color: var(--accent); font-weight: 500; }
.daytype { margin: 6px 0 0; color: var(--accent); line-height: 0.98; text-wrap: balance; letter-spacing: -0.01em; }
.lang-zh .daytype { font-family: var(--font-display-cjk); font-weight: 900; font-size: clamp(84px, 26vw, 150px); letter-spacing: 0.02em; }
.lang-en .daytype { font-family: var(--font-display-latin); font-weight: 700; font-size: clamp(64px, 17vw, 124px); font-variation-settings: "opsz" 96; }
.lang-en .daytype small { display: block; font-weight: 400; font-style: italic; font-size: 0.42em; letter-spacing: 0; margin-top: 4px; }
.verdictline { margin: 14px 0 0; font-size: 17px; max-width: 34em; }
.lang-en .verdictline { font-family: var(--font-display-latin); font-size: 20px; line-height: 1.35; font-variation-settings: "opsz" 20; }
.lang-zh .verdictline { font-family: var(--font-display-cjk); font-weight: 600; }

.scale { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 18px; max-width: 420px; }
.scale .step { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
.scale .bar { height: 4px; border-radius: 2px; background: var(--rule); }
.scale .step.on { color: var(--fg); font-weight: 600; }
.scale .step.on .bar { background: var(--accent); height: 6px; margin-top: -1px; }
.scale .cap { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); grid-column: 1 / -1; }

.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 16px; margin: 22px 0 0; padding: 16px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.facts div { min-width: 0; }
.facts dt { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.facts dd { margin: 0; font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.facts dd.v { color: var(--accent); }
@media (max-width: 420px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.period { margin-top: 16px; font-size: 15px; display: flex; flex-direction: column; gap: 6px; font-variant-numeric: tabular-nums; }
.period .main { font-size: 17px; }
.period .main b { font-weight: 600; }
.period .sub { color: var(--muted); font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 0.02em; }
.period .sub .left { color: var(--fg); font-weight: 500; }

.ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 18px; }
.ctl button, .ctl input {
  font: 500 13px/1.2 var(--font-body); color: var(--fg); background: var(--surface);
  border: 1px solid var(--rule-strong); border-radius: 8px; padding: 9px 12px; min-height: 38px;
}
.ctl button { cursor: pointer; }
.ctl button:hover { border-color: var(--fg); }
.ctl input[type="datetime-local"] { font-family: var(--font-mono); font-size: 13px; min-width: 0; max-width: 100%; }
.ctl .spacer { flex: 1 1 0; }
.ctl .now-btn { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.ctl .now-btn[disabled] { opacity: 0.45; cursor: default; }

/* sections */
section.block { padding-block: 28px 8px; }
section.block h2 { margin: 0 0 4px; font-size: 13px; font-family: var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.lang-zh section.block h2 { letter-spacing: 0.2em; }
.moonpos { font-size: 15px; font-variant-numeric: tabular-nums; margin: 0 0 12px; }
.moonpos .num { font-family: var(--font-mono); font-weight: 500; }

/* zodiac strip */
.strip-wrap { position: relative; padding-top: 24px; }
.strip { display: flex; height: 44px; border: 1px solid var(--rule-strong); border-radius: 3px; overflow: hidden; background: var(--surface); }
.seg { position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; color: var(--fg); font-size: 12px; font-weight: 600; border-right: 1px solid var(--bg); }
.seg:last-child { border-right: 0; }
.seg.on { color: var(--bg); }
.seg .lbl { position: relative; z-index: 1; white-space: nowrap; }
.seg .deg { display: none; font-family: var(--font-mono); font-size: 10px; font-weight: 400; opacity: 0.85; margin-top: 2px; }
.seg .oph { position: absolute; top: 0; bottom: 0; right: 0; background: repeating-linear-gradient(135deg, var(--oph) 0 2px, transparent 2px 6px); }
.seg.s-fruit { background: var(--fruit-soft); } .seg.s-flower { background: var(--flower-soft); }
.seg.s-leaf { background: var(--leaf-soft); } .seg.s-root { background: var(--root-soft); }
.seg.s-fruit.on { background: var(--fruit); } .seg.s-flower.on { background: var(--flower); }
.seg.s-leaf.on { background: var(--leaf); } .seg.s-root.on { background: var(--root); }
.marker { position: absolute; top: 0; bottom: 0; width: 0; pointer-events: none; }
.marker .pin { position: absolute; top: 2px; left: -9px; width: 18px; height: 18px; border-radius: 50%; background: var(--fg); color: var(--bg); font-size: 12px; line-height: 18px; text-align: center; }
.marker .line { position: absolute; top: 20px; bottom: 0; left: -1px; width: 2px; background: var(--fg); }
.note { font-size: 13.5px; color: var(--muted); margin: 14px 0 0; max-width: 60ch; }
.note b { color: var(--fg); font-weight: 600; }
@media (min-width: 560px) {
  .strip { height: 54px; }
  .seg { flex-direction: column; }
  .seg .deg { display: block; }
  .seg.narrow .deg { display: none; }
}

/* outlook */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); margin: 8px 0 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.rows { display: flex; flex-direction: column; gap: 5px; }
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: center; }
.row .d { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.today .d { color: var(--fg); font-weight: 600; }
.row .bar { position: relative; height: 26px; border-radius: 3px; overflow: hidden; background: var(--surface); }
.row .p { position: absolute; top: 0; bottom: 0; }
.row .p .t { position: absolute; left: 5px; top: 50%; transform: translateY(-50%); font-family: var(--font-mono); font-size: 10.5px; color: var(--bg); white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .p .t.dim { color: var(--fg); opacity: 0.7; }
.row .nowline { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--fg); }
.row .nowline::after { content: ""; position: absolute; top: 0; left: -3px; border: 4px solid transparent; border-top-color: var(--fg); }
.hours { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; }
.hours .h { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-top: 2px; }
.windows { margin: 18px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-variant-numeric: tabular-nums; }
.windows li { display: flex; gap: 10px; align-items: baseline; }
.windows .tag { font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.windows .tm { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }

/* method */
details { border-top: 1px solid var(--rule); margin-top: 24px; }
summary { cursor: pointer; padding: 16px 0; font-weight: 600; font-size: 15px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-family: var(--font-mono); color: var(--muted); font-size: 18px; }
details[open] summary::after { content: "–"; }
.method { padding: 0 0 18px; color: var(--fg); font-size: 14.5px; max-width: 62ch; }
.method p { margin: 0 0 12px; }
.method .k { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
footer { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--rule-strong); font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; }
footer .sig { font-family: var(--font-display-latin); font-style: italic; font-size: 15px; color: var(--fg); }
@media (prefers-reduced-motion: no-preference) {
  .daytype { transition: color 0.3s ease; }
  .row .p { transition: width 0.3s ease, left 0.3s ease; }
}
</style>
</head>
<body>
<div class="page lang-zh day-fruit" id="page">
  <header class="top">
    <div>
      <a class="home" href="../">← wentaoz.com</a>
      <div class="brand"><span class="name">醉月历</span><span class="name-latin">Wine Moon</span></div>
      <div class="eyebrow" id="eyebrow"></div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="btn-zh" data-lang="zh" aria-pressed="true">中文</button>
      <button type="button" id="btn-en" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="hero">
    <div class="when"><span class="live" id="whenLabel"></span><span id="whenTime"></span><span id="tz"></span></div>
    <h1 class="daytype" id="dayType"></h1>
    <p class="verdictline" id="verdictLine"></p>
    <div class="scale" id="scale"></div>
    <dl class="facts" id="facts"></dl>
    <div class="period" id="period"></div>
    <div class="ctl">
      <button type="button" id="prevBtn" title="previous"></button>
      <button type="button" id="nextBtn" title="next"></button>
      <span class="spacer"></span>
      <label for="pick" id="pickLabel" style="font-size:12.5px;color:var(--muted)"></label>
      <input type="datetime-local" id="pick">
      <button type="button" class="now-btn" id="nowBtn" disabled></button>
    </div>
  </section>

  <section class="block">
    <h2 id="moonH"></h2>
    <p class="moonpos" id="moonpos"></p>
    <div class="strip-wrap">
      <div class="marker" id="marker"><div class="pin">☾</div><div class="line"></div></div>
      <div class="strip" id="strip"></div>
    </div>
    <p class="note" id="stripNote"></p>
  </section>

  <section class="block">
    <h2 id="outlookH"></h2>
    <div class="legend" id="legend"></div>
    <div class="rows" id="rows"></div>
    <div class="hours"><span></span><div class="h"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div></div>
    <ul class="windows" id="windows"></ul>
  </section>

  <details id="methodBox">
    <summary id="methodH"></summary>
    <div class="method" id="method"></div>
  </details>

  <footer>
    <span class="sig" id="footSig"></span>
    <span id="footNote"></span>
  </footer>
</div>

    return TZ + ' (' + off + ')';
  }
  function fmtTime(d) { return new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(d); }
  function fmtDate(d, withYear) {
    var L = I18N[state.lang];
    if (state.lang === 'zh') {
      return (withYear ? d.getFullYear() + '年' : '') + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + L.weekday(d);
    }
    var o = { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric' };
    if (withYear) o.year = 'numeric';
    return new Intl.DateTimeFormat('en-US', o).format(d);
  }
  function fmtDT(d, refYear) {
    var withYear = refYear != null && d.getFullYear() !== refYear;
    return fmtDate(d, withYear) + ' ' + fmtTime(d);
  }
  function fmtDur(hours) {
    var L = I18N[state.lang];
    if (hours < 1.5) return L.minutes(Math.max(1, Math.round(hours * 60)));
    if (hours >= 72) return L.days(Math.round(hours / 24));
    return L.hours(Math.round(hours));
  }
  function toInputValue(d) {
    var p = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function localMidnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ---------- render ----------
  function render() {
    var L = I18N[state.lang];
    var now = new Date();
    var t = state.mode === 'now' ? now : state.chosen;
    var jd = W.jdFromDate(t), jdNow = W.jdFromDate(now);
    var p = W.periodAt(jd), c = p.constellation, day = c.day;
    var page = $('page');
    page.className = 'page lang-' + state.lang + ' day-' + day;
    document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';
    $('btn-zh').setAttribute('aria-pressed', state.lang === 'zh');
    $('btn-en').setAttribute('aria-pressed', state.lang === 'en');
    $('eyebrow').textContent = L.eyebrow;

    $('whenLabel').textContent = state.mode === 'now' ? L.now : L.chosen;
    $('whenTime').textContent = fmtDT(t, now.getFullYear());
    $('tz').textContent = tzLabel();

    if (state.lang === 'zh') $('dayType').textContent = L.day[day];
    else $('dayType').innerHTML = esc(L.day[day]) + '<small>day · ' + esc(L.verdict[day].toLowerCase()) + ' for tasting</small>';
    $('verdictLine').textContent = L.verdictLine[day];

    var sc = '';
    for (var i = 0; i < SCALE.length; i++) {
      var k = SCALE[i];
      sc += '<div class="step' + (k === day ? ' on' : '') + '"><div class="bar"></div><span>' + esc(L.dayShort[k]) + ' · ' + esc(L.verdict[k]) + '</span></div>';
    }
    sc += '<span class="cap">' + esc(L.scaleCap) + '</span>';
    $('scale').innerHTML = sc;

    var vals = [L.cons[c.key], L.element[day], L.part[day], L.verdict[day]];
    var fh = '';
    for (i = 0; i < 4; i++) fh += '<div><dt>' + esc(L.facts[i]) + '</dt><dd' + (i === 3 ? ' class="v"' : '') + '>' + esc(vals[i]) + '</dd></div>';
    $('facts').innerHTML = fh;

    var ds = W.dateFromJd(p.start), de = W.dateFromJd(p.end);
    var sub = L.total(Math.round(p.hours));
    if (jdNow >= p.start && jdNow < p.end) sub += ' · ' + L.left(fmtDur((p.end - jdNow) * 24));
    else if (jdNow < p.start) sub += ' · ' + L.until(fmtDur((p.start - jdNow) * 24));
    else sub += ' · ' + L.ago(fmtDur((jdNow - p.end) * 24));
    $('period').innerHTML = '<div class="main">' + L.period(esc(fmtDT(ds, now.getFullYear())), esc(fmtDT(de, now.getFullYear())), esc(L.day[p.next.day])) + '</div><div class="sub">' + sub + '</div>';

    $('prevBtn').textContent = L.prev; $('nextBtn').textContent = L.next;
    $('pickLabel').textContent = L.pick; $('nowBtn').textContent = L.backNow;
    $('nowBtn').disabled = state.mode === 'now';
    if (document.activeElement !== $('pick')) $('pick').value = toInputValue(t);

    // moon position + strip
    var lon = W.sidLon(jd);
    $('moonH').textContent = state.mode === 'now' ? L.moonH : L.moonHChosen;
    $('moonpos').innerHTML = L.moonpos(lon.toFixed(2), esc(L.cons[c.key]), r1(c.offset), r1(c.width));
    var ariStart = widthOf('ari').start, sh = '';
    for (i = 0; i < ORDER.length; i++) {
      var w = widthOf(ORDER[i]), pct = w.width / 360 * 100;
      var oph = '';
      if (w.key === 'sco') oph = '<span class="oph" style="width:' + (ophWidth() / w.width * 100).toFixed(2) + '%" title="' + esc(L.oph) + '"></span>';
      sh += '<div class="seg s-' + w.day + (w.key === c.key ? ' on' : '') + (w.width < 24 ? ' narrow' : '') + '" style="flex:0 0 ' + pct.toFixed(3) + '%" title="' + esc(L.cons[w.key]) + ' ' + r1(w.width) + '°">' +
            oph + '<span class="lbl">' + esc(L.consShort[w.key]) + '</span><span class="deg">' + r1(w.width) + '°</span></div>';
    }
    $('strip').innerHTML = sh;
    var pos = (((lon - ariStart) % 360) + 360) % 360;
    $('marker').style.left = (pos / 360 * 100).toFixed(3) + '%';
    var vir = r1(widthOf('vir').width), cnc = r1(widthOf('cnc').width), ophw = r1(ophWidth());
    $('stripNote').innerHTML = L.stripNote(vir, cnc, ophw);

    // outlook
    $('outlookH').textContent = L.outlookH;
    var lg = '';
    for (i = 0; i < SCALE.length; i++) { k = SCALE[SCALE.length - 1 - i]; lg += '<span><i class="bg-' + k + '"></i>' + esc(L.legendVerdict[k]) + '</span>'; }
    $('legend').innerHTML = lg;
    var d0 = localMidnight(t), dEnd = addDays(d0, 14);
    var periods = W.periodsBetween(W.jdFromDate(d0), W.jdFromDate(dEnd));
    var rows = '', todayMid = localMidnight(now).getTime();
    for (i = 0; i < 14; i++) {
      var a = addDays(d0, i), b = addDays(d0, i + 1), ja = W.jdFromDate(a), jb = W.jdFromDate(b), span = jb - ja;
      var segs = '';
      for (var j = 0; j < periods.length; j++) {
        var q = periods[j];
        if (q.end <= ja || q.start >= jb) continue;
        var s0 = Math.max(q.start, ja), s1 = Math.min(q.end, jb);
        var left = (s0 - ja) / span * 100, wid = (s1 - s0) / span * 100;
        var label = '';
        if (q.start > ja && wid >= 14) label = '<span class="t">' + fmtTime(W.dateFromJd(q.start)) + '</span>';
        else if (q.start <= ja && wid >= (state.lang === 'zh' ? 9 : 16)) label = '<span class="t">' + esc(L.dayShort[q.constellation.day]) + '</span>';
        segs += '<div class="p bg-' + q.constellation.day + '" style="left:' + left.toFixed(3) + '%;width:' + wid.toFixed(3) + '%" title="' + esc(L.day[q.constellation.day]) + ' · ' + esc(L.cons[q.constellation.key]) + '">' + label + '</div>';
      }
      var isToday = a.getTime() === todayMid;
      if (isToday) segs += '<div class="nowline" style="left:' + ((jdNow - ja) / span * 100).toFixed(3) + '%"></div>';
      var dl = state.lang === 'zh'
        ? (a.getMonth() + 1) + '/' + a.getDate() + ' ' + L.weekday(a).replace('周', '')
        : L.weekday(a) + ' ' + (a.getMonth() + 1) + '/' + a.getDate();
      rows += '<div class="row' + (isToday ? ' today' : '') + '"><span class="d">' + esc(dl) + '</span><div class="bar">' + segs + '</div></div>';
    }
    $('rows').innerHTML = rows;

    var wl = '';
    for (j = 0; j < periods.length; j++) {
      q = periods[j];
      if (q.constellation.day !== 'fruit' && q.constellation.day !== 'flower') continue;
      if (q.end < W.jdFromDate(d0)) continue;
      wl += '<li class="day-' + q.constellation.day + '"><span class="tag">' + esc(L.day[q.constellation.day]) + '</span><span class="tm">' +
            esc(fmtDT(W.dateFromJd(q.start), now.getFullYear())) + ' → ' + esc(fmtDT(W.dateFromJd(q.end), now.getFullYear())) + ' · ' + esc(L.cons[q.constellation.key]) + ' · ' + esc(L.hours(Math.round(q.hours))) + '</span></li>';
    }
    $('windows').innerHTML = wl;

    $('methodH').textContent = L.methodH;
    $('method').innerHTML = L.method(vir, cnc, ophw);
    $('footSig').textContent = L.footSig;
    $('footNote').textContent = L.footNote;
    document.title = state.lang === 'zh' ? '醉月历 Wine Moon · ' + L.day[day] : '醉月历 Wine Moon · ' + L.day[day] + ' day';
  }

  // ---------- events ----------
  function setLang(l) { state.lang = l; try { localStorage.setItem('winemoon.lang', l); } catch (e) {} render(); }
  $('btn-zh').addEventListener('click', function () { setLang('zh'); });
  $('btn-en').addEventListener('click', function () { setLang('en'); });
  $('prevBtn').addEventListener('click', function () {
    var t = state.mode === 'now' ? new Date() : state.chosen;
    var p = W.periodAt(W.jdFromDate(t));
    var prev = W.periodAt(p.start - 1 / 1440);
    state.mode = 'chosen'; state.chosen = W.dateFromJd(prev.start + 30 / 86400); render();
  });
  $('nextBtn').addEventListener('click', function () {
    var t = state.mode === 'now' ? new Date() : state.chosen;
    var p = W.periodAt(W.jdFromDate(t));
    state.mode = 'chosen'; state.chosen = W.dateFromJd(p.end + 30 / 86400); render();
  });
  $('pick').addEventListener('change', function (ev) {
    var v = ev.target.value; if (!v) return;
    var d = new Date(v); if (isNaN(d.getTime())) return;
    state.mode = 'chosen'; state.chosen = d; render();
  });
  $('nowBtn').addEventListener('click', function () { state.mode = 'now'; state.chosen = null; render(); });
  setInterval(function () { if (state.mode === 'now' && !document.hidden) render(); }, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && state.mode === 'now') render(); });

  // ---------- boot (keeps state across live republishes) ----------
  function start(data) {
    if (data && data.lang) state.lang = data.lang;
    if (data && data.mode === 'chosen' && data.chosenMs) { state.mode = 'chosen'; state.chosen = new Date(data.chosenMs); }
    render();
  }
  try {
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
      window.claude.hot.snapshot(function () { return { lang: state.lang, mode: state.mode, chosenMs: state.chosen ? state.chosen.getTime() : null }; });
    }
    if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
    else start(window.claude && window.claude.hot ? window.claude.hot.data : null);
  } catch (e) { render(); }
})();

</script>
</body>
</html>
