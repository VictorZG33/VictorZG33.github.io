<title>两清 All Square</title>

<!-- The Chinese serif is cut down to the characters of the name and the settlement headline
     (两清, 最少…笔转账就能两清, 不用转账，已经两清), so new wording there needs adding to text= -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&text=%E4%B8%A4%E6%B8%85%E6%9C%80%E5%B0%91%E7%AC%94%E8%BD%AC%E8%B4%A6%E5%B0%B1%E8%83%BD%E4%B8%8D%E7%94%A8%E5%B7%B2%E7%BB%8F%EF%BC%8C&display=swap">
<style>
/* Layout: one 720px column like a page of a ledger. Three numbered steps run down it, and the settlement
   is the hero once there is something to settle. Red ink for money owed, green for money coming back. */
:root {
  --bg: #F3F1E9;            /* ledger paper */
  --surface: #FBFAF6;
  --fg: #1C211D;
  --muted: #646B63;
  --rule: #DAD7CB;
  --rule-strong: #A3A094;
  --green: #2F6B4F;         /* ledger-cloth green: money coming back */
  --green-soft: #DCE8DF;
  --red: #B3261E;           /* red ink: money owed */
  --red-soft: #F3DCD8;
  --font-cjk: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", "SimSun", serif;
  --font-latin: "STIX Two Text", "STIXGeneral", Cambria, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121613; --surface: #1A201C; --fg: #E5E8E1; --muted: #9AA297; --rule: #2B322D; --rule-strong: #4E5850;
    --green: #79C29C; --green-soft: #1E3328; --red: #F0806F; --red-soft: #3A2220;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121613; --surface: #1A201C; --fg: #E5E8E1; --muted: #9AA297; --rule: #2B322D; --rule-strong: #4E5850;
  --green: #79C29C; --green-soft: #1E3328; --red: #F0806F; --red-soft: #3A2220;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.page {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

/* home link back to wentaoz.com */
.home { display: inline-block; margin-bottom: 8px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
.home:hover, .home:focus-visible { color: var(--fg); }

/* header */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--rule-strong); }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand .name { font-family: var(--font-cjk); font-weight: 900; font-size: 20px; letter-spacing: 0.04em; }
.brand .name-latin { font-family: var(--font-latin); font-style: italic; font-size: 20px; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.tools { display: flex; align-items: center; gap: 8px; flex: none; }
.theme {
  appearance: none; border: 1px solid var(--rule-strong); border-radius: 999px; background: transparent; color: var(--muted);
  font: 500 12px/1 var(--font-body); padding: 7px 11px; cursor: pointer; letter-spacing: 0.04em;
}
.theme[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.lang { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 999px; overflow: hidden; flex: none; }
.lang button {
  appearance: none; border: 0; background: transparent; color: var(--muted); font: 500 12px/1 var(--font-body);
  padding: 7px 11px; cursor: pointer; letter-spacing: 0.04em;
}
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.banner { margin: 16px 0 0; padding: 10px 14px; border-radius: 8px; background: var(--green-soft); font-size: 14.5px; }
/* a shared ledger's line under the header: green when in step with the server, grey while saving, red when it can't be reached */
.banner.bad { background: var(--red-soft); }
.sync { display: flex; align-items: baseline; gap: 8px; margin: 14px 0 0; font-size: 13.5px; color: var(--muted); }
.sync .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.sync.busy .dot, .sync.loading .dot { background: var(--rule-strong); }
.sync.off { color: var(--red); }
.sync.off .dot { background: var(--red); }

/* the three steps */
.step { padding-block: 32px 4px; }
.step-h { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 19px; font-weight: 600; line-height: 1.3; }
.step-h .no {
  display: inline-grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 50%;
  background: var(--fg); color: var(--bg); font: 500 13px/1 var(--font-mono);
}
.step.locked .step-h { color: var(--muted); }
.step.locked .step-h .no { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--rule-strong); }
.step-h .count { font: 400 13px/1 var(--font-mono); color: var(--muted); margin-left: 2px; }
.locked-note { margin: 0; font-size: 14.5px; color: var(--muted); }
.hint { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.msg { margin: 8px 0 0; font-size: 14px; }
.msg:empty { display: none; }
.msg.bad { color: var(--red); }

input[type="text"], select {
  min-width: 0; min-height: 44px; padding: 10px 12px; font-size: 16px; line-height: 1.3;
  background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 8px;
}
input[type="text"]::placeholder { color: var(--muted); opacity: 0.8; }
.btn {
  appearance: none; min-height: 44px; padding: 10px 16px; border: 1px solid var(--rule-strong); border-radius: 8px;
  background: var(--surface); font-size: 15px; font-weight: 500; line-height: 1.2; white-space: nowrap; cursor: pointer;
}
.btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.link-btn {
  appearance: none; border: 0; background: none; padding: 4px 2px; cursor: pointer;
  font-size: 13.5px; font-weight: 500; color: var(--muted);
  text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 3px;
}
.link-btn:hover { color: var(--fg); }
.link-btn.sure { color: var(--red); text-decoration-color: currentColor; }

/* step 1: names */
.add-row { display: flex; gap: 8px; }
.add-row input { flex: 1 1 auto; }
.people { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.person {
  display: inline-flex; align-items: center; gap: 2px; max-width: 100%;
  padding: 3px 3px 3px 13px; border: 1px solid var(--rule-strong); border-radius: 999px; background: var(--surface);
  font-weight: 500;
}
.person span { overflow-wrap: anywhere; }
.person button {
  appearance: none; flex: none; width: 30px; height: 30px; border: 0; border-radius: 50%; background: none;
  color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer;
}
.person button:hover { background: var(--rule); color: var(--fg); }

/* step 2: the expense form, then the ledger */
.form { display: grid; gap: 18px; padding: 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; }
.form.editing { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
.editing-note { margin: -4px 0 0; font-size: 13.5px; font-weight: 500; color: var(--green); overflow-wrap: anywhere; }
.fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 520px) { .fields { grid-template-columns: minmax(0, 1fr); } }
.field { display: grid; gap: 6px; min-width: 0; margin: 0; padding: 0; border: 0; }
.label { display: block; padding: 0; font-size: 13px; font-weight: 500; color: var(--muted); }
fieldset.field { display: block; }
fieldset.field > .label { margin-bottom: 8px; }
.field input[type="text"] { width: 100%; background: var(--bg); }
.amount-box { display: flex; }
.amount-box select { flex: none; border-radius: 8px 0 0 8px; border-right: 0; background: var(--bg); font-family: var(--font-mono); cursor: pointer; }
.amount-box input[type="text"] { border-radius: 0 8px 8px 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; display: inline-flex; max-width: 100%; }
.chip input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.chip span {
  display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 7px 14px;
  border: 1px solid var(--rule-strong); border-radius: 999px; font-size: 15px; line-height: 1.3; color: var(--muted);
  overflow-wrap: anywhere;
}
.chip:hover span { border-color: var(--fg); }
.chip input:checked + span { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.chip.sharer input:checked + span { background: var(--green-soft); border-color: var(--green); color: var(--fg); }
.chip.sharer input:checked + span::before { content: "✓"; font-size: 13px; font-weight: 600; color: var(--green); }
.chip input:focus-visible + span { outline: 2px solid var(--green); outline-offset: 2px; }
.share-foot { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-top: 10px; }
.calc { margin: 0; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.calc.bad { color: var(--red); }
.form-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

.list-h {
  margin: 28px 0 0; padding-bottom: 8px; border-bottom: 1px solid var(--rule-strong);
  font-size: 13px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums;
}
.ledger { list-style: none; margin: 0; padding: 0; counter-reset: entry; }
.entry {
  display: grid; grid-template-columns: 2em minmax(0, 1fr) auto; column-gap: 10px; row-gap: 2px;
  padding: 12px 0; border-bottom: 1px solid var(--rule);
}
.entry::before {
  counter-increment: entry; content: counter(entry, decimal-leading-zero);
  grid-row: span 2; padding-top: 3px; font: 400 12px/1.4 var(--font-mono); color: var(--muted);
}
.entry.is-editing { background: var(--green-soft); box-shadow: -8px 0 0 var(--green-soft), 8px 0 0 var(--green-soft); }
.entry-what { font-weight: 600; overflow-wrap: anywhere; }
.entry-what.untitled { font-weight: 400; color: var(--muted); }
.entry-amt { font-family: var(--font-mono); font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.entry-meta { font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; }
.entry-actions { display: flex; gap: 12px; justify-content: flex-end; align-items: start; }

/* step 3: the settlement */
.verdict { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 12px; margin: 0 0 18px; line-height: 1; color: var(--fg); }
.verdict .v-num { font-family: var(--font-mono); font-weight: 500; font-size: clamp(72px, 20vw, 128px); line-height: 0.9; color: var(--green); font-variant-numeric: tabular-nums; }
.verdict .v-pre, .verdict .v-post { font-size: clamp(22px, 6vw, 32px); line-height: 1.2; }
.lang-zh .verdict .v-pre, .lang-zh .verdict .v-post { font-family: var(--font-cjk); font-weight: 900; letter-spacing: 0.02em; }
.lang-en .verdict .v-pre, .lang-en .verdict .v-post { font-family: var(--font-latin); }
.lang-en .verdict .v-post { flex: 1 1 10em; }
.verdict.done .v-post { font-size: clamp(30px, 8vw, 44px); color: var(--green); }
.transfers { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule-strong); }
.transfer {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 12px;
  padding: 14px 0; border-bottom: 1px solid var(--rule);
}
.transfer .who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; min-width: 0; font-size: 18px; font-weight: 600; }
.transfer .who > span { overflow-wrap: anywhere; min-width: 0; }
.transfer .from { color: var(--red); }
.transfer .to { color: var(--green); }
.transfer .arrow { font-family: var(--font-mono); font-weight: 400; color: var(--muted); }
.transfer .amt { font-family: var(--font-mono); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.note { margin: 12px 0 0; font-size: 13.5px; color: var(--muted); max-width: 60ch; }
.share { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 18px; }
.share .msg { margin: 0; flex: 1 1 100%; }

.tally { overflow-x: auto; }   /* very large sums scroll here rather than widen the page */
.balances { width: 100%; margin: 0; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.balances th, .balances td { padding: 9px 0 9px 10px; border-bottom: 1px solid var(--rule); text-align: right; vertical-align: baseline; }
.balances th:first-child, .balances td:first-child { padding-left: 0; text-align: left; }
.balances thead th { padding-block: 0 8px; font: 500 12px/1.3 var(--font-body); color: var(--muted); border-bottom-color: var(--rule-strong); }
.balances tbody th { min-width: 4.5em; font-weight: 500; overflow-wrap: anywhere; }
.balances td { font-family: var(--font-mono); font-size: 14px; white-space: nowrap; }
.balances .pos { color: var(--green); font-weight: 500; }
.balances .neg { color: var(--red); font-weight: 500; }
.balances .zero { color: var(--muted); }
.balances caption { caption-side: bottom; text-align: left; padding-top: 10px; font-size: 13.5px; color: var(--muted); }
.tally-h { margin: 32px 0 10px; font-size: 13px; font-weight: 500; color: var(--muted); }
@media (max-width: 400px) { .balances th, .balances td { padding-left: 6px; } .balances td { font-size: 12.5px; } }

/* method */
details { border-top: 1px solid var(--rule); margin-top: 36px; }
summary { cursor: pointer; padding: 16px 0; font-weight: 600; font-size: 15px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-family: var(--font-mono); color: var(--muted); font-size: 18px; }
details[open] summary::after { content: "–"; }
.method { padding: 0 0 18px; font-size: 14.5px; max-width: 62ch; }
.method p { margin: 0 0 12px; }
.method .k { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
footer { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--rule-strong); font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
footer .sig { font-family: var(--font-latin); font-style: italic; font-size: 15px; color: var(--fg); }
.lang-zh footer .sig { font-family: var(--font-cjk); font-style: normal; font-weight: 900; }
footer .link-btn { margin-left: auto; }
.nojs { margin: 22px 0 0; font-size: 17px; max-width: 34em; }
</style>
<noscript><style>.tools, .step, details, footer { display: none; }</style></noscript>
</head>
<body>
<div class="page lang-zh" id="page">
  <header class="top">
    <div>
      <a class="home" href="../">← wentaoz.com</a>
      <div class="brand"><span class="name" lang="zh-CN">两清</span><span class="name-latin" lang="en">All Square</span></div>
      <div class="eyebrow" id="eyebrow"></div>
    </div>
    <div class="tools">
      <button type="button" class="theme" id="btn-theme" aria-pressed="false" hidden></button>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="btn-zh" aria-pressed="true" lang="zh-CN">中文</button>
        <button type="button" id="btn-en" aria-pressed="false" lang="en">EN</button>
      </div>
    </div>
  </header>

  <noscript><p class="nojs">两清在你的浏览器里算账，需要 JavaScript。请开启后刷新页面。<br><span lang="en">All Square does its sums in your browser and needs JavaScript. Turn it on and reload.</span></p></noscript>
  <p class="sync" id="sync" hidden><i class="dot" aria-hidden="true"></i><span id="sync-text"></span></p>
  <p class="banner" id="banner" role="status" hidden></p>

  <section class="step" id="step-people" aria-labelledby="h-people">
    <h2 class="step-h"><span class="no" aria-hidden="true">1</span><span id="h-people"></span><span class="count" id="people-count"></span></h2>
    <form class="add-row" id="people-form" novalidate>
      <label class="sr" for="name-input" id="name-label"></label>
      <input type="text" id="name-input" autocomplete="off" autocapitalize="words" enterkeyhint="done" aria-describedby="name-hint">
      <button type="submit" class="btn" id="name-add"></button>
    </form>
    <p class="hint" id="name-hint"></p>
    <p class="msg" id="people-msg" role="status"></p>
    <ul class="people" id="people"></ul>
  </section>

  <section class="step" id="step-spend" aria-labelledby="h-spend">
    <h2 class="step-h"><span class="no" aria-hidden="true">2</span><span id="h-spend"></span></h2>
    <p class="locked-note" id="spend-locked"></p>
    <div id="spend-body">
      <form class="form" id="spend-form" novalidate>
        <p class="editing-note" id="editing-note" hidden></p>
        <div class="fields">
          <div class="field">
            <label class="label" for="what-input" id="what-label"></label>
            <input type="text" id="what-input" maxlength="60" autocomplete="off" enterkeyhint="next">
          </div>
          <div class="field">
            <label class="label" for="amount-input" id="amount-label"></label>
            <div class="amount-box">
              <select id="cur"></select>
              <input type="text" id="amount-input" inputmode="decimal" autocomplete="off" placeholder="0.00" enterkeyhint="done">
            </div>
          </div>
        </div>
        <fieldset class="field">
          <legend class="label" id="payer-label"></legend>
          <div class="chips" id="payer-chips"></div>
        </fieldset>
        <fieldset class="field">
          <legend class="label" id="parts-label"></legend>
          <div class="chips" id="parts-chips"></div>
          <div class="share-foot">
            <p class="calc" id="parts-calc" aria-live="polite"></p>
            <button type="button" class="link-btn" id="parts-all"></button>
          </div>
        </fieldset>
        <div class="form-actions">
          <button type="submit" class="btn primary" id="spend-submit"></button>
          <button type="button" class="btn" id="spend-cancel" hidden></button>
        </div>
        <p class="msg" id="spend-msg" role="status"></p>
      </form>
      <h3 class="list-h" id="list-h"></h3>
      <ol class="ledger" id="ledger"></ol>
    </div>

    }).join('');
    $('balances').innerHTML = '<caption>' + esc(T.tallyNote) + '</caption><thead><tr>' +
      T.cols.map(function (c, i) { return '<th scope="col">' + (i ? esc(c) : '<span class="sr">' + esc(T.nameLabel) + '</span>') + '</th>'; }).join('') +
      '</tr></thead><tbody>' + rows + '</tbody>';
  }

  function render() { renderStatic(); renderSync(); renderPeople(); renderForm(); renderLedger(); renderSettle(); }

  // ---------- events ----------
  $('btn-zh').addEventListener('click', function () { setLang('zh'); });
  $('btn-en').addEventListener('click', function () { setLang('en'); });
  function setLang(l) {
    state.lang = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    ['people-msg', 'spend-msg', 'share-msg'].forEach(function (id) { say(id, ''); });
    banner('');
    render();
  }

  // light / dark: follows the system until chosen; the choice is shared with the homepage
  var root = document.documentElement;
  var mqDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function isDark() { var t = root.getAttribute('data-theme'); return t ? t === 'dark' : !!(mqDark && mqDark.matches); }
  function showTheme() { $('btn-theme').setAttribute('aria-pressed', isDark() ? 'true' : 'false'); }
  $('btn-theme').addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark', system = mqDark && mqDark.matches ? 'dark' : 'light';
    // picking what the system already shows clears the choice, so the page follows the system again
    if (next === system) root.removeAttribute('data-theme'); else root.setAttribute('data-theme', next);
    try {
      if (next === system) localStorage.removeItem('wentaoz.theme'); else localStorage.setItem('wentaoz.theme', next);
    } catch (e) {}
    showTheme();
  });
  if (mqDark && mqDark.addEventListener) mqDark.addEventListener('change', showTheme);
  showTheme();
  $('btn-theme').hidden = false;

  // step 1: names, several at once when separated by commas
  $('people-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var T = I18N[state.lang], input = $('name-input');
    var names = input.value.split(/[,，、;；\n]+/).map(cleanName).filter(Boolean);
    if (!names.length) { input.focus(); return; }
    var add = [], dups = [], full = false;
    names.forEach(function (name) {
      var low = name.toLowerCase();
      if (state.people.concat(add).some(function (p) { return p.name.toLowerCase() === low; })) { if (dups.indexOf(name) < 0) dups.push(name); return; }
      if (state.people.length + add.length >= MAX_PEOPLE) { full = true; return; }
      add.push({ id: newId(), name: name });
    });
    input.value = '';
    say('people-msg', (dups.length ? T.dup(dups) : '') + (full ? (dups.length ? ' ' : '') + T.full : ''), true);
    if (add.length) act({ t: 'add-people', people: add });
  });
  $('people').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-remove]');
    if (!b) return;
    var T = I18N[state.lang], id = b.getAttribute('data-remove'), p = person(id), n = uses(state, id);
    if (!p) return;
    if (n) { say('people-msg', T.inUse(p.name, n), true); return; }
    say('people-msg', '');
    act({ t: 'remove-person', id: id });
    $('name-input').focus();
  });

  // step 2: the form
  $('cur').addEventListener('change', function () { act({ t: 'currency', cur: $('cur').value }); });
  $('amount-input').addEventListener('input', renderPreview);
  $('payer-chips').addEventListener('change', function (ev) { state.payer = ev.target.value; });
  $('parts-chips').addEventListener('change', function () {
    var on = {};
    [].forEach.call($('parts-chips').querySelectorAll('input:checked'), function (x) { on[x.value] = true; });
    state.parts = state.people.filter(function (p) { return on[p.id]; }).map(function (p) { return p.id; });
    renderPreview();
  });
  $('parts-all').addEventListener('click', function () {
    state.parts = formParts().length === state.people.length ? [] : null;
    renderForm();
  });
  $('spend-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var T = I18N[state.lang], cents = parseAmount($('amount-input').value), parts = formParts();
    if (!(cents > 0)) { say('spend-msg', T.badAmount, true); $('amount-input').focus(); return; }
    if (!parts.length) { say('spend-msg', T.noParts, true); return; }
    if (!person(state.payer)) return;
    if (!state.editing && state.expenses.length >= MAX_EXPENSES) { say('spend-msg', T.tooMany, true); return; }
    var what = $('what-input').value.replace(/\s+/g, ' ').trim().slice(0, MAX_WHAT);
    var msg = (state.editing ? T.saved : T.added)(what || T.untitled, money(cents));
    var e = { id: state.editing || newId(), what: what, cents: cents, payer: state.payer, parts: parts.slice() };
    var payer = state.payer;
    resetForm();
    state.payer = payer;   // the next expense is often paid by the same person
    act({ t: 'put-expense', e: e });
    say('spend-msg', msg, false, 4000);
    $('what-input').focus();
  });
  $('spend-cancel').addEventListener('click', function () {
    var payer = state.payer;
    resetForm();
    state.payer = payer;
    say('spend-msg', '');
    renderForm(); renderLedger();
    $('what-input').focus();
  });

  // edit loads an expense into the form; delete asks once more on the same button
  var delTimer;
  $('ledger').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-edit], [data-del]');
    if (!b) return;
    if (b.hasAttribute('data-edit')) {
      var e = expense(b.getAttribute('data-edit'));
      if (!e) return;
      state.editing = e.id; state.payer = e.payer; state.parts = e.parts.slice(); state.confirmDel = null;
      $('what-input').value = e.what; $('amount-input').value = plain(e.cents);
      say('spend-msg', '');
      renderForm(); renderLedger();
      $('spend-form').scrollIntoView({ block: 'start' });
      $('amount-input').focus({ preventScroll: true });
      return;
    }
    var id = b.getAttribute('data-del');
    clearTimeout(delTimer);
    if (state.confirmDel !== id) {
      state.confirmDel = id;
      renderLedger();
      var again = $('ledger').querySelector('[data-del="' + id + '"]');
      if (again) again.focus();
      delTimer = setTimeout(function () { state.confirmDel = null; renderLedger(); }, 4000);
      return;
    }
    var at = state.expenses.indexOf(expense(id));
    state.confirmDel = null;
    if (state.editing === id) resetForm();
    act({ t: 'remove-expense', id: id });
    // focus moves to the entry that took its place, or the one before, or back to the form
    var left = $('ledger').querySelectorAll('[data-del]');
    (left[Math.min(at, left.length - 1)] || $('what-input')).focus();
  });

  // step 3: copy the plan or the link, both pointing at the shared ledger
  $('copy-text').addEventListener('click', function () {
    share(function (url) {
      var T = I18N[state.lang], r = settle(tally());
      var total = state.expenses.reduce(function (a, e) { return a + e.cents; }, 0);
      var lines = [T.summary(state.people.length, state.expenses.length, money(total))];
      if (r.transfers.length) r.transfers.forEach(function (x) { lines.push(T.transferLine(nameOf(x.from.id), nameOf(x.to.id), money(x.cents))); });
      else lines.push(T.summaryNone);
      lines.push(T.details + url);
      return lines.join('\n');
    }, 'copied');
  });
  $('copy-link').addEventListener('click', function () {
    share(function (url) { return url; }, 'linkCopied');
  });

  // on a shared ledger this leaves it (it stays on the server); on one only here it clears everything
  $('reset').addEventListener('click', function () {
    var T = I18N[state.lang];
    if (!sync && !hasContent()) return;
    if (!window.confirm(sync ? T.newAsk : T.resetAsk)) return;
    sync = null;
    adopt({ people: [], expenses: [] });
    resetForm();
    ['people-msg', 'spend-msg', 'share-msg'].forEach(function (id) { say(id, ''); });
    banner('');
    save(); setHash(); render();
    $('name-input').focus();
  });

  // ---------- boot ----------
  try {
    var stored = localStorage.getItem(KEY), l = stored && fromData(JSON.parse(stored));
    if (l) adopt(l);
    var s = API && JSON.parse(localStorage.getItem(SYNC_KEY) || 'null');
    if (s && LEDGER_ID.test(s.id) && typeof s.version === 'number' && Array.isArray(s.pending)) {
      sync = { id: s.id, version: s.version, pending: s.pending, busy: false, status: 'busy' };
    }
  } catch (e) {}
  render();
  openLink();   // after the first render, so a question about replacing the ledger isn't asked over a blank page
  setHash();
  render();
  tick();
  setInterval(tick, POLL_MS);
  document.addEventListener('visibilitychange', tick);
  window.addEventListener('online', tick);
  window.addEventListener('hashchange', function () {
    if (location.hash.indexOf('#l=') !== 0 && location.hash.indexOf('#d=') !== 0) return;
    openLink(); setHash(); render(); tick();
  });
})();
</script>
<!-- GoatCounter: counts visits without cookies; the totals feed the visitor map on the homepage.
     It reports the path only, never the #d= part that carries a shared ledger. -->
<script data-goatcounter="https://wentaoz.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
