<style>
/* Layout: one 760px column, like a page of a brewer's notebook. Beer colours are the only warm colours
   on the page, and every one of them is computed; the interface itself is ink on paper with one hop green
   for whatever is selected. */
:root {
  --bg: #F4F0E6;            /* paper */
  --surface: #FBF9F4;
  --fg: #1F1B16;
  --muted: #696053;
  --rule: #DED6C6;
  --rule-strong: #A69A86;
  --accent: #3F7A2C;        /* hop green: selection, focus, links */
  --accent-soft: #DDE9D3;
  --dot: #8A8070;           /* unselected marks in the charts */
  --glass: rgba(31, 27, 22, 0.55);
  --err: #B3261E;
  /* the four main hop oils, and the rest */
  --oil-1: #1baf7a; --oil-2: #eda100; --oil-3: #e87ba4; --oil-4: #6250d6; --oil-x: #BDB4A6;
  --font-cjk: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", "SimSun", serif;
  --font-latin: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-body: "IBM Plex Sans", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13110E; --surface: #1C1814; --fg: #EDE6D9; --muted: #A0968A; --rule: #2E2822; --rule-strong: #564C40;
    --accent: #8CC46A; --accent-soft: #24331B; --dot: #8C8273; --glass: rgba(237, 230, 217, 0.5); --err: #F0806F;
    --oil-1: #199e70; --oil-2: #c98500; --oil-3: #d55181; --oil-4: #9085e9; --oil-x: #5C5348;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13110E; --surface: #1C1814; --fg: #EDE6D9; --muted: #A0968A; --rule: #2E2822; --rule-strong: #564C40;
  --accent: #8CC46A; --accent-soft: #24331B; --dot: #8C8273; --glass: rgba(237, 230, 217, 0.5); --err: #F0806F;
  --oil-1: #199e70; --oil-2: #c98500; --oil-3: #d55181; --oil-4: #9085e9; --oil-x: #5C5348;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
h1, h2, h3, p, ol, ul, dl, dd, figure { margin: 0; }
ol, ul { padding: 0; list-style: none; }
a { color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 0.18em; }
a:hover { text-decoration-thickness: 2.5px; }
button { font: inherit; color: inherit; }
a:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible + .srm-cursor { outline: 2px solid var(--accent); outline-offset: 2px; }
.page {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
.zh-only, .en-only { display: none; }
.lang-zh .zh-only, .lang-en .en-only { display: revert; }

/* header */
.home { display: inline-block; margin-bottom: 8px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
.home:hover, .home:focus-visible { color: var(--fg); }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--rule-strong); }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand .name { font-family: var(--font-cjk); font-weight: 900; font-size: 22px; letter-spacing: 0.04em; }
.brand .name-latin { font-family: var(--font-latin); font-style: italic; font-size: 21px; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.tools { display: flex; align-items: center; gap: 8px; flex: none; }
.theme {
  appearance: none; border: 1px solid var(--rule-strong); border-radius: 999px; background: transparent; color: var(--muted);
  font: 500 12px/1 var(--font-body); padding: 7px 11px; cursor: pointer; letter-spacing: 0.04em;
}
.theme[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.lang { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 999px; overflow: hidden; flex: none; }
.lang button { appearance: none; border: 0; background: transparent; color: var(--muted); font: 500 12px/1 var(--font-body); padding: 7px 11px; cursor: pointer; letter-spacing: 0.04em; }
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

.lede { margin: 22px 0 0; font-size: 18px; line-height: 1.6; max-width: 38em; text-wrap: pretty; }
.lang-en .lede { font-family: var(--font-latin); font-size: 19px; line-height: 1.5; font-variation-settings: "opsz" 24; }

/* sections */
section.block { padding-top: 40px; }
.sec { display: flex; align-items: baseline; gap: 12px; margin: 0 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
.sec .num { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }
.sec .t { font-size: 22px; line-height: 1.2; }
.lang-zh .sec .t { font-family: var(--font-cjk); font-weight: 900; letter-spacing: 0.04em; }
.lang-en .sec .t { font-family: var(--font-latin); font-weight: 600; font-variation-settings: "opsz" 48; }
.intro { font-size: 15px; color: var(--muted); max-width: 40em; margin: 0 0 16px; }
.intro b { color: var(--fg); font-weight: 600; }

/* 01: the six steps */
.flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 22px; counter-reset: step; }
.flow li { border-top: 2px solid var(--fg); padding-top: 8px; font-size: 14px; line-height: 1.55; }
.flow li b { display: block; font-size: 15px; margin-bottom: 3px; }
.lang-zh .flow li b { font-family: var(--font-cjk); font-weight: 900; font-size: 16px; letter-spacing: 0.04em; }
.lang-en .flow li b { font-family: var(--font-latin); font-weight: 600; font-size: 17px; }
.flow li b::before { counter-increment: step; content: counter(step); font-family: var(--font-mono); font-weight: 400; font-size: 11px; color: var(--muted); margin-right: 8px; letter-spacing: 0.04em; }
@media (max-width: 640px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 420px) { .flow { grid-template-columns: minmax(0, 1fr); } }

/* filters: one row of text tabs above everything they scope */
.filters { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0 0 10px; }
.filters button {
  appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 4px 0 5px; cursor: pointer;
  font: 600 13px/1.2 var(--font-body); color: var(--muted);
}
.filters button:hover { color: var(--fg); }
.filters button[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.filters .count { font-family: var(--font-mono); font-weight: 400; font-size: 11px; margin-left: 4px; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  appearance: none; display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  border: 1px solid var(--rule-strong); border-radius: 999px; background: var(--surface);
  font: 500 13px/1.2 var(--font-body); padding: 6px 11px 6px 8px; min-height: 32px;
}
.chip:hover { border-color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .sw { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18); }
.chip[aria-pressed="true"] .sw { box-shadow: 0 0 0 1.5px var(--bg); }
.chip.nosw { padding-left: 11px; }
.chip.small { min-height: 28px; padding: 4px 10px; font-size: 12.5px; }
.chip-group { flex: 0 0 100%; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 -1px; }
.chip-group:first-child { margin-top: 0; }
.lang-zh .chip-group { font-family: var(--font-body); font-size: 11.5px; letter-spacing: 0.04em; text-transform: none; }

/* cards */
.card { margin-top: 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 18px 16px; }
.card-head { display: grid; grid-template-columns: 124px minmax(0, 1fr); grid-template-areas: "glass ttl" "glass sum"; grid-template-rows: auto 1fr; column-gap: 18px; align-items: start; }
.card-head .glass { grid-area: glass; }
.card-head .ttl { grid-area: ttl; min-width: 0; }
.card-head .csum { grid-area: sum; }
.glass { position: relative; width: 124px; height: 220px; }
.glass canvas { display: block; width: 100%; height: 100%; }
.kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.cname { margin: 4px 0 0; line-height: 1.12; text-wrap: balance; }
.cname .a { font-size: 30px; }
.lang-zh .cname .a { font-family: var(--font-cjk); font-weight: 900; letter-spacing: 0.03em; }
.lang-en .cname .a { font-family: var(--font-latin); font-weight: 600; font-variation-settings: "opsz" 72; }
.cname .b { display: block; margin-top: 2px; font-family: var(--font-latin); font-style: italic; font-weight: 400; font-size: 17px; color: var(--muted); }
.cmeta { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.csum { margin: 10px 0 0; font-size: 15px; line-height: 1.6; text-wrap: pretty; }
@media (max-width: 480px) {
  .card { padding: 14px 14px 12px; }
  .card-head { grid-template-columns: 92px minmax(0, 1fr); grid-template-areas: "glass ttl" "sum sum"; column-gap: 14px; }
  .card-head .ttl { align-self: center; }
  .glass { width: 92px; height: 170px; }
  .cname .a { font-size: 25px; }
}

/* vital statistics */
.vitals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 16px; margin: 16px 0 0; padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.vitals div { min-width: 0; }
.vitals dt { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.vitals dd { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.vitals dd small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 1px; }
@media (max-width: 560px) { .vitals { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* SRM strip: the colour of 5 cm of beer from 1.5 to 45 SRM on a log scale; drag to preview */
.srm-wrap { margin-top: 16px; }
.srm-label { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.srm-label b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.srm { position: relative; height: 26px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1); cursor: ew-resize; touch-action: pan-y; }
.srm input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; pointer-events: none; }
.srm-band { position: absolute; top: -5px; bottom: -5px; border: 2px solid var(--fg); border-radius: 5px; pointer-events: none; }
.srm-cursor { position: absolute; top: -8px; bottom: -8px; width: 6px; margin-left: -3px; background: var(--surface); border: 1.5px solid var(--fg); border-radius: 3px; pointer-events: none; }
.srm-axis { position: relative; height: 18px; margin-top: 6px; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.srm-axis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.srm-axis span:last-child { transform: translateX(-100%); }

/* the brewing steps of one style */
.steps { margin: 16px 0 0; }
.steps li { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); font-size: 14.5px; line-height: 1.6; }
.steps li:first-child { padding-top: 0; }
.steps .lab { font-size: 15px; line-height: 1.5; }
.lang-zh .steps .lab { font-family: var(--font-cjk); font-weight: 900; letter-spacing: 0.06em; }
.lang-en .steps .lab { font-family: var(--font-latin); font-weight: 600; }
.steps .lab small { display: block; font-family: var(--font-mono); font-weight: 400; font-size: 10px; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
@media (max-width: 420px) { .steps li { grid-template-columns: minmax(0, 1fr); gap: 2px; } .steps .lab small { display: inline; margin-left: 8px; } }
.facts { display: grid; gap: 8px; margin: 14px 0 0; font-size: 14px; }
.facts > div { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; align-items: baseline; }
.facts dt { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.facts dd { min-width: 0; }
.facts .chips { gap: 5px; }
@media (max-width: 420px) { .facts > div { grid-template-columns: minmax(0, 1fr); gap: 4px; } }

/* charts */
.chart { position: relative; margin-top: 22px; }
.chart-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-bottom: 6px; }
.chart-head h3 { font-size: 15px; font-weight: 600; }
.chart-note { font-size: 12.5px; color: var(--muted); margin-top: 6px; max-width: 46em; }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 999px; overflow: hidden; }
.seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: 500 12px/1 var(--font-body); padding: 6px 11px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.ax-grid { stroke: var(--rule); stroke-width: 1; shape-rendering: crispEdges; }
.ax-base { stroke: var(--rule-strong); stroke-width: 1; shape-rendering: crispEdges; }
.ax-tick { font-family: var(--font-mono); font-size: 10.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.ax-title { font-family: var(--font-body); font-size: 11.5px; fill: var(--muted); }
.ax-zone { font-family: var(--font-body); font-size: 11px; fill: var(--muted); font-style: italic; }
.pt { fill: var(--dot); stroke: var(--surface); stroke-width: 2; cursor: pointer; }
.pt.off { opacity: 0.22; }
.pt.hot { fill: var(--fg); }
.pt.on { fill: var(--accent); }
.pt-range { fill: var(--accent); fill-opacity: 0.12; stroke: var(--accent); stroke-opacity: 0.55; stroke-width: 1; }
.pt-label { font-family: var(--font-body); font-size: 12px; font-weight: 600; fill: var(--fg); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.plot-bg { fill: var(--surface); }
.tip {
  position: absolute; top: 0; left: 0; z-index: 2; display: grid; gap: 2px; padding: 7px 9px; min-width: 120px;
  background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 6px;
  font-size: 12px; line-height: 1.35; color: var(--muted); pointer-events: none; white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
}
.tip b { color: var(--fg); font-weight: 600; font-size: 13px; }
.tip .v { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

/* hops */
.uses { display: inline-block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: 2px; }
.uses.st { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--rule-strong); }
.oil-none { font-size: 13px; color: var(--muted); }
.hop-head .cname .a { font-size: 28px; }
.aroma { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.aroma li { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--rule); background: var(--bg); }
.acids { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 16px; margin: 16px 0 0; padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.acids div { min-width: 0; }
.acids dt { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.lang-zh .acids dt, .lang-zh .vitals dt, .lang-zh .facts dt { text-transform: none; letter-spacing: 0.04em; font-family: var(--font-body); font-size: 11px; }   /* keeps α and β lower-case */
.acids dd { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.acids dd small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
@media (max-width: 560px) { .acids { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.oils { margin-top: 16px; }
.oils h4 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
.oilbar { display: flex; gap: 2px; height: 28px; }
.oilbar span { position: relative; display: flex; align-items: center; min-width: 0; height: 100%; border-radius: 4px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; padding-left: 7px; white-space: nowrap; overflow: visible; }
.oilbar .o1 { background: var(--oil-1); color: #fff; } .oilbar .o2 { background: var(--oil-2); color: #0b0b0b; }
.oilbar .o3 { background: var(--oil-3); color: #fff; } .oilbar .o4 { background: var(--oil-4); color: #fff; }
.oilbar .ox { background: var(--oil-x); color: #0b0b0b; }
:root[data-theme="dark"] .oilbar .ox { color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .oilbar .ox { color: #fff; } }
.oilkey { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.oilkey span { display: inline-flex; align-items: center; gap: 6px; }
.oilkey i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.oilkey b { color: var(--fg); font-weight: 600; }
.src { margin: 12px 0 0; font-size: 12px; color: var(--muted); }

/* 04: the calculator and the questions */
.calc { margin-top: 0; }
.calc-h { font-size: 18px; line-height: 1.3; }
.lang-zh .calc-h { font-family: var(--font-cjk); font-weight: 900; letter-spacing: 0.03em; }

      calcNote: '浸出物是酒里除了水和酒精以外溶着的一切。比重计读到的“表观浸出物”偏低，因为酒精比水轻；按 Balling 的公式把酒精的影响扣回去，才是真实浸出物。它的七八成是几乎不甜的糊精，所以一杯按重量和甜型葡萄酒差不多的 IPA，并不真有那么多糖：下面第一个问题讲的就是这个。',

      more: '展开全文',
      refs: '参考：',
      methodH: '怎么算的',
      method: '<p><span class="k">颜色</span><br>SRM 的定义是 1 厘米厚的啤酒在 430 nm 处吸光度的 12.7 倍（ASBC Beer-10A），EBC 约为 SRM 的 1.97 倍。其他波长的吸收，用 A. J. deLange 从 99 种啤酒得出的平均光谱：<code>A(λ) = SRM/12.7 × (0.018747 e<sup>−(λ−430)/13.374</sup> + 0.98226 e<sup>−(λ−430)/80.514</sup>)</code>。杯子里每个像素的颜色，都是日光（D65）穿过那一点的啤酒之后剩下的光：按 Beer–Lambert 定律逐个波长衰减，再用 CIE 1931 标准观察者换算成 sRGB，和主页上薄膜颜色的算法一样。光在圆杯里走过的距离是 2√(R² − x²)，所以杯子中间深、边缘浅；杯子按常见的内径和高度等比例画。超出 sRGB 色域的颜色，保持亮度降低饱和度。这个模型假定啤酒是澄清的，浑浊的风格另外盖了一层乳白，只是示意；颜色和平均光谱差得远的啤酒（比如樱桃兰比克）也算不准。</p>' +
              '<p><span class="k">风格的数字</span><br>原麦汁浓度、最终比重、酒精度、苦度和颜色都是 BJCP 2021 风格指南给的范围，卡片下方标着对应的分类号。°P（柏拉图度，国产啤酒标签上的“原麦汁浓度”）由比重按 ASBC 的多项式换算。发酵度 = (OG − FG) ÷ (OG − 1)；苦甜比 BU:GU = IBU ÷ ((OG − 1) × 1000)，是酿酒师衡量苦和麦芽是否平衡的老办法，0.5 左右算平衡，越高越苦。这两项都按范围的中间值计算。</p>' +
              '<p><span class="k">酒花的数字</span><br>α 酸、β 酸、合葎草酮和精油的范围，来自各品种的育种者或原产地种植商、经销商公布的规格，每种酒花下面列着来源。精油组成按各成分范围的中间值画，剩下的归为“其他”。每年的收成和产地不同，实际数字会有出入。</p>' +
              '<p><span class="k">计算器</span><br>°P 和比重互换用 ASBC 的多项式和它常用的反函数。真实浸出物按 Balling 的关系 RE = 0.1808 × OE + 0.8192 × AE，OE、AE 是原麦汁和最终比重换成的 °P；按重量的酒精度 ABW = (OE − RE) ÷ (2.0665 − 0.010665 × OE)，按体积 ABV = ABW × FG ÷ 0.794。热量（千卡）= (6.9 × ABW + 4.0 × (RE − 0.1)) × FG × 毫升数 ÷ 100：酒精每克约 7 千卡，浸出物扣掉约 0.1% 的矿物质后每克约 4 千卡。和葡萄酒的比较用欧盟标签的残糖分级：干型 4 克/升以下，半干 12 克以下，半甜 45 克以下，甜型 45 克以上。</p>' +
              '<p><span class="k">酿法</span><br>每种风格的步骤根据 BJCP 指南里的历史和原料说明，以及酒厂公开的做法整理，写的是传统或典型的做法，不是唯一的做法。</p>',

      eyebrow: function (ns, nh) { return 'A field guide to beer styles and hops · ' + ns + ' styles · ' + nh + ' hops'; },
      lede: 'A beer is four things: malt, hops, yeast and water. Nearly everything that sets one style apart from another is in how they are handled: how dark the malt is kilned, the temperature the mash is held at, when the hops go in, whether the yeast works at 10 °C or at 30 °C, and whether the beer rests for weeks in a cold cellar or three years in oak. Pick a style to see how it is brewed; the colour in its glass is computed, point by point, from how much light the beer absorbs.',
      brewing: 'How beer is made',
      flow: [
        ['Malting', 'Barley is steeped, left to sprout for four or five days and dried in a kiln, readying its starch and the enzymes that will break it down. The hotter the kiln, the darker the malt: pilsner malt at about 80 °C, Munich at about 100 °C. Crystal malt is first stewed wet at 65–70 °C, so the starch turns to sugar inside the grain, then roasted; black malt is roasted above 200 °C.'],
        ['Mashing', 'Crushed malt is mixed with hot water and held at 62–72 °C for about an hour while the malt’s own enzymes cut its starch into sugar. Beta-amylase, most active at 60–65 °C, makes maltose the yeast can eat; alpha-amylase, most active at 68–72 °C, makes dextrins it can’t. So a cooler mash gives a drier beer, a warmer one a fuller body. The sweet liquid, the wort, is run off and the grain rinsed with hot water.'],
        ['Boiling', 'The wort boils for 60–90 minutes: it is sterilised, proteins clump and settle, and DMS, with its smell of sweetcorn, is driven off. Heat turns the hops’ alpha acids into soluble iso-alpha acids, the source of bitterness, so hops added early give bitterness and hops added late keep their volatile, aromatic oils. This is where the original gravity is set.'],
        ['Fermenting', 'The wort is cooled and yeast goes in. Ale yeast, Saccharomyces cerevisiae, works at the top at 15–24 °C, in a few days, and makes fruity esters. Lager yeast, S. pastorianus, a hybrid of S. cerevisiae with the cold-loving S. eubayanus, works at the bottom at 7–13 °C, slowly and cleanly. Sugar becomes alcohol and carbon dioxide; how far the gravity falls from original to final sets the strength.'],
        ['Conditioning', 'Lagers rest near 0 °C for weeks; ales referment in cask or bottle to make their bubbles; dry hops steeped in the cold beer add aroma without bitterness; wild beers spend years in oak.'],
        ['Serving', 'Filtering, carbonation, temperature and glass all change the taste. English cask ale holds about 2 g of carbon dioxide a litre, a German wheat beer 7–9 g; pale lager is served at 2–6 °C, strong ales at 12–16 °C.']
      ],

      smapH: 'The style map',

      smapAria: function (n) { return 'Scatter plot of ' + n + ' beer styles by colour and bitterness; the table below gives the numbers.'; },

      hopsIntro: 'Hops are the cones of the female hop plant, <i>Humulus lupulus</i>. Golden lupulin glands at the base of their bracts hold the two things that matter: <b>alpha acids</b>, which the boil turns bitter, and <b>essential oils</b>, volatile, which carry the aroma. Europe’s traditional “noble” hops are low in alpha acid and delicate in aroma; the newer American and southern-hemisphere varieties are rich in both, with citrus and tropical fruit. China grows hops too, mostly in Xinjiang and Gansu’s Hexi Corridor, and mostly Tsingtao Flower.',

      sweet: 'Sugar and sweetness',
      sweetIntro: 'How much sugar the mash leaves, and how much of it the yeast eats, decide a beer’s body, its sweetness and its calories. Work out a glass with the calculator, then read two questions people often ask.',
      calcH: 'Work out a glass: what’s left in it',

      presets: { style: function (n) { return 'This style: ' + n; }, ddh: 'Hazy double IPA', wc: 'West Coast IPA', cn: 'Chinese lager, 9 °P, 3.6%', stout: 'Imperial stout' },
      presetsAria: 'Fill in a beer’s numbers',

      kcalH: 'Where the calories come from',

      kcalAria: function (a, e) { return 'Energy: ' + a + '% from alcohol, ' + e + '% from extract.'; },
      calcNote: 'The extract is everything dissolved in the beer besides water and alcohol. A hydrometer reads it low, as the apparent extract, because alcohol is lighter than water; Balling’s formula puts the alcohol back to give the real extract. Seven or eight tenths of it are dextrins, which are barely sweet, so an IPA that weighs in like a sweet wine is nowhere near as sugary: that is the first question below.',
      err: { og: 'Keep the original gravity between 1.020 and 1.150 (5–34 °P).', fg: 'The final gravity has to be below the original, and no lower than 0.990.', abv: 'That much alcohol needs a higher original gravity.' },
      more: 'Read the full answer',
      refs: 'References: ',
      methodH: 'How it is computed',
      method: '<p><span class="k">Colour</span><br>SRM is 12.7 times the absorbance of 1 cm of beer at 430 nm (ASBC Beer-10A); EBC is about 1.97 times SRM. At other wavelengths the absorbance follows A. J. deLange’s average spectrum of 99 beers: <code>A(λ) = SRM/12.7 × (0.018747 e<sup>−(λ−430)/13.374</sup> + 0.98226 e<sup>−(λ−430)/80.514</sup>)</code>. Every pixel of a glass is the daylight (D65) left after crossing the beer at that point, attenuated wavelength by wavelength by the Beer–Lambert law and turned into sRGB with the CIE 1931 observer, the same way the homepage computes a film’s colour. Light crosses 2√(R² − x²) of a round glass, so the middle is darker than the edges; the glasses are drawn to scale from typical inside dimensions. Colours outside sRGB lose saturation at constant luminance. The model assumes clear beer, so hazy styles get a milky layer that is only a sketch, and beers far from the average spectrum, such as a cherry lambic, come out wrong.</p>' +
              '<p><span class="k">The style numbers</span><br>Original and final gravity, alcohol, bitterness and colour are the ranges of the BJCP 2021 Style Guidelines, by the category under each card. Degrees Plato, the unit on Chinese and Czech labels, come from the gravity by the ASBC polynomial. Attenuation is (OG − FG) ÷ (OG − 1); BU:GU is IBU ÷ ((OG − 1) × 1000), the brewer’s old measure of bitterness against malt, balanced near 0.5 and more bitter the higher it goes. Both are taken at the middle of the ranges.</p>' +
              '<p><span class="k">The hop numbers</span><br>Alpha and beta acids, cohumulone and oils are the ranges published by each variety’s breeder or by the growers and merchants of its home country; the sources are listed under each hop. The oil bar uses the middle of each range and calls the rest “other”. Crops vary from year to year and farm to farm.</p>' +
              '<p><span class="k">The calculator</span><br>Degrees Plato and gravity convert by the ASBC polynomial and its usual inverse. The real extract follows Balling: RE = 0.1808 × OE + 0.8192 × AE, with OE and AE the original and final gravity in °P. Alcohol by weight is ABW = (OE − RE) ÷ (2.0665 − 0.010665 × OE), and by volume ABV = ABW × FG ÷ 0.794. Energy, in kcal, is (6.9 × ABW + 4.0 × (RE − 0.1)) × FG × millilitres ÷ 100: about 7 kcal a gram of alcohol and 4 a gram of extract, less about 0.1% for minerals. The comparison with wine uses the EU’s label bands for residual sugar: dry under 4 g/L, medium dry under 12, medium sweet under 45, sweet above.</p>' +

    var a = d == null ? String(r[0]) : num(r[0], d);
    return a === b ? a : a + '–' + b;
  }
  function sg(r) { return r[0].toFixed(3) + '–' + r[1].toFixed(3); }
  function plato(r) { return B.plato(r[0]).toFixed(1) + '–' + B.plato(r[1]).toFixed(1); }
  function mid(r) { return (r[0] + r[1]) / 2; }
  // a published range's middle, or its limit where only an upper limit is published
  function val(r) { return r == null ? null : r[0] == null ? r[1] : (r[0] + r[1]) / 2; }

           '<rect x="' + M.l + '" y="' + (M.t + ph + 4) + '" width="' + pw + '" height="8" rx="2" fill="url(#' + opt.band.id + ')"/>';
    }

         '<text class="ax-title" x="' + M.l + '" y="' + (M.t - 4) + '" text-anchor="start">' + esc(opt.yTitle) + '</text>';
    (opt.zones || []).forEach(function (z) {

  function renderTables() {
    var Tx = T(), th = Tx.th;
    var s = '<table><thead><tr><th>' + th.style + '</th><th>' + th.og + '</th><th>' + th.fg + '</th><th>' + th.abv + '</th><th>' + th.ibu + '</th><th>' + th.srm + '</th><th>BJCP</th></tr></thead><tbody>';
    D.STYLES.forEach(function (x) {
      s += '<tr class="click" data-style="' + x.id + '"><td><span class="sw" style="background:' + swatch(gmid(x.srm)) + '"></span>' + esc(t(x.n)) + '</td><td>' + sg(x.og) + '</td><td>' + sg(x.fg) + '</td><td>' + fr(x.abv) + '%</td><td>' + fr(x.ibu) + '</td><td>' + fr(x.srm) + '</td><td>' + esc(x.bjcp) + '</td></tr>';
    });
    $('t-styles-body').innerHTML = s + '</tbody></table>';
    var hsrc = '<table><thead><tr><th>' + th.hop + '</th><th>' + th.origin + '</th><th>' + th.use + '</th><th>' + th.alpha + '</th><th>' + th.beta + '</th><th>' + th.oil + '</th></tr></thead><tbody>';
    D.HOPS.forEach(function (h) {
      var o = D.HOP_ORIGINS.filter(function (x) { return x.key === h.o; })[0];
      hsrc += '<tr class="click" data-hop="' + h.id + '"><td>' + esc(t(h.n)) + '</td><td>' + esc(t(o.name)) + '</td><td>' + esc(Tx.use[h.use]) + '</td><td>' + (h.alpha ? fr(h.alpha) + '%' : '–') + '</td><td>' + (h.beta ? fr(h.beta) + '%' : '–') + '</td><td>' + (h.oil ? fr(h.oil) : '–') + '</td></tr>';
    });
    $('t-hops-body').innerHTML = hsrc + '</tbody></table>';
  }

  /* ---------- selection, and the address that keeps it ---------- */
  function parseHash() {
    var out = {};
    (location.hash || '').replace(/^#/, '').split('&').forEach(function (kv) {
      var p = kv.split('='); if (p.length === 2) out[p[0]] = decodeURIComponent(p[1]);
    });
    return out;
  }
  function keepInURL() {
    try { history.replaceState(null, '', '#s=' + state.style + '&h=' + state.hop); } catch (e) {}
  }
  function pickStyle(id, scroll) {
    if (!STYLE[id]) return;
    state.style = id;
    if (!visibleStyle(STYLE[id])) state.region = 'all';
    renderStyleFilter(); renderStyleChips(); renderStyle(); renderStyleMap();
    if (calc.preset === 'style') usePreset('style');
    renderCalc();
    document.title = T().title(t(STYLE[id].n));
    keepInURL();
    if (scroll) $('style-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function pickHop(id, scroll) {
    if (!HOP[id]) return;
    state.hop = id;
    if (!visibleHop(HOP[id])) state.origin = 'all';
    renderHopFilter(); renderHopChips(); renderHop(); renderHopMap();
    keepInURL();
    if (scroll) $('hop-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button, tr.click') : null;
    if (!b) return;
    if (b.parentNode && b.parentNode.id === 'style-chips') return pickStyle(b.getAttribute('data-id'));
    if (b.parentNode && b.parentNode.id === 'hop-chips') return pickHop(b.getAttribute('data-id'));
    if (b.parentNode && b.parentNode.id === 'style-filter') {
      state.region = b.getAttribute('data-k');
      renderStyleFilter(); renderStyleChips(); renderStyleMap();
      return;
    }
    if (b.parentNode && b.parentNode.id === 'hop-filter') {
      state.origin = b.getAttribute('data-k');
      renderHopFilter(); renderHopChips(); renderHopMap();
      return;
    }
    if (b.parentNode && b.parentNode.id === 'smap-y') { state.y = b.getAttribute('data-y'); render(); return; }
    if (b.hasAttribute('data-hop')) return pickHop(b.getAttribute('data-hop'), true);
    if (b.hasAttribute('data-style')) return pickStyle(b.getAttribute('data-style'), true);
  });
  hookTip($('smap-svg'), $('smap-tip'), function () { return smapGeom; }, function (s) { pickStyle(s.id); },
    function (s) { return T().tipStyle(s); }, function (s) { return t(s.n); });
  hookTip($('hmap-svg'), $('hmap-tip'), function () { return hmapGeom; }, function (h) { pickHop(h.id); },
    function (h) { return T().tipHop(h); }, function (h) { return t(h.n); });

  function setLang(l) { state.lang = l; try { localStorage.setItem('gravity.lang', l); } catch (e) {} render(); }
  $('btn-zh').addEventListener('click', function () { setLang('zh'); });
  $('btn-en').addEventListener('click', function () { setLang('en'); });

  // light / dark: follows the system until chosen; the choice is shared with the homepage
  var mqDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function isDark() { var v = root.getAttribute('data-theme'); return v ? v === 'dark' : !!(mqDark && mqDark.matches); }
  function showTheme() { $('btn-theme').setAttribute('aria-pressed', isDark() ? 'true' : 'false'); }
  $('btn-theme').addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark', system = mqDark && mqDark.matches ? 'dark' : 'light';
    // picking what the system already shows clears the choice, so the page follows the system again
    if (next === system) root.removeAttribute('data-theme'); else root.setAttribute('data-theme', next);
    try {
      if (next === system) localStorage.removeItem('wentaoz.theme'); else localStorage.setItem('wentaoz.theme', next);
    } catch (e) {}
    showTheme(); renderSrm();
  });
  if (mqDark && mqDark.addEventListener) mqDark.addEventListener('change', function () { showTheme(); renderSrm(); });
  showTheme();
  $('btn-theme').hidden = false;

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { renderStyleMap(); renderHopMap(); renderSrm(); renderHop(); }, 120);
  });

  // a link followed within the page, or an address typed in, picks its style and hop
  window.addEventListener('hashchange', function () {
    if (openQuestion()) return;
    var h = parseHash();
    if (h.s && STYLE[h.s] && h.s !== state.style) pickStyle(h.s);
    if (h.h && HOP[h.h] && h.h !== state.hop) pickHop(h.h);
  });

  render();
  if (openQuestion()) { /* opened and scrolled to */ }
  else if (fromHash.h && HOP[fromHash.h] && !fromHash.s) $('hop-card').scrollIntoView();
  else if (fromHash.s && STYLE[fromHash.s]) $('style-card').scrollIntoView();
})();
</script>

<script data-goatcounter="https://wentaoz.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
