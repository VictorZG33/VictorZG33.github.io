<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20fill%3D%22%231F6B45%22%2F%3E%3Cpath%20d%3D%22M11%206v20%22%20stroke%3D%22%23F4F3EE%22%20stroke-width%3D%222.5%22%2F%3E%3Cpath%20d%3D%22M12%206l11%204-11%204z%22%20fill%3D%22%23E2B04A%22%2F%3E%3Ccircle%20cx%3D%2222%22%20cy%3D%2224%22%20r%3D%223%22%20fill%3D%22%23F4F3EE%22%2F%3E%3C%2Fsvg%3E">
<title>挥杆镜 Swing Mirror</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column like a scorecard. Upload, then the swing (player, the four key frames, tempo,
   findings), then the optional AI coach. Fairway green for good, sand for things to watch, flag red
   for things to fix. Everything on the video is drawn in a bright line with a dark edge so it reads
   on grass and on sky. */
:root {
  --bg: #F4F3EE;
  --surface: #FFFFFF;
  --fg: #17201A;
  --muted: #5B675F;
  --rule: #DCDDD3;
  --rule-strong: #A6AC9F;
  --green: #1F6B45;  --green-soft: #DDEBE1;
  --sand: #8A5D0B;   --sand-soft: #F4E8C8;
  --flag: #B3261E;   --flag-soft: #F6DEDA;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1511; --surface: #18201B; --fg: #E4E9E3; --muted: #98A69C; --rule: #27312A; --rule-strong: #4A564E;
    --green: #74C79A; --green-soft: #1A3125; --sand: #E2B04A; --sand-soft: #352B16; --flag: #F2897C; --flag-soft: #3C2220;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1511; --surface: #18201B; --fg: #E4E9E3; --muted: #98A69C; --rule: #27312A; --rule-strong: #4A564E;
  --green: #74C79A; --green-soft: #1A3125; --sand: #E2B04A; --sand-soft: #352B16; --flag: #F2897C; --flag-soft: #3C2220;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.page {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
a { color: inherit; text-decoration-color: var(--green); text-underline-offset: 3px; }

/* header */
.home { display: inline-block; margin-bottom: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
.home:hover, .home:focus-visible { color: var(--fg); }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--rule-strong); }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand .name { font-weight: 700; font-size: 21px; letter-spacing: 0.06em; }
.brand .name-latin { font-family: var(--display); font-stretch: 112%; font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.tools { display: flex; align-items: center; gap: 8px; flex: none; }
.pill {
  appearance: none; border: 1px solid var(--rule-strong); border-radius: 999px; background: transparent; color: var(--muted);
  font: 500 12px/1 var(--body); padding: 7px 11px; cursor: pointer; letter-spacing: 0.04em;
}
.pill[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.lang { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 999px; overflow: hidden; flex: none; }
.lang button { appearance: none; border: 0; background: transparent; color: var(--muted); font: 500 12px/1 var(--body); padding: 7px 11px; cursor: pointer; letter-spacing: 0.04em; }
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* intro: the swing traced at its four positions */
.hero { display: grid; gap: 14px; padding-block: 28px 4px; }
.lead { margin: 0; font-size: clamp(19px, 3.6vw, 23px); line-height: 1.4; font-weight: 500; max-width: 34em; }
.lead-sub { margin: 0; color: var(--muted); max-width: 40em; }
.trace { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 6px 0 0; padding: 0; list-style: none; }
.trace li { display: grid; gap: 4px; justify-items: center; }
.trace svg { width: 100%; height: auto; max-height: 160px; }
.trace .bone { stroke: var(--fg); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.trace .club { stroke: var(--green); stroke-width: 1.5; stroke-linecap: round; }
.trace .ball { fill: var(--surface); stroke: var(--muted); stroke-width: 0.8; }
.trace .headdot { fill: var(--fg); }
.trace .ground { stroke: var(--rule-strong); stroke-width: 1.5; }
.trace span { font: 500 11px/1.2 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

/* steps */
.step { padding-block: 34px 4px; }
.step-h { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 19px; font-weight: 600; line-height: 1.3; }
.step-h .no {
  display: inline-grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 50%;
  background: var(--fg); color: var(--bg); font: 500 13px/1 var(--mono);
}
.hint { margin: 8px 0 0; font-size: 13.5px; color: var(--muted); }
.msg { margin: 10px 0 0; font-size: 14.5px; }
.msg:empty { display: none; }
.msg.bad { color: var(--flag); }

.drop {
  display: grid; justify-items: center; gap: 6px; padding: 28px 16px; text-align: center; cursor: pointer;
  background: var(--surface); border: 1.5px dashed var(--rule-strong); border-radius: 14px;
}
.drop:hover, .drop.over { border-color: var(--green); background: var(--green-soft); }
.drop:focus-within { outline: 2px solid var(--green); outline-offset: 2px; }
.drop .big { font-size: 17px; font-weight: 600; }
.drop .small { font-size: 13.5px; color: var(--muted); }
.drop svg { width: 34px; height: 34px; color: var(--green); }
.drop.busy { pointer-events: none; opacity: 0.55; }

.opts { display: flex; flex-wrap: wrap; gap: 14px 28px; margin-top: 16px; }
.opt { margin: 0; padding: 0; border: 0; min-width: 0; }
.opt legend { padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 500; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; display: inline-flex; }
.chip input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.chip span {
  display: inline-flex; align-items: center; min-height: 38px; padding: 7px 14px;
  border: 1px solid var(--rule-strong); border-radius: 999px; font-size: 14.5px; line-height: 1.3; color: var(--muted);
}
.chip:hover span { border-color: var(--fg); }
.chip input:checked + span { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.chip input:focus-visible + span { outline: 2px solid var(--green); outline-offset: 2px; }

.tips { margin: 18px 0 0; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--rule); font-size: 14.5px; }
.tips h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
.tips ul { margin: 0; padding-left: 1.2em; }
.tips li + li { margin-top: 3px; }

.progress { margin-top: 18px; }
.bar { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 3px; transition: width 0.15s linear; }
.progress-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 8px; font-size: 14px; color: var(--muted); }
.progress-row .btn { min-height: 34px; padding: 6px 12px; font-size: 13.5px; }

.btn {
  appearance: none; min-height: 44px; padding: 10px 16px; border: 1px solid var(--rule-strong); border-radius: 8px;
  background: var(--surface); font-size: 15px; font-weight: 500; line-height: 1.2; cursor: pointer;
}
.btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn:disabled { opacity: 0.5; cursor: default; }

/* the player */
.viewer { display: grid; gap: 10px; }
.stage { position: relative; justify-self: center; max-width: 100%; line-height: 0; background: #000; border-radius: 10px; overflow: hidden; }
.stage video { display: block; max-width: 100%; max-height: 68vh; width: auto; height: auto; }
.stage canvas { position: absolute; left: 0; top: 0; pointer-events: none; }
.scan { position: absolute; left: 10px; bottom: 10px; padding: 4px 9px; border-radius: 6px; background: rgba(0, 0, 0, 0.62); color: #fff; font: 500 12px/1.4 var(--mono); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.controls input[type="range"] { flex: 1 1 200px; accent-color: var(--green); min-height: 32px; }
.controls .time { font: 400 13px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 7.5em; }
.controls select { min-height: 38px; padding: 6px 8px; border: 1px solid var(--rule-strong); border-radius: 8px; background: var(--surface); font-size: 14px; }
.ctl { appearance: none; min-height: 38px; padding: 6px 14px; border: 1px solid var(--rule-strong); border-radius: 8px; background: var(--surface); font-size: 14px; font-weight: 500; cursor: pointer; }
.ctl:hover { border-color: var(--fg); }
.ctl[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.jumps { display: flex; flex-wrap: wrap; gap: 8px; }

.detected { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.detected b { color: var(--fg); font-weight: 600; }
.note { margin: 10px 0 0; padding: 10px 14px; border-radius: 8px; background: var(--sand-soft); font-size: 14px; }

/* key frames */
.frames { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 22px 0 0; padding: 0; list-style: none; }
@media (max-width: 560px) { .frames { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.frames figure { margin: 0; display: grid; gap: 6px; }
.frames canvas { width: 100%; height: auto; border-radius: 8px; background: #000; display: block; }
.frames button { appearance: none; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 8px; display: block; width: 100%; }
.frames figcaption { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; }
.frames figcaption b { font-weight: 600; }
.frames figcaption span { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.legend { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.legend i { display: inline-block; width: 18px; height: 0; vertical-align: middle; margin-right: 6px; border-top: 3px solid #C9B21F; }
.legend i.ref { border-top: 2px dashed #2A9FD0; }

/* tempo */
.tempo { margin-top: 30px; padding: 18px 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; }
.tempo-h { margin: 0; font-size: 13px; font-weight: 500; color: var(--muted); }
.tempo-num { margin: 4px 0 0; font-family: var(--display); font-stretch: 112%; font-weight: 700; font-size: clamp(44px, 12vw, 64px); line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.tempo-num small { font-size: 0.42em; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 0.3em; }
.tbar { display: flex; gap: 2px; margin-top: 14px; height: 14px; }
.tbar i { display: block; height: 100%; border-radius: 4px; }
.tbar .b { background: var(--green); }
.tbar .d { background: var(--fg); }
.tlabels { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tempo-text { margin: 10px 0 0; font-size: 14.5px; max-width: 60ch; }

/* findings */
.find-h { margin: 32px 0 4px; font-size: 16px; font-weight: 600; }
.summary { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
.findings { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule-strong); }
.finding { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.badge {
  display: inline-flex; align-items: center; gap: 5px; align-self: start; margin-top: 1px; padding: 3px 9px 3px 4px;
  border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap;
}
.badge::before { content: ""; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; color: var(--surface); font: 700 11px/18px var(--body); text-align: center; }
.badge.fix { background: var(--flag-soft); color: var(--flag); } .badge.fix::before { content: "!"; background: var(--flag); }
.badge.watch { background: var(--sand-soft); color: var(--sand); } .badge.watch::before { content: "~"; background: var(--sand); }
.badge.good { background: var(--green-soft); color: var(--green); } .badge.good::before { content: "✓"; background: var(--green); }
.badge.info { background: var(--rule); color: var(--muted); } .badge.info::before { content: "i"; background: var(--muted); }
.f-title { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; font-weight: 600; }
.f-val { font-family: var(--mono); font-size: 13.5px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.f-body { margin: 4px 0 0; font-size: 14.5px; }
.f-tip { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.f-tip b { color: var(--fg); font-weight: 600; }
.f-jump { appearance: none; border: 0; background: none; padding: 2px 0; margin-top: 4px; font-size: 13px; color: var(--green); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* coach */
.coach-intro { margin: 0 0 14px; font-size: 15px; max-width: 62ch; }
.coach-form { display: grid; gap: 14px; padding: 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; }
.field { display: grid; gap: 6px; }
.label { font-size: 13px; font-weight: 500; color: var(--muted); }
textarea, input[type="password"], input[type="text"] {
  width: 100%; min-height: 44px; padding: 10px 12px; font-size: 16px; line-height: 1.4;
  background: var(--bg); border: 1px solid var(--rule-strong); border-radius: 8px;
}
textarea { min-height: 76px; resize: vertical; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--green); }
.coach-out { margin-top: 18px; font-size: 15.5px; line-height: 1.65; }
.coach-out:empty { display: none; }
.coach-out h4 { margin: 18px 0 6px; font-size: 16px; }
.coach-out h4:first-child { margin-top: 0; }
.coach-out p { margin: 0 0 10px; }
.coach-out ul, .coach-out ol { margin: 0 0 10px; padding-left: 1.3em; }
.coach-out li + li { margin-top: 4px; }
.coach-meta { margin: 6px 0 0; font: 400 12.5px/1.5 var(--mono); color: var(--muted); }
.coach-meta:empty { display: none; }
.thinking { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14.5px; }
.thinking::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--rule-strong); border-top-color: var(--green); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .thinking::before { animation: none; } .bar i { transition: none; } }

/* method */
details { border-top: 1px solid var(--rule); margin-top: 40px; }
summary { cursor: pointer; padding: 16px 0; font-weight: 600; font-size: 15px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-family: var(--mono); color: var(--muted); font-size: 18px; }
details[open] summary::after { content: "–"; }
.method { padding: 0 0 18px; font-size: 14.5px; max-width: 62ch; }
.method p { margin: 0 0 12px; }
.method .k { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
footer { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--rule-strong); font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
footer .sig { font-family: var(--display); font-stretch: 112%; font-weight: 700; font-size: 15px; color: var(--fg); }
.lang-zh footer .sig { font-family: var(--body); letter-spacing: 0.06em; }
.nojs { margin: 22px 0 0; font-size: 17px; max-width: 34em; }
</style>
<noscript><style>.tools, .step, details, footer { display: none; }</style></noscript>
</head>
<body>
<div class="page lang-zh" id="page">
  <header class="top">
    <div>
      <a class="home" href="../">← wentaoz.com</a>
      <div class="brand"><span class="name" lang="zh-CN">挥杆镜</span><span class="name-latin" lang="en">Swing Mirror</span></div>
      <div class="eyebrow" id="eyebrow"></div>
    </div>
    <div class="tools">
      <button type="button" class="pill" id="btn-theme" aria-pressed="false" hidden></button>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="btn-zh" aria-pressed="true" lang="zh-CN">中文</button>
        <button type="button" id="btn-en" aria-pressed="false" lang="en">EN</button>
      </div>
    </div>
  </header>

  <noscript><p class="nojs">挥杆镜在你的浏览器里分析视频，需要 JavaScript。请开启后刷新页面。<br><span lang="en">Swing Mirror analyses the video in your browser and needs JavaScript. Turn it on and reload.</span></p></noscript>

  <section class="hero">
    <p class="lead" id="lead"></p>
    <p class="lead-sub" id="lead-sub"></p>
    <ol class="trace" id="trace" aria-hidden="true"></ol>
  </section>

  <section class="step" id="step-upload" aria-labelledby="h-upload">
    <h2 class="step-h"><span class="no" aria-hidden="true">1</span><span id="h-upload"></span></h2>
    <label class="drop" id="drop" for="file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="13" height="14" rx="2"/><path d="M15.5 10l6-3.5v11l-6-3.5"/></svg>
      <span class="big" id="drop-big"></span>
      <span class="small" id="drop-small"></span>
      <input type="file" id="file" accept="video/*" class="sr">
    </label>
    <div class="opts">
      <fieldset class="opt">
        <legend id="hand-label"></legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="hand" value="right" checked><span id="hand-right"></span></label>
          <label class="chip"><input type="radio" name="hand" value="left"><span id="hand-left"></span></label>
        </div>
      </fieldset>
      <fieldset class="opt">
        <legend id="view-label"></legend>
        <div class="chips">

// The words for one measurement: { title, value, body, tip }
function describe(m, T) {
  const F = T.f[m.id], s = m.status;
  const out = { title: F.title, value: F.value(m), body: '', tip: '' };
  switch (m.id) {
    case 'tempo':
      if (s === 'good') out.body = F.good();
      else if (m.value < 3) { out.body = F.low(); out.tip = F.tipLow; } else { out.body = F.high(); out.tip = F.tipHigh; }
      break;
    case 'headHeight':
      if (s === 'good') out.body = F.good();
      else if (m.dir === 'up') { out.body = F.up(); out.tip = F.tipUp; } else { out.body = F.down(); out.tip = F.tipDown; }
      break;
    case 'headSway':
      if (s === 'good') out.body = F.good();
      else if (m.dir === 'toward') { out.body = F.toward(); out.tip = F.tipToward; } else { out.body = F.away(); out.tip = F.tipAway; }
      break;
    case 'hipShift':
      if (s === 'good') out.body = F.good();
      else if (m.dir === 'slide') { out.body = F.slide(); out.tip = F.tipSlide; } else { out.body = F.back(); out.tip = F.tipBack; }
      break;
    case 'spineTilt':
      if (s === 'good') out.body = F.good();
      else if (m.dir === 'toward') { out.body = F.toward(); out.tip = F.tipToward; } else { out.body = F.much(); out.tip = F.tipMuch; }
      break;
    case 'spineAddress':
      if (s === 'good') out.body = F.good();
      else if (m.dir === 'upright') { out.body = F.upright(); out.tip = F.tipUpright; } else { out.body = F.bent(); out.tip = F.tipBent; }
      break;
    case 'spineKeep':
      if (s === 'good') out.body = F.good();
      else if (m.dir === 'up') { out.body = F.up(); out.tip = F.tipUp; } else { out.body = F.down(); out.tip = F.tipDown; }
      break;
    case 'backswing':
      out.body = F[m.dir]();
      break;
    default:
      if (s === 'good') out.body = F.good(); else { out.body = F.bad(); out.tip = F.tip; }
  }
  return out;
}

// ---------- the pose model ----------
let landmarker = null, tsBase = 0;
async function loadModel() {
  if (landmarker) return landmarker;
  const { FilesetResolver, PoseLandmarker } = await import(`${MP}/vision_bundle.mjs`);
  const fileset = await FilesetResolver.forVisionTasks(`${MP}/wasm`);
  const make = (delegate) => PoseLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: POSE_MODEL, delegate }, runningMode: 'VIDEO', numPoses: 1,
  });
  try { landmarker = await make('GPU'); } catch (e) { landmarker = await make('CPU'); }
  return landmarker;
}

// Seek and wait until the new frame is actually on screen; a seek that never reports back
// doesn't hang the run.
function seekTo(t) {
  return new Promise((resolve) => {
    let done = false;
    const finish = () => { if (!done) { done = true; clearTimeout(guard); resolve(); } };
    const guard = setTimeout(finish, 2000);
    video.addEventListener('seeked', () => {
      if (video.requestVideoFrameCallback) { video.requestVideoFrameCallback(() => finish()); setTimeout(finish, 150); }
      else requestAnimationFrame(() => requestAnimationFrame(finish));   // no way to know, so give it two frames
    }, { once: true });
    video.currentTime = t;
  });
}

// Load the clip and get its first frame decoded. iOS Safari loads no frames until playback starts
// (it ignores preload), so the muted clip plays for a moment; where play() is refused, as in Low
// Power Mode, a fresh load and a seek get the frame instead. A clip that still shows nothing gives
// up with a message rather than waiting for ever.
function openVideo(url, job, T) {
  return new Promise((resolve, reject) => {
    let done = false, refused = false;
    const end = (err) => {
      if (done) return;
      done = true; clearInterval(poll); clearTimeout(limit);
      video.removeEventListener('loadeddata', onData); video.removeEventListener('loadedmetadata', onMeta); video.removeEventListener('error', onError);
      video.pause();
      if (err) reject(err); else resolve();
    };
    const onData = () => end();
    const onMeta = () => { if (refused) video.currentTime = 0.001; };
    const onError = () => end(new Error(T.badVideo));
    video.addEventListener('loadeddata', onData);
    video.addEventListener('loadedmetadata', onMeta);
    video.addEventListener('error', onError);
    const poll = setInterval(() => { if (job.aborted) end(new Error(T.cancelled)); }, 250);
    const limit = setTimeout(() => end(new Error(T.stuck)), 20000);
    video.pause();
    video.src = url;
    video.play().then(() => { if (!done && video.readyState >= 2) end(); }).catch(() => {
      if (done) return;
      refused = true;
      video.load();
    });
  });
}

// ---------- tracking ----------
// Playing the clip through and reading each frame as it comes up decodes every frame once.
// Seeking to each frame instead makes the browser decode again from the last keyframe every
// time, which on phone video costs more than the pose model itself. Playback slows down when the
// model can't keep up, so the samples stay about SAMPLE_GAP apart on slow devices too. Anything
// playback skipped (a slow frame, a stall, a browser that won't play) is then filled in by seeking.
const SAMPLE_GAP = 1 / 30;   // seconds of video between analysed frames
const MIN_RATE = 0.1;        // slowest playback while tracking

function makeDetector(lm, W, H) {
  const sc = Math.min(1, DETECT_SIZE / Math.max(W, H));
  const work = document.createElement('canvas');
  work.width = Math.round(W * sc); work.height = Math.round(H * sc);
  const ctx = work.getContext('2d');
  const base = tsBase + 1000;   // the model wants timestamps that only ever increase, across videos too
  return (t) => {
    ctx.drawImage(video, 0, 0, work.width, work.height);
    tsBase = Math.max(tsBase + 1, base + Math.round(t * 1000));
    const res = lm.detectForVideo(work, tsBase);
    const pose = res.landmarks && res.landmarks[0];
    return { t, lm: pose ? pose.map((q) => [q.x * W, q.y * H, q.visibility == null ? 1 : q.visibility]) : null };
  };
}

async function track(detect, dur, gap, job, report, T) {
  let frames = [];
  if (video.requestVideoFrameCallback) {
    // The model's first call can take seconds (it compiles its GPU programs), so make it on a
    // paused video; otherwise the start of the clip, the address, plays past unseen.
    await seekTo(0);
    const first = detect(video.currentTime);
    frames.push(first); report(first);
    frames = frames.concat(await trackByPlaying(detect, gap, first.t, job, report));
  }
  // Fill the gaps by seeking: every SAMPLE_GAP step with no frame near it
  const end = dur - 0.01;
  let k = 0;
  const have = frames.map((f) => f.t).sort((x, y) => x - y), extra = [];
  for (let t = 0; t < end; t += gap) {
    while (k < have.length && have[k] < t - 0.75 * gap) k++;
    if (k < have.length && Math.abs(have[k] - t) <= 0.75 * gap) continue;
    if (job.aborted) throw new Error(T.cancelled);
    await seekTo(t);
    const f = detect(t);
    extra.push(f); report(f);
  }
  return frames.concat(extra).sort((x, y) => x.t - y.t);
}

// Reads frames while the video plays, until it ends, stalls, play() is refused (iOS Low Power
// Mode does that) or the run is cancelled. The pose model tracks from one frame to the next, so
// frames must reach it in order: when a slow frame lets playback run past a sample, it rewinds to
// that sample and carries on at half the speed, and once at the slowest speed it pauses the video
// for every frame instead.
function trackByPlaying(detect, gap, from, job, report) {
  return new Promise((resolve) => {
    const frames = [];
    let last = from, cost = 0, done = false, busy = false, stepping = false, heard = performance.now();
    const finish = () => {
      if (done) return;
      done = true; clearInterval(watch); video.removeEventListener('ended', finish); video.pause();
      resolve(frames);
    };
    const setRate = (r) => { if (Math.abs(r - video.playbackRate) > 0.05 * video.playbackRate) { try { video.playbackRate = r; } catch (e) {} } };
    const take = (t) => {
      const a = performance.now();
      const f = detect(t);
      frames.push(f); last = f.t; report(f);
      const ms = performance.now() - a;
      cost = cost ? cost * 0.8 + ms * 0.2 : ms;
    };
    const resume = () => { if (!done) { video.requestVideoFrameCallback(step); video.play().catch(finish); } };
    const step = (now, meta) => {
      if (done || busy) return;
      heard = performance.now();
      if (job.aborted) { finish(); return; }
      const due = last + gap;
      if (meta.mediaTime > due + 0.75 * gap) {
        // fell behind: go back for the sample that was skipped
        busy = true; video.pause();
        if (video.playbackRate <= MIN_RATE * 1.05) { stepping = true; setRate(1); } else setRate(Math.max(MIN_RATE, video.playbackRate / 2));
        seekTo(due).then(() => { busy = false; heard = performance.now(); if (done) return; take(video.currentTime); resume(); });
        return;
      }
      if (meta.mediaTime >= due - 0.004) {
        if (stepping) video.pause();
        take(meta.mediaTime);
        if (stepping) { resume(); return; }
        // as fast as the model keeps up with, with some headroom
        setRate(Math.max(MIN_RATE, Math.min(1, 1000 * gap / (cost * 1.3))));
      }
      video.requestVideoFrameCallback(step);
    };
    const watch = setInterval(() => {
      const quiet = performance.now() - heard;
      if (quiet > 3000 && video.paused && !video.ended && !busy) video.play().catch(() => {});
      if (quiet > 8000) finish();
    }, 1000);
    video.addEventListener('ended', finish);
    video.playbackRate = 0.25;
    resume();
  });
}

function say(id, text, bad) { const el = $(id); el.textContent = text || ''; el.classList.toggle('bad', !!bad); }
function progress(frac, text) {
  $('progress').hidden = frac === null;
  if (frac !== null) { $('bar').style.width = `${Math.round(frac * 100)}%`; setText('progress-text', text); }
}

async function start(file) {
  if (state.busy) return;
  const T = I18N[state.lang];
  say('upload-msg', '');
  if (file.type && !file.type.startsWith('video/')) { say('upload-msg', T.notVideo, true); return; }
  state.busy = true; drop.classList.add('busy');
  const job = state.abort = { aborted: false };
  try {
    progress(0, T.loadingModel);
    let lm;
    try { lm = await warmModel(); } catch (e) { throw new Error(T.modelFail); }

    progress(0, T.reading);
    if (state.url) URL.revokeObjectURL(state.url);
    state.url = URL.createObjectURL(file);
    state.result = null; state.stills = {};
    $('step-result').hidden = false; $('step-coach').hidden = true;
    ['frames', 'findings', 'summary', 'detected'].forEach((id) => { $(id).innerHTML = ''; });
    $('tempo').hidden = true; $('notes').hidden = true; $('controls').hidden = true; $('jumps').hidden = true; $('legend').hidden = true;
    clearCoach();
    await openVideo(state.url, job, T);
    if (!video.videoWidth || !isFinite(video.duration)) throw new Error(T.badVideo);
    if (video.duration > MAX_SECONDS + 0.5) throw new Error(T.tooLong(Math.round(video.duration)));
    sizeOverlay();

    // Track the pose through the clip
    const W = video.videoWidth, H = video.videoHeight, dur = video.duration;
    const gap = Math.max(SAMPLE_GAP, dur / MAX_SAMPLES);
    const detect = makeDetector(lm, W, H);
    let shown = 0;
    const report = (f) => {
      drawLive(f.lm);
      if (++shown % 3 === 0) { const text = T.scanning(Math.min(100, Math.round(f.t / dur * 100))); progress(f.t / dur, text); setText('scan', text); }
    };
    $('scan').hidden = false;
    const frames = await track(detect, dur, gap, job, report, T);
    video.playbackRate = +$('speed').value;
    $('scan').hidden = true;
    state.frames = frames; state.W = W; state.H = H;

    const result = analyzeSwing(frames, { hand: state.hand, view: state.view });
    if (!result.ok) throw new Error(T.errors[result.error] || T.errors.no_swing);
    progress(1, T.capturing);
    state.result = result;
    state.crop = cropBox(result);
    await captureStills(result);
    await seekTo(result.times.address);
    progress(null);
    renderResult();
    $('controls').hidden = false; $('jumps').hidden = false; $('legend').hidden = false;
    $('step-coach').hidden = false;
    drawOverlay();
  } catch (e) {
    progress(null);
    $('scan').hidden = true;
    if (!state.result) { $('step-result').hidden = true; }
    say('upload-msg', e.message || String(e), true);
  } finally {
    state.busy = false; drop.classList.remove('busy'); state.abort = null;
  }
}

// Re-run the measurements (not the tracking) when the hand or the camera angle is changed
function reanalyze() {
  if (!state.frames || state.busy) return;
  const r = analyzeSwing(state.frames, { hand: state.hand, view: state.view });
  if (!r.ok) return;
  state.result = r;
  renderResult(); drawOverlay(); clearCoach();
}

// The region the key frames show: the body at the four positions, with room for the club
function cropBox(r) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const at = PHASES.map((p) => r.phases[p]).filter((i) => i !== null).map((i) => r.lm[i]);
  for (const pts of at) for (const k of [0, 11, 12, 15, 16, 23, 24, 27, 28]) {
    x0 = Math.min(x0, pts[k][0]); x1 = Math.max(x1, pts[k][0]); y0 = Math.min(y0, pts[k][1]); y1 = Math.max(y1, pts[k][1]);
  }
  const m = r.trunk;
  x0 -= 1.3 * m; x1 += 1.3 * m; y0 -= 0.9 * m; y1 += 0.35 * m;
  // a 3:4 portrait box around that, inside the frame
  let w = x1 - x0, h = y1 - y0;
  if (w / h > 3 / 4) h = w * 4 / 3; else w = h * 3 / 4;
  w = Math.min(w, state.W); h = Math.min(h, state.H);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const x = Math.max(0, Math.min(state.W - w, cx - w / 2)), y = Math.max(0, Math.min(state.H - h, cy - h / 2));
  return { x, y, w, h };
}

async function captureStills(r) {
  const c = state.crop, sc = Math.min(1, 900 / Math.max(c.w, c.h));
  for (const p of PHASES) {
    const i = r.phases[p];
    if (i === null) continue;
    await seekTo(state.frames[i].t);
    const cv = document.createElement('canvas');
    cv.width = Math.round(c.w * sc); cv.height = Math.round(c.h * sc);
    cv.getContext('2d').drawImage(video, c.x, c.y, c.w, c.h, 0, 0, cv.width, cv.height);
    state.stills[p] = cv;
  }
}

// ---------- drawing ----------
// Drawn over the video: a bright line with a dark edge reads on grass and on sky
const VIDEO_INK = '#F7E35A', VIDEO_REF = '#5FD4FF';
function drawBones(ctx, pts, map, lw) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [w, color] of [[lw + 3, 'rgba(0,0,0,0.55)'], [lw, VIDEO_INK]]) {
    ctx.strokeStyle = color; ctx.lineWidth = w;
    ctx.beginPath();
    for (const [a, b] of BONES) { const p = map(pts[a]), q = map(pts[b]); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); }
    ctx.stroke();
  }
  const hd = map(pts[0]);
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.arc(hd[0], hd[1], lw * 2.2 + 1.5, 0, 7); ctx.fill();
  ctx.fillStyle = VIDEO_INK; ctx.beginPath(); ctx.arc(hd[0], hd[1], lw * 2.2, 0, 7); ctx.fill();
}
// Address reference lines: face-on, where the head and hips were; down the line, the spine and the hips
function drawRefs(ctx, r, i, map, lw, height) {
  const shift = r.refs.camAt[i] || 0;
  const at = (p) => map([p[0] + shift, p[1]]);
  ctx.save();
  ctx.setLineDash([lw * 3, lw * 2.5]); ctx.lineCap = 'butt';
  const lines = [];
  if (r.view === 'face') {
    const h = at(r.refs.head), hp = at(r.refs.hip);
    lines.push([[h[0], 0], [h[0], height]], [[hp[0], 0], [hp[0], height]]);
  } else {
    const hp = at(r.refs.hip), sh = at(r.refs.shoulders), hd = at(r.refs.head);
    const dx = sh[0] - hp[0], dy = sh[1] - hp[1];
    lines.push([[hp[0] - dx * 0.3, hp[1] - dy * 0.3], [hp[0] + dx * 1.6, hp[1] + dy * 1.6]], [[hp[0], hp[1] - dy * 0.2], [hp[0], height]], [[hd[0] - 3 * Math.abs(dx), hd[1]], [hd[0] + 3 * Math.abs(dx), hd[1]]]);
  }
  for (const [w, color] of [[lw + 2, 'rgba(0,0,0,0.45)'], [lw, VIDEO_REF]]) {
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath();
    for (const [a, b] of lines) { ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }
    ctx.stroke();
  }
  ctx.restore();
}

function sizeOverlay() {
  const rect = video.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  overlay.style.width = rect.width + 'px'; overlay.style.height = rect.height + 'px';
  overlay.width = Math.round(rect.width * dpr); overlay.height = Math.round(rect.height * dpr);
}
new ResizeObserver(() => { sizeOverlay(); drawOverlay(); }).observe(video);

function videoMap() {
  const sx = overlay.width / (video.videoWidth || 1), sy = overlay.height / (video.videoHeight || 1);
  return (p) => [p[0] * sx, p[1] * sy];
}
function drawLive(pts) {
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  if (pts) drawBones(ctx, pts, videoMap(), Math.max(2, overlay.width / 260));
}
function nearestFrame(t) {
  const f = state.frames; if (!f || !f.length) return -1;
  let lo = 0, hi = f.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (f[m].t < t) lo = m + 1; else hi = m; }
  return lo > 0 && Math.abs(f[lo - 1].t - t) < Math.abs(f[lo].t - t) ? lo - 1 : lo;
}
function drawOverlay() {
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  const r = state.result;
  if (!r) return;
  const i = nearestFrame(video.currentTime), map = videoMap(), lw = Math.max(2, overlay.width / 260);
  drawRefs(ctx, r, i, map, Math.max(1.5, lw * 0.7), overlay.height);
  if (state.bones) drawBones(ctx, r.lm[i], map, lw);
}

function drawCard(cv, p) {
  const r = state.result, still = state.stills[p], c = state.crop, i = r.phases[p];
  cv.width = still.width; cv.height = still.height;
  const ctx = cv.getContext('2d');
  ctx.drawImage(still, 0, 0);
  const s = still.width / c.w, map = (q) => [(q[0] - c.x) * s, (q[1] - c.y) * s], lw = Math.max(2, still.width / 150);
  drawRefs(ctx, r, i, map, Math.max(1.5, lw * 0.75), still.height);
  drawBones(ctx, r.lm[i], map, lw);
}

// ---------- the player ----------
let raf = 0;

video.addEventListener('pause', () => { showPlay(); if (!state.busy) { drawOverlay(); showTime(); } });
video.addEventListener('seeked', () => { if (!state.busy) { drawOverlay(); showTime(); } });
$('seek').addEventListener('input', () => { seeking = true; video.pause(); video.currentTime = ($('seek').value / 1000) * (video.duration || 0); });
$('seek').addEventListener('change', () => { seeking = false; });
$('speed').addEventListener('change', () => { video.playbackRate = +$('speed').value; });
video.playbackRate = 0.5;
video.addEventListener('loadeddata', () => { video.playbackRate = +$('speed').value; });
$('bones').addEventListener('click', () => { state.bones = !state.bones; $('bones').setAttribute('aria-pressed', state.bones); drawOverlay(); });
function jump(p) {
  const r = state.result; if (!r || r.phases[p] === null) return;
  video.pause(); video.currentTime = state.frames[r.phases[p]].t;
  $('stage').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// ---------- results ----------
function renderResult() {
  const T = I18N[state.lang], r = state.result;
  $('detected').innerHTML = T.detected(T.viewName[r.view], T.handName[state.hand], state.view === 'auto');
  const notes = [];
  if (r.camera.lost) notes.push(T.camLost); else if (r.camera.moved) notes.push(T.camMoved);
  if (r.tempo.slowmo) notes.push(T.slowmo);
  if (r.phases.finish === null) notes.push(T.noFinish);
  if (r.handGuess !== state.hand) notes.push(T.handHint(r.handGuess));
  $('notes').hidden = !notes.length; $('notes').textContent = notes.join(' ');

  $('jumps').innerHTML = PHASES.filter((p) => r.phases[p] !== null)
    .map((p) => `<button type="button" class="ctl" data-jump="${p}">${esc(T.phase[p])} <span class="sr">${esc(T.sec(r.times[p]))}</span></button>`).join('');

  $('frames').innerHTML = PHASES.filter((p) => state.stills[p])
    .map((p) => `<li><figure><button type="button" data-jump="${p}" aria-label="${esc(T.phase[p])}"><canvas data-card="${p}"></canvas></button><figcaption><b>${esc(T.phase[p])}</b><span>${esc(T.sec(r.times[p]))}</span></figcaption></figure></li>`).join('');
  document.querySelectorAll('[data-card]').forEach((cv) => drawCard(cv, cv.getAttribute('data-card')));

  // tempo
  const tp = r.tempo, tm = r.metrics.find((m) => m.id === 'tempo');
  $('tempo').hidden = false;
  $('tempo-num').innerHTML = `${tp.ratio.toFixed(1)}<small>: 1</small>`;
  const bars = $('tbar').children, tot = tp.back + tp.down;
  bars[0].style.flex = String(tp.back / tot); bars[1].style.flex = String(tp.down / tot);
  setText('t-back', T.tBack(T.sec(tp.back))); setText('t-down', T.tDown(T.sec(tp.down)));
  const td = describe(tm, T);
  setText('tempo-text', td.body);
  $('tempo-tip').hidden = !td.tip;
  $('tempo-tip').innerHTML = td.tip ? `<b>${esc(T.tipLabel)}</b>${esc(td.tip)}` : '';

  // findings; tempo has its own panel above
  const list = r.metrics.filter((m) => m.id !== 'tempo');
  const count = (s) => r.metrics.filter((m) => m.status === s).length;
  setText('summary', T.summary(count('fix'), count('watch'), count('good')));
  $('findings').innerHTML = list.map((m) => {
    const d = describe(m, T);
    return `<li class="finding"><span class="badge ${m.status}">${esc(T.status[m.status])}</span><div>` +
      `<div class="f-title"><span>${esc(d.title)}</span>${d.value ? `<span class="f-val">${esc(d.value)}</span>` : ''}</div>` +
      `<p class="f-body">${esc(d.body)}</p>` +
      (d.tip ? `<p class="f-tip"><b>${esc(T.tipLabel)}</b>${esc(d.tip)}</p>` : '') +
      (r.phases[m.phase] !== null && m.phase ? `<button type="button" class="f-jump" data-jump="${m.phase}">${esc(T.see(T.phase[m.phase]))}</button>` : '') +
      `</div></li>`;
  }).join('');
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-jump]'); if (b) jump(b.getAttribute('data-jump')); });

// ---------- AI coach ----------
let keySaved = '';
try { keySaved = localStorage.getItem(KEY_KEY) || ''; } catch (e) {}
if (keySaved) { $('key-input').value = keySaved; $('key-keep').checked = true; }
$('key-box').hidden = !!COACH_ENDPOINT;

function renderCoachButton() {
  const T = I18N[state.lang];
  setText('coach-go', $('coach-out').innerHTML ? T.coachAgain : T.coachGo);
}
function clearCoach() { $('coach-out').innerHTML = ''; setText('coach-meta', ''); say('coach-msg', ''); renderCoachButton(); }

// A small Markdown subset: ### headings, - and 1. lists, **bold**, paragraphs. Text is escaped first.
function renderMarkdown(src) {
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  let html = '', list = null, para = [];
  const flushPara = () => { if (para.length) { html += `<p>${para.map(inline).join('<br>')}</p>`; para = []; } };
  const flushList = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of src.split('\n')) {
    const line = raw.trim();
    let m;
    if (!line) { flushPara(); flushList(); }
    else if ((m = line.match(/^#{1,6}\s+(.*)$/))) { flushPara(); flushList(); html += `<h4>${inline(m[1])}</h4>`; }
    else if ((m = line.match(/^[-*•]\s+(.*)$/)) || (m = line.match(/^\d+[.)]\s+(.*)$/))) {
      flushPara();
      const kind = /^\d/.test(line) ? 'ol' : 'ul';
      if (list !== kind) { flushList(); html += `<${kind}>`; list = kind; }
      html += `<li>${inline(m[1])}</li>`;
    } else { flushList(); para.push(line); }
  }
  flushPara(); flushList();
  return html;
}

// What goes to the coach: the four stills at most 1024 px long, and the measurements in English
function coachInput(coach) {
  const r = state.result;
  const frames = [];
  for (const p of PHASES) {
    const still = state.stills[p]; if (!still) continue;
    const sc = Math.min(1, 1024 / Math.max(still.width, still.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(still.width * sc); cv.height = Math.round(still.height * sc);
    cv.getContext('2d').drawImage(still, 0, 0, cv.width, cv.height);
    frames.push({ phase: p, jpeg: cv.toDataURL('image/jpeg', 0.85).split(',')[1] });
  }
  const tp = r.tempo;
  return {
    lang: state.lang, view: r.view, hand: state.hand,
    tempo: `backswing ${tp.back.toFixed(2)} s, downswing ${tp.down.toFixed(2)} s, ratio ${tp.ratio.toFixed(1)} : 1${tp.slowmo ? ' (the video looks like slow motion, so only the ratio is meaningful)' : ''}.`,
    notes: $('notes-input').value.slice(0, 600),
    findings: r.metrics.map((m) => ({ status: m.status, text: coach.findingText(m) })),
    frames,
  };
}

$('coach-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (state.coachBusy || !state.result) return;
  const T = I18N[state.lang];
  const key = $('key-input').value.trim();
  if (!COACH_ENDPOINT && !key.startsWith('sk-')) { say('coach-msg', T.needKey, true); $('key-input').focus(); return; }
  try { if ($('key-keep').checked && key) localStorage.setItem(KEY_KEY, key); else localStorage.removeItem(KEY_KEY); } catch (err) {}

  state.coachBusy = true; $('coach-go').disabled = true;
  say('coach-msg', ''); setText('coach-meta', '');
  const out = $('coach-out');
  out.innerHTML = `<span class="thinking">${esc(T.coachLoading)}</span>`;
  let text = '', pending = false;
  const paint = () => { pending = false; out.innerHTML = renderMarkdown(text); };
  try {
    const coach = await import('./coach.js');
    const input = coachInput(coach);
    const problem = coach.checkCoachInput(input);
    if (problem) throw new Error(problem);
    out.innerHTML = `<span class="thinking">${esc(T.coachThinking)}</span>`;

    let stream;
    if (COACH_ENDPOINT) {
      const { BetaMessageStream } = await import(`${SDK}/lib/BetaMessageStream.mjs/+esm`);
      const res = await fetch(COACH_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(input) });
      if (!res.ok) { const err = new Error((await res.json().catch(() => ({}))).error || res.statusText); err.status = res.status; throw err; }
      stream = BetaMessageStream.fromReadableStream(res.body);
    } else {
      const { default: Anthropic } = await import(`${SDK}/+esm`);
      // The key is the visitor's own, typed into their own browser and sent only to Anthropic
      const client = new Anthropic({ apiKey: key, dangerouslyAllowBrowser: true });
      stream = client.beta.messages.stream(coach.buildCoachRequest(input));
    }
    stream.on('text', (d) => { text += d; if (!pending) { pending = true; requestAnimationFrame(paint); } });
    const msg = await stream.finalMessage();
    paint();
    if (msg.stop_reason === 'refusal') { if (!text) out.innerHTML = ''; say('coach-msg', T.refusal, true); }
    else if (msg.stop_reason === 'max_tokens') out.insertAdjacentHTML('beforeend', `<p>${esc(T.truncated)}</p>`);
    const u = msg.usage || {};
    if (u.input_tokens != null) {
      const cost = ((u.input_tokens + (u.cache_read_input_tokens || 0)) * PRICE.input + u.output_tokens * PRICE.output) / 1e6;
      setText('coach-meta', T.usage(u.input_tokens, u.output_tokens, cost.toFixed(3)));
    }
  } catch (err) {
    if (!text) out.innerHTML = '';
    const st = err && err.status, E = T.coachErr;
    const m = st === 401 ? E[401] : st === 403 ? E[403] : st === 429 ? E[429] : st === 529 || st === 503 ? E[529]
      : (err && /fetch|network|connection/i.test(String(err.message || err))) && !st ? E.net : E.other((err && err.message) || String(err));
    say('coach-msg', m, true);
  } finally {
    state.coachBusy = false; $('coach-go').disabled = false; renderCoachButton();
  }
});

// ---------- boot ----------
renderStatic();
</script>
