<style>
/* Layout: one 760px column, a header with the resort and the controls, four tabs. Snow-light greys and a
   glacier blue; the verdict and the chain control carry the status colours (green go, amber careful,
   red stay home), always with an icon and words. The charts' four colours follow the quantity
   everywhere: snow blue, temperature orange, rain aqua, wind violet. */
:root {
  --bg: #EDF1F5;
  --surface: #FFFFFF;
  --surface-2: #F4F7FA;
  --ink: #0E1822;
  --ink-2: #445260;
  --muted: #66727F;
  --rule: #D9E0E7;
  --rule-strong: #B4C0CC;
  --accent: #1C64A8;
  --accent-wash: rgba(28, 100, 168, 0.10);
  --on-accent: #FFFFFF;
  /* status: never a series colour, always with an icon and a word */
  --good: #0CA30C; --good-ink: #0B6B1F; --good-wash: rgba(12, 163, 12, 0.10);
  --warn: #FAB219; --warn-ink: #8A5600; --warn-wash: rgba(250, 178, 25, 0.16);
  --crit: #D03B3B; --crit-ink: #A12424; --crit-wash: rgba(208, 59, 59, 0.10);
  --serious: #EC835A;
  /* chart series */
  --snow: #2A78D6; --temp: #EB6834; --rain: #1BAF7A; --wind: #6250D6;
  --grid: #E6EBF0; --axis: #C3CCD5;
  --font-cjk: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", serif;
  --font-latin: "STIX Two Text", "STIXGeneral", Cambria, "Times New Roman", serif;
  --font: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1017; --surface: #141D27; --surface-2: #1B2632; --ink: #E7EDF3; --ink-2: #A9B6C3; --muted: #8794A1;
    --rule: #253240; --rule-strong: #3A4A5B; --accent: #6DB0EE; --accent-wash: rgba(109, 176, 238, 0.14); --on-accent: #0A1017;
    --good-ink: #5FD07A; --good-wash: rgba(12, 163, 12, 0.16); --warn-ink: #F5C45A; --warn-wash: rgba(250, 178, 25, 0.14);
    --crit-ink: #F08A8A; --crit-wash: rgba(208, 59, 59, 0.18);
    --snow: #3987E5; --temp: #D95926; --rain: #199E70; --wind: #9085E9; --grid: #1E2935; --axis: #34424F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1017; --surface: #141D27; --surface-2: #1B2632; --ink: #E7EDF3; --ink-2: #A9B6C3; --muted: #8794A1;
  --rule: #253240; --rule-strong: #3A4A5B; --accent: #6DB0EE; --accent-wash: rgba(109, 176, 238, 0.14); --on-accent: #0A1017;
  --good-ink: #5FD07A; --good-wash: rgba(12, 163, 12, 0.16); --warn-ink: #F5C45A; --warn-wash: rgba(250, 178, 25, 0.14);
  --crit-ink: #F08A8A; --crit-wash: rgba(208, 59, 59, 0.18);
  --snow: #3987E5; --temp: #D95926; --rain: #199E70; --wind: #9085E9; --grid: #1E2935; --axis: #34424F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.page {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(14px, env(safe-area-inset-top, 0px));
  padding-bottom: max(48px, env(safe-area-inset-bottom, 0px));
}
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 0.18em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* header */
.home { display: inline-block; margin-bottom: 6px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
.home:hover { color: var(--ink); }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand .zh { font-family: var(--font-cjk); font-weight: 900; font-size: 34px; line-height: 1.1; letter-spacing: 0.06em; }
.brand .en { font-family: var(--font-latin); font-style: italic; font-weight: 500; font-size: 22px; color: var(--ink-2); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 999px; overflow: hidden; background: var(--surface); flex: none; }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.icon-btn { border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.icon-btn:hover { color: var(--ink); border-color: var(--ink-2); }
.icon-btn svg { width: 15px; height: 15px; }
.icon-btn.busy svg { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .icon-btn.busy svg { animation: none; } }
.lede { margin-top: 8px; color: var(--ink-2); font-size: 15px; max-width: 38em; }
.pick { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.select { position: relative; flex: 1 1 260px; min-width: 0; }
.select select {
  width: 100%; appearance: none; -webkit-appearance: none; border: 1px solid var(--rule-strong); border-radius: 12px;
  background: var(--surface); padding: 10px 38px 10px 14px; font-size: 16px; font-weight: 650; cursor: pointer;
}
.select::after { content: ""; position: absolute; right: 16px; top: 50%; width: 8px; height: 8px; margin-top: -6px; border-right: 2px solid var(--ink-2); border-bottom: 2px solid var(--ink-2); transform: rotate(45deg); pointer-events: none; }
.pick .seg button { padding: 9px 14px; font-size: 14px; }
.status { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 1.5em; }
.status b { font-weight: 600; color: var(--ink-2); }

/* tabs */
.tabs { position: sticky; top: 0; z-index: 20; display: flex; margin: 14px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0; padding: 0 max(16px, env(safe-area-inset-left, 0px)); background: var(--bg); border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 1 0 auto; border: 0; background: none; padding: 12px 10px 10px; font-size: 16px; font-weight: 650; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.panel { display: grid; gap: 14px; padding-top: 16px; }

/* cards and sections */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 16px; min-width: 0; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-top: 10px; }
.sec-h h2 { font-size: 19px; font-weight: 750; letter-spacing: 0.01em; }
.sec-h .aside { font-size: 12.5px; color: var(--muted); }
.card h3 { font-size: 15.5px; font-weight: 700; }
.note { font-size: 13.5px; color: var(--ink-2); line-height: 1.6; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.err { font-size: 14px; color: var(--ink-2); padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px dashed var(--rule-strong); }
.err b { color: var(--ink); }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 650; text-decoration: none; cursor: pointer; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.fold { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.fold::after { content: ""; flex: none; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: -4px 4px 0 0; transition: transform 0.15s; }
details[open] > .fold::after { transform: rotate(-135deg); margin-top: 4px; }

/* verdict */
.verdict { position: relative; overflow: hidden; border-left: 6px solid var(--v, var(--rule-strong)); background: linear-gradient(var(--v-wash, transparent), var(--v-wash, transparent)), var(--surface); }
.verdict.go { --v: var(--good); --v-ink: var(--good-ink); --v-wash: var(--good-wash); }
.verdict.caution { --v: var(--warn); --v-ink: var(--warn-ink); --v-wash: var(--warn-wash); }
.verdict.stop { --v: var(--crit); --v-ink: var(--crit-ink); --v-wash: var(--crit-wash); }
.verdict .ridge { position: absolute; right: -8px; bottom: -6px; width: 230px; height: 90px; color: var(--v, var(--rule-strong)); opacity: 0.16; pointer-events: none; }
.v-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.v-route { font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.v-head { display: flex; align-items: flex-start; gap: 12px; margin-top: 10px; }
.v-icon { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--v, var(--rule-strong)); color: #fff; display: grid; place-items: center; margin-top: 3px; }
.verdict.caution .v-icon { color: #0B0B0B; }
.v-icon svg { width: 20px; height: 20px; }
.v-title { font-size: clamp(25px, 6.4vw, 33px); line-height: 1.22; font-weight: 800; letter-spacing: 0.01em; }
.v-reasons { margin-top: 12px; display: grid; gap: 6px; position: relative; }
.v-reasons li { position: relative; padding-left: 16px; font-size: 15px; line-height: 1.5; }
.v-reasons li::before { content: ""; position: absolute; left: 2px; top: 0.62em; width: 6px; height: 6px; border-radius: 50%; background: var(--v-ink, var(--ink-2)); }
.v-reasons li.ok::before { background: var(--good); }
.v-basis { margin-top: 12px; font-size: 12.5px; color: var(--ink-2); line-height: 1.6; position: relative; }
.v-basis b { font-weight: 650; }

/* alerts */
.alert { border-radius: 14px; padding: 13px 15px; border: 1.5px solid var(--warn); background: var(--surface); }
.alert.severe { border-color: var(--crit); }
.alert h3 { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--warn-ink); }
.alert.severe h3 { color: var(--crit-ink); }
.alert h3 svg { width: 18px; height: 18px; flex: none; }
.alert p { font-size: 14px; margin-top: 4px; }
.alert .small { margin-top: 4px; color: var(--muted); }

/* now */
.now { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 620px) { .now { grid-template-columns: minmax(0, 1fr); } }
.now .card { padding: 14px 16px; }
.now h3 { font-size: 15px; }
.now .sub { font-size: 12.5px; color: var(--muted); }
.now .big { font-size: 46px; line-height: 1.05; font-weight: 700; margin: 8px 0 4px; letter-spacing: -0.01em; }
.now .big small { font-size: 0.5em; font-weight: 600; margin-left: 2px; color: var(--ink-2); }
.now .line { font-size: 14px; color: var(--ink-2); }
@media (max-width: 620px) {
  .now .card { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; align-items: center; }
  .now .card .big { grid-row: 1 / span 4; grid-column: 2; margin: 0; font-size: 40px; }
}

/* charts */
.chart-wrap { display: grid; gap: 10px; }
.readout { font-size: 13.5px; color: var(--ink-2); min-height: 2.6em; display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; padding: 8px 10px; background: var(--surface-2); border-radius: 10px; }
.readout b { color: var(--ink); font-weight: 700; }
.readout .k { display: inline-flex; align-items: center; gap: 5px; }
.key { display: inline-block; width: 14px; height: 0; border-top: 2px solid currentColor; }
.key.dash { border-top-style: dashed; }
.key.bar { width: 9px; height: 9px; border: 0; border-radius: 2px; background: currentColor; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart { position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .t { font-size: 11px; fill: var(--muted); font-family: var(--font); }
.chart .lbl { font-size: 11.5px; fill: var(--ink-2); font-family: var(--font); font-weight: 600; }
.chart-title { font-size: 12.5px; font-weight: 650; color: var(--ink-2); margin-bottom: 2px; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }
table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.data th { font-size: 12px; font-weight: 600; color: var(--muted); text-align: right; padding: 6px 6px; white-space: nowrap; border-bottom: 1px solid var(--rule); vertical-align: bottom; line-height: 1.25; }
table.data th small { display: block; font-size: 11px; font-weight: 500; }
table.data td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
@media (max-width: 460px) {
  table.data { font-size: 13px; }
  table.data th, table.data td { padding-left: 3px; padding-right: 3px; }
}
.panel > * { scroll-margin-top: 60px; }
table.data th:first-child, table.data td:first-child { text-align: left; padding-left: 2px; }
table.data tr.on td { background: var(--accent-wash); }
table.data tr.hit { cursor: pointer; }
table.data tr.hit:hover td { background: var(--surface-2); }
table.data tr.sel td { background: var(--accent-wash); }
table.data tr.sel td:first-child { box-shadow: inset 3px 0 var(--accent); }
td .s { color: var(--snow); font-weight: 700; }
td .z { color: var(--muted); }
td .w { color: var(--ink-2); font-size: 12.5px; }
.hourly-table { max-height: 360px; overflow-y: auto; }
.hourly-table th { position: sticky; top: 0; background: var(--surface); z-index: 1; }

/* outfit */
.tier { font-size: 18px; font-weight: 750; }
.wear { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin-top: 10px; }
.wear h3 { font-size: 14px; color: var(--accent); margin-bottom: 6px; }
.wear li { position: relative; padding-left: 14px; font-size: 14.5px; line-height: 1.55; margin-top: 3px; }
.wear li::before { content: "·"; position: absolute; left: 2px; color: var(--muted); font-weight: 700; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; user-select: none; }
.switch input { appearance: none; -webkit-appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--rule-strong); position: relative; cursor: pointer; margin: 0; flex: none; transition: background 0.15s; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,0.25); }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(14px); }

/* resort cams */
.live { display: flex; align-items: center; gap: 14px; padding: 15px 16px; border-radius: 14px; background: var(--accent); color: var(--on-accent); text-decoration: none; }
.live .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex: none; box-shadow: 0 0 0 4px rgba(255,255,255,0.25); }
.live b { display: block; font-size: 17px; }
.live span { font-size: 13.5px; opacity: 0.9; }
.live .arr, .tile .arr { margin-left: auto; font-size: 20px; flex: none; }
.tile { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; }
.tile b { display: block; font-size: 16px; }
.tile span { font-size: 13.5px; color: var(--ink-2); }
.tile .arr { color: var(--accent); }

/* roads */
.chain-hero { border-left: 6px solid var(--c, var(--rule-strong)); background: linear-gradient(var(--c-wash, transparent), var(--c-wash, transparent)), var(--surface); }
.chain-hero.c0 { --c: var(--good); --c-wash: var(--good-wash); --c-ink: var(--good-ink); }
.chain-hero.c1 { --c: var(--warn); --c-wash: var(--warn-wash); --c-ink: var(--warn-ink); }
.chain-hero.c2 { --c: var(--crit); --c-wash: var(--crit-wash); --c-ink: var(--crit-ink); }
.chain-hero .lab { font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-2); }
.chain-hero .lvl { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; }
.chain-hero .lvl b { font-size: 40px; line-height: 1.1; font-weight: 800; color: var(--c-ink, var(--ink)); }
.chain-hero .lvl span { font-size: 22px; font-weight: 750; }
.chain-hero p { margin-top: 6px; font-size: 14.5px; color: var(--ink-2); }
.cp { display: grid; gap: 0; margin-top: 8px; }
.cp li { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--rule); font-size: 14px; }

const closedText = (t) => /^(is closed|closed)\b|^(eastbound|westbound|northbound|southbound|both directions)[^.]{0,40}\bis closed\b/i.test(t) && !/\b\d{4} hrs\b/i.test(t);

// ---------- the verdict ----------
function verdictDay() { return state.verdictDay != null ? state.verdictDay : parts(Date.now()).h >= 14 ? 1 : 0; }
function verdict() {
  const day = verdictDay(), rd = roads(), reasons = [], checked = [];
  let level = 0;   // 0 go, 1 careful, 2 stay home
  const raise = (n, text, main) => { reasons.push({ n, text, main }); level = Math.max(level, n); };
  // chain controls
  if (rd.chains.length || !rd.missing.includes('chains')) checked.push(L('Caltrans 链条管制等级', 'Caltrans chain control'));
  // What a car needs is the highest R level on the way; a hold, an escort or metering is said beside it,
  // since a storm brings them together (R-2 eastbound while westbound is held for spinouts)
  const { worst, rx, held } = chainSummary(rd.chains);
  const wr = worst ? chainRank(worst.status) : 0;
  if (wr >= 6) raise(2, L(`Caltrans 在 ${worst.name} 封路`, `Caltrans has closed the road at ${worst.name}`), 'closed');
  if (rx && rx.status === 'R-3') raise(2, L(`R-3 链条管制（${rx.name}）：所有车都要装链条`, `R-3 at ${rx.name}: chains on every vehicle`), 'r3');
  else if (rx) raise(1, `${rx.status} · ${P(chainInfo(rx.status)[0])} · ${rx.name} ${dirWord(rx.dir)}`, rx.status === 'R-1' ? 'r1' : 'chains');
  if (held) {
    const how = { HT: L(`${held.name} ${dirWord(held.dir)}暂停放行（多是有车打滑出事），要等`, `Traffic held at ${held.name}, ${dirWord(held.dir)} (often for spinouts): expect a wait`),
      ESC: L(`${held.name} ${dirWord(held.dir)}由 CHP 护送通行，会慢`, `CHP is escorting traffic at ${held.name}, ${dirWord(held.dir)}: slow going`),
      VM: L(`${held.name} 检查点在分批放车，路上会慢`, `Traffic is being metered at ${held.name}`) }[held.status.toUpperCase()];
    raise(1, how, held.status.toUpperCase() === 'HT' ? 'held' : 'slow');
  }
  if (!rx && !held && worst && wr === 0.5) reasons.push({ n: 0, text: L(`货车在 ${worst.name} 查链条，小车不受影响`, `Trucks are being screened for chains at ${worst.name}; cars aren't`) });
  // closures: Caltrans' own words, CHP, and work zones that close the highway

  for (const t of Object.values(rd.text)) for (const s of t.items) if (closedText(s.text)) raise(2, L(`Caltrans：${t.route} 封路 — ${s.text}`, `Caltrans: ${t.route} — ${s.text}`), 'closed');

  for (const c of rd.closures) {

  const alerts = D('alerts') || [];

    const snow = Math.max(dBase.snow, dayOf(1, day) ? dayOf(1, day).snow : 0);

    else if (snow >= 3) reasons.push({ n: 0, text: L(`${DAY_WORD[day][0]}预计新雪约 ${U.snow(snow)} ${U.su()}`, `About ${U.snow(snow)} ${U.su()} of new snow ${DAY_WORD[day][1].toLowerCase()}`), ok: true });

      `CHP is at a crash on the way: ${chpWord(x.type)}, ${x.where}${x.area ? ' (' + x.area + ')' : ''}${inc.length > 1 ? `, and ${inc.length - 1} more` : ''}`), 'crash');
  }

  const order = ['closed', 'r3', 'chains', 'r1', 'storm', 'snow', 'held', 'work', 'crash', 'wind', 'slow'];

  const head = level === 2
    ? (main === 'r3' ? L('今天别去：链条管制 R-3', 'Stay home: R-3 chain control') : L('今天别去：路封了', 'Stay home: the road is closed'))
    : level === 1
      ? ({ chains: L('能去，要四驱加雪胎，或者装链条', 'Go, with 4WD and snow tires, or chains'), r1: L('能去，要雪胎或者带好链条', 'Go, with snow tires or chains'),
        storm: L('能去，但要早走慢开', 'Go, but leave early and drive slowly'),
        snow: L('能去，但要早走慢开', 'Go, but leave early and drive slowly'), wind: L('能去，但山上风大，缆车可能停', 'Go, but wind may hold the upper lifts'),
        crash: L('能去，路上有事故，留意绕行', 'Go, but there is a crash on the way'), work: L('能去，路上有施工封路', 'Go, but a work zone closes the road'),

        slow: L('能去，但路上会慢', 'Go, but expect delays') }[main] || L('能去，但要小心', 'Go, carefully'))

}

function renderChains() {
  const box = $('chain'), rd = roads();

    box.className = 'card chain-hero' + (got ? ' c0' : '');
    if (got) {
      // a drive through town, where Caltrans has no checkpoint
      fill(box, h('div', { class: 'lab', text: L('链条管制 · 走廊最高等级', 'Chain control: the highest on the way') }),
        h('div', { class: 'lvl' }, h('b', { text: 'R-0' }), h('span', { text: P(CHAIN['R-0'][0]) })),
        h('p', { text: L('这段路上没有 Caltrans 的链条检查点。下大雪时城里和雪场的路也可能要求链条，看雪场的通知。', 'There is no Caltrans checkpoint on this stretch. In a big storm the town and the resort can still ask for chains; check the resort’s notices.') }));

    return;

  const worst = chainRank(sum.worst.status) >= 6 ? sum.worst : sum.rx || sum.held || sum.worst;
  const rank = chainRank(worst.status), info = chainInfo(worst.status) || CHAIN['R-0'];

  box.className = 'card chain-hero ' + (rank >= 5 ? 'c2' : rank >= 2 ? 'c1' : 'c0');

    h('div', { class: 'lvl' }, h('b', { text: shown }), h('span', { text: P((rank >= 1 ? info : CHAIN['R-0'])[0]) })),
    h('p', { text: rank >= 1 ? `${P(info[1])} ${L(`最高的是 ${worst.name}（${worst.route}，${dirWord(worst.dir)}）。`, `Highest at ${worst.name} (${worst.route}, ${dirWord(worst.dir)}).`)}` : P(CHAIN['R-0'][1]) }),
    also ? h('p', { text: L(`另外：${also.name}（${dirWord(also.dir)}）${P(chainInfo(also.status)[0])}。${P(chainInfo(also.status)[1])}`, `Also: ${P(chainInfo(also.status)[0])} at ${also.name} (${dirWord(also.dir)}). ${P(chainInfo(also.status)[1])}`) }) : null,
    trucks.length ? h('p', { class: 'small', text: L(`货车在 ${[...new Set(trucks.map((c) => c.name))].join('、')} 查链条，小车不受影响。`, `Trucks are being screened at ${[...new Set(trucks.map((c) => c.name))].join(', ')}; cars aren’t.`) }) : null,

let mapObj = null, mapLayer = null, leafletP = null;
function loadLeaflet() {
  if (window.L && window.L.map) return Promise.resolve(window.L);
  if (leafletP) return leafletP;
  leafletP = new Promise((resolve, reject) => {
    const css = h('link', { rel: 'stylesheet', href: LEAFLET.css, integrity: LEAFLET.cssSri, crossorigin: '' });
    document.head.append(css);
    const s = h('script', { src: LEAFLET.js, integrity: LEAFLET.jsSri, crossorigin: '' });
    s.onload = () => resolve(window.L); s.onerror = () => { leafletP = null; reject(new Error('leaflet')); };
    document.head.append(s);
  });
  return leafletP;
}

  for (const c of rd.cams) {
    const m = Lf.marker([c.lat, c.lon], { icon: icon('cam', c.n), title: c.name, keyboard: true }).addTo(mapLayer);
    const pop = h('div', null, h('b', { text: `${c.n} · ${c.route} · ${camName(c)}` }));
    const img = safeUrl(c.img, ['dot.ca.gov']);
    if (img) { const im = h('img', { src: img + '?t=' + Math.floor(Date.now() / CAM_MS), alt: camName(c) }); im.addEventListener('click', () => openCam(c)); pop.append(im); }
    m.bindPopup(pop);
  }
  for (const c of rd.chains.filter((x) => chainRank(x.status) >= 1)) Lf.marker([c.lat, c.lon], { icon: icon('cc', c.status.replace(/\s.*/, '')), zIndexOffset: 400 }).addTo(mapLayer).bindPopup(h('div', null, h('b', { text: `${c.status} · ${c.name}` }), `${c.route} · ${dirWord(c.dir)}`));
  for (const x of rd.incidents) Lf.marker([x.lat, x.lon], { icon: icon(x.kind === 'closure' ? 'clo' : 'inc', x.kind === 'closure' ? '×' : '!'), zIndexOffset: 600 }).addTo(mapLayer).bindPopup(h('div', null, h('b', { text: chpWord(x.type) }), `${x.where} · ${whenShort(x.at)}`));
  const now = Date.now();
  for (const c of rd.closures.filter((x) => x.on || (x.start <= now && (!x.end || x.end > now)))) Lf.marker([c.lat, c.lon], { icon: icon('clo', '×'), zIndexOffset: 500 }).addTo(mapLayer).bindPopup(h('div', null, h('b', { text: `${c.route} · ${P(CLOSE_TYPE[c.type] || [c.type, c.type])}` }), `${c.from} → ${c.to} · ${whenShort(c.start)}`));
  const key = state.resort + state.from;
  if (mapObj._fitKey !== key) {
    mapObj.invalidateSize();
    mapObj.fitBounds(Lf.latLngBounds(state.legs.flatMap((l) => l.path)), { padding: [24, 24] });
    mapObj._fitKey = key;
  } else mapObj.invalidateSize();
}

const camName = (c) => c.name.replace(/_/g, ' ').replace(/\b(ED|PLA|NEV|SAC|ALP|AMA)\s?(50|80|89|88|267|28)\b/g, '').replace(/^\d+\s*-\s*/, '').replace(/\s+/g, ' ').trim();
let camTimer = null, camObserver = null;
function renderRoadCams() {
  const box = $('roadcams'), rd = roads();
  if (!rd.cams.length) { fill(box, h('p', { class: 'err', text: rd.missing.includes('cams') ? L('摄像头暂时拿不到（Caltrans）。', 'The cameras are unavailable right now (Caltrans).') : L('正在取摄像头…', 'Fetching the cameras…') })); return; }
  const t = Math.floor(Date.now() / CAM_MS);
  if (camObserver) camObserver.disconnect();
  camObserver = 'IntersectionObserver' in window ? new IntersectionObserver((es) => { for (const e of es) e.target.dataset.seen = e.isIntersecting ? '1' : ''; }, { rootMargin: '100px' }) : null;
  const groups = state.legs.map((l) => ({ l, cams: rd.cams.filter((c) => c.leg === l.i) })).filter((g) => g.cams.length);
  const first = groups.length > 1 && state.from === 'far' ? groups[0].l.i : -1;
  fill(box, groups.map((g) => h('details', { class: 'card cam-group', open: g.l.i !== first },
    h('summary', { class: 'fold' }, h('div', null, h('b', { text: P(g.l.name) }), h('span', { text: L(`${g.cams.length} 个摄像头`, `${g.cams.length} cameras`) }))),
    h('div', { class: 'cams' }, g.cams.map((c) => {
      const src = safeUrl(c.img, ['dot.ca.gov']);
      const img = h('img', { src: src ? src + '?t=' + t : '', alt: `${c.route} ${camName(c)}`, loading: 'lazy', decoding: 'async', 'data-src': src || '' });
      if (camObserver) camObserver.observe(img);
      // Caltrans sometimes answers a picture with an error page; say so instead of a broken image
      const frame = h('div', { class: 'img', 'data-broken': L('这个摄像头暂时没有画面', 'No picture from this camera right now') }, img, h('span', { class: 'pin cam n', text: c.n }));
      img.addEventListener('error', () => frame.classList.add('broken'));
      img.addEventListener('load', () => frame.classList.remove('broken'));
      return h('button', { class: 'cam', type: 'button', onclick: () => openCam(c) },
        frame,
        h('div', { class: 'cap' }, h('b', { text: c.route }), ' · ', camName(c), c.video ? h('span', { class: 'vid', text: L('可看视频', 'video') }) : null));
    })))));
  clearInterval(camTimer);
  camTimer = setInterval(() => refreshCams(false), CAM_MS);
}
function refreshCams(all) {
  if (document.hidden || state.tab !== 'roads') return;
  const t = Math.floor(Date.now() / CAM_MS) + (all ? '-' + Date.now() % 1000 : '');
  for (const img of document.querySelectorAll('#roadcams img[data-src]')) {
    if (!img.dataset.src) continue;
    if (!all && camObserver && img.dataset.seen !== '1') continue;
    if (img.closest('details') && !img.closest('details').open) continue;
    img.src = img.dataset.src + '?t=' + t;
  }
}

// The camera viewer: the picture large, Caltrans' twelve earlier frames (about 15 minutes apart, so the
// last three hours), and the live video where there is one
let hlsP = null, hlsObj = null, playTimer = null;
function loadHls() {
  if (window.Hls) return Promise.resolve(window.Hls);
  return hlsP || (hlsP = new Promise((res, rej) => { const s = h('script', { src: HLS.js, integrity: HLS.sri, crossorigin: '' }); s.onload = () => res(window.Hls); s.onerror = () => { hlsP = null; rej(new Error('hls')); }; document.head.append(s); }));
}
function stopVideo() { clearInterval(playTimer); if (hlsObj) { hlsObj.destroy(); hlsObj = null; } }
function openCam(c) {
  const dlg = $('viewer'), src = safeUrl(c.img, ['dot.ca.gov']); if (!src) return;
  stopVideo();
  const m = /^(.*\/image\/)([^/]+)\/\2\.jpg$/.exec(src);
  const frames = [src + '?t=' + Date.now()];
  if (m) for (let k = 1; k <= 12; k++) frames.push(`${m[1]}${m[2]}/previous/${m[2]}-${k}.jpg?t=${Math.floor(Date.now() / CAM_MS)}`);
  $('viewer-title').textContent = `${c.n ? c.n + ' · ' : ''}${c.route} · ${camName(c)}`;
  $('viewer-sub').textContent = `${c.place}${c.elev ? ` · ${U.elev(c.elev / 3.28084)} ${U.eu()}` : ''} · Caltrans`;
  const img = h('img', { src: frames[0], alt: `${c.route} ${camName(c)}` });
  const note = h('p', { class: 'err', style: 'margin:16px', hidden: true, text: L('这一帧暂时没有（Caltrans 那边出错），换一帧或往前看看。', 'This frame isn’t available (an error at Caltrans); try another one.') });
  img.addEventListener('error', () => { img.hidden = true; note.hidden = false; });
  img.addEventListener('load', () => { img.hidden = false; note.hidden = true; });
  fill($('viewer-frame'), img, note);
  const label = h('span', { class: 'num', style: 'min-width:6.5em;text-align:right', text: L('现在', 'now') });
  const range = h('input', { type: 'range', min: '0', max: String(frames.length - 1), value: '0', step: '1', 'aria-label': L('往前看几帧', 'Earlier frames') });
  const show = (k) => { img.src = frames[k]; label.textContent = k ? L(`约 ${k * 15} 分钟前`, `about ${k * 15} min ago`) : L('现在', 'now'); };
  range.addEventListener('input', () => show(frames.length - 1 - +range.value));
  range.value = String(frames.length - 1);
  const play = h('button', { type: 'button', class: 'btn', text: L('播放过去 3 小时', 'Play the last 3 hours') });
  play.addEventListener('click', () => {
    for (const u of frames) { const pre = new Image(); pre.src = u; }
    clearInterval(playTimer); let k = frames.length - 1; show(k); range.value = '0';
    playTimer = setInterval(() => { k--; if (k < 0) { clearInterval(playTimer); return; } show(k); range.value = String(frames.length - 1 - k); }, 450);
  });
  const vurl = safeUrl(c.video, ['dot.ca.gov']);
  const vbtn = vurl ? h('button', { type: 'button', class: 'btn primary', text: L('看直播视频', 'Live video') }) : null;
  if (vbtn) vbtn.addEventListener('click', async () => {
    stopVideo();
    const v = h('video', { controls: true, playsinline: true, muted: true, autoplay: true });
    fill($('viewer-frame'), v);
    const fail = () => fill($('viewer-frame'), h('p', { class: 'err', style: 'margin:16px', text: L('直播暂时打不开（Caltrans 的视频时有时无），看静态图吧。', 'The live video won’t play right now (Caltrans’ streams come and go); the pictures still work.') }));
    v.addEventListener('error', fail);
    if (v.canPlayType('application/vnd.apple.mpegurl')) { v.src = vurl; v.play().catch(() => {}); return; }
    try {
      const Hls = await loadHls();
      if (!Hls.isSupported()) return fail();
      hlsObj = new Hls({ enableWorker: true }); hlsObj.loadSource(vurl); hlsObj.attachMedia(v);
      hlsObj.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) { stopVideo(); fail(); } });
      v.play().catch(() => {});
    } catch (e) { fail(); }
  });
  fill($('viewer-foot'),
    m ? h('div', { class: 'scrub' }, h('span', { text: L('3 小时前', '3 h ago') }), range, label) : null,
    h('div', { class: 'links' }, m ? play : null, vbtn));
  if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
}
$('viewer-x').addEventListener('click', () => $('viewer').close());
$('viewer').addEventListener('close', stopVideo);
$('viewer').addEventListener('click', (ev) => { if (ev.target === $('viewer')) $('viewer').close(); });
$('cams-refresh').addEventListener('click', () => refreshCams(true));

// ---------- the packing list, kept in this browser ----------
const GROUPS = { all: ['全家', 'Everyone'], adults: ['大人', 'Adults'], kids: ['孩子', 'Kids'], car: ['车里', 'In the car'], mine: ['我加的', 'Added'] };
const WHERE = { home: ['家里', 'Home'], car: ['车上', 'Car'], there: ['山上', 'Up there'] };
function defaultList() {
  let n = 0;
  return PACKING.flatMap((g) => g.items.map(([text, where]) => ({ id: 'd' + (n++), group: g.group, text, where: where || 'home', done: false })));
}
let pack = (() => { try { const x = JSON.parse(store.get('list') || 'null'); if (x && Array.isArray(x.items)) return x.items; } catch (e) {} return defaultList(); })();
const savePack = () => store.set('list', JSON.stringify({ v: 1, items: pack }));
const itemText = (it) => (Array.isArray(it.text) ? P(it.text) : String(it.text || ''));
function renderPack() {
  const box = $('pack');
  const shown = pack.filter((it) => state.kids || it.group !== 'kids');
  const done = shown.filter((it) => it.done).length;
  const groups = Object.keys(GROUPS).map((g) => ({ g, items: shown.filter((it) => it.group === g) })).filter((x) => x.items.length);
  const input = h('input', { type: 'text', maxlength: '80', placeholder: L('还缺什么？比如：雪镜防雾布', 'Something missing? e.g. an anti-fog cloth'), 'aria-label': L('加一样东西', 'Add an item') });
  const sel = h('select', { 'aria-label': L('放进哪一组', 'Group') }, Object.entries(GROUPS).filter(([k]) => k !== 'mine' && (state.kids || k !== 'kids')).map(([k, w]) => h('option', { value: k, text: P(w) })));
  const add = (ev) => { ev.preventDefault(); const t = input.value.trim(); if (!t) return; pack.push({ id: 'u' + Date.now().toString(36), group: sel.value, text: t, where: 'home', done: false }); savePack(); renderPack(); $('pack').querySelector('input[type=text]').focus(); };
  fill(box,
    h('p', { class: 'note', text: L('出门前对着这张单子装车：装好了就勾掉；「放在」记的是这件东西平时在哪边（家里、车上，还是已经放在山上的住处或储物柜），在山上已经有的，就不用从家里带。单子存在这个浏览器里，可以随手加减。', 'Pack the car against this list and tick things off. “Kept” is where each thing usually is: at home, in the car, or already up at the mountain in a cabin or locker, in which case it needn’t come from home. The list stays in this browser; add and remove as you like.') }),
    h('div', { class: 'pack-h' }, h('b', { text: L(`已装好 ${done} / ${shown.length}`, `Packed ${done} of ${shown.length}`) }),
      h('div', { class: 'links' },
        h('label', { class: 'switch' }, h('input', { type: 'checkbox', checked: state.kids, onchange: (ev) => setKids(ev.target.checked) }), h('span', { text: L('带娃', 'Kids') })),
        h('button', { class: 'btn', type: 'button', text: L('全部清零（下趟用）', 'Untick all (next trip)'), onclick: () => { pack.forEach((it) => { it.done = false; }); savePack(); renderPack(); } }))),
    h('div', { class: 'progress', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(shown.length), 'aria-valuenow': String(done) }, h('i', { style: `width:${shown.length ? (100 * done / shown.length).toFixed(1) : 0}%` })),
    groups.map(({ g, items }) => [h('div', { class: 'group-name', text: P(GROUPS[g]) }), h('ul', { class: 'items' }, items.map((it) => {
      const id = 'it-' + it.id;
      return h('li', { class: it.done ? 'done' : null },
        h('input', { type: 'checkbox', id, checked: it.done, onchange: (ev) => { it.done = ev.target.checked; savePack(); renderPack(); } }),
        h('label', { class: 'txt', for: id, text: itemText(it) }),
        h('button', { class: 'del', type: 'button', 'aria-label': L(`删掉 ${itemText(it)}`, `Remove ${itemText(it)}`), text: '×', onclick: () => { pack = pack.filter((x) => x !== it); savePack(); renderPack(); } }),
        h('div', { class: 'where' }, L('放在', 'Kept'), Object.entries(WHERE).map(([k, w]) => h('button', { type: 'button', 'aria-pressed': String(it.where === k), text: P(w), onclick: () => { it.where = k; savePack(); renderPack(); } }))));
    }))]),
    h('form', { class: 'add', onsubmit: add }, input, sel, h('button', { class: 'btn primary', type: 'submit', text: L('加上', 'Add') })),
    h('p', { class: 'small', style: 'margin-top:12px' }, h('a', { href: '#', text: L('换回默认清单', 'Back to the default list'), onclick: (ev) => { ev.preventDefault(); if (confirm(L('换回默认清单？你加的东西会删掉。', 'Go back to the default list? What you added will be removed.'))) { pack = defaultList(); savePack(); renderPack(); } } })));
}

function renderFoot() {
  fill($('foot'),
    h('p', { text: L('数据来源：Open-Meteo（天气、降雪、降雨模型）；NWS 美国国家气象局（警报，和官方网格预报：底下是 NOAA 的 NBM 国家混合模型，含雪线和雪量水量）；Caltrans（链条管制、路况原文、施工封路、摄像头和直播，坐标来自 Caltrans 的官方数据）；CHP（实时事故和封路，就是 QuickMap 的 CHP Incidents 图层的来源）；各雪场官网的摄像头和 Mountain Report。地图 © OpenStreetMap 贡献者。',
      'Sources: Open-Meteo (weather, snow and rain models); the National Weather Service (alerts, and the official forecast grid: NOAA’s National Blend of Models, with the snow level and the snow and water amounts); Caltrans (chain controls, road conditions text, lane closures, cameras and video, placed by Caltrans’ own coordinates); CHP (incidents and closures, the source of QuickMap’s CHP Incidents layer); and each resort’s own cameras and mountain report. Map © OpenStreetMap contributors.') }),
    h('p', { text: L('判决只是把这些数据合在一起看，出发前以 QuickMap、CHP 和雪场 Mountain Report 的实时信息为准。四驱、全驱在链条管制区也必须随车带链条。单位默认公制（°C、cm、km/h），可以在顶上切到英制（°F、英寸、mph）。时间都是太浩湖时间。',
      'The call only puts this data side by side; before you leave, go by QuickMap, CHP and the resort’s own report. In a chain control area even 4WD and AWD must carry chains. Times are Tahoe time.') }),
    h('p', null, h('a', { href: 'https://open-meteo.com/', text: 'Weather data by Open-Meteo.com' }), ' (CC BY 4.0) · ', h('a', { href: 'https://quickmap.dot.ca.gov/', text: 'Caltrans QuickMap' }), ' · ', h('a', { href: '../', text: 'wentaoz.com' })));
}

// ---------- events ----------
function setHash() {
  const q = new URLSearchParams({ r: state.resort });
  if (state.tab !== 'overview') q.set('t', state.tab);
  if (state.from === 'near') q.set('from', 'near');
  history.replaceState(null, '', '#' + q.toString());
}
function setTab(t) { state.tab = t; setHash(); render(); if (t === 'roads' && mapObj) setTimeout(() => mapObj.invalidateSize(), 50); window.scrollTo({ top: Math.min(window.scrollY, $('tabs').offsetTop), behavior: 'auto' }); }
function setKids(on) { state.kids = on; store.set('kids', on ? '1' : '0'); render(); }
for (const b of document.querySelectorAll('[data-lang]')) b.addEventListener('click', () => { state.lang = b.dataset.lang; store.set('lang', state.lang); render(); });
for (const b of document.querySelectorAll('[data-units]')) b.addEventListener('click', () => { state.units = b.dataset.units; store.set('units', state.units); render(); });
$('resort').addEventListener('change', (ev) => { state.resort = ev.target.value; store.set('resort', state.resort); state.hour = null; setHash(); render(); load(false); });
for (const b of $('from').querySelectorAll('button')) b.addEventListener('click', () => { if (state.from === b.dataset.from) return; state.from = b.dataset.from; store.set('from', state.from); setHash(); render(); load(false); });
$('refresh').addEventListener('click', () => load(true));
$('kids').addEventListener('change', (ev) => setKids(ev.target.checked));
const tabKeys = ['overview', 'weather', 'roads', 'pack'];
for (const k of tabKeys) {
  $('tab-' + k).addEventListener('click', () => setTab(k));
  $('tab-' + k).addEventListener('keydown', (ev) => {
    const i = tabKeys.indexOf(k), j = ev.key === 'ArrowRight' ? (i + 1) % 4 : ev.key === 'ArrowLeft' ? (i + 3) % 4 : ev.key === 'Home' ? 0 : ev.key === 'End' ? 3 : -1;
    if (j >= 0) { ev.preventDefault(); setTab(tabKeys[j]); $('tab-' + tabKeys[j]).focus(); }
  });
}
window.addEventListener('hashchange', () => {
  const q = new URLSearchParams(location.hash.slice(1));
  let changed = false;
  if (resortById(q.get('r')) && q.get('r') !== state.resort) { state.resort = q.get('r'); changed = true; }
  const from = q.get('from') === 'near' ? 'near' : 'far'; if (from !== state.from) { state.from = from; changed = true; }
  const t = tabKeys.includes(q.get('t')) ? q.get('t') : 'overview'; state.tab = t;
  render(); if (changed) load(false);
});
// light / dark: follows the system until chosen; the choice is shared with the homepage
const root = document.documentElement, mqDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function showTheme() { const b = $('btn-theme'); b.setAttribute('aria-pressed', isDark() ? 'true' : 'false'); b.textContent = isDark() ? L('浅色', 'Light') : L('深色', 'Dark'); }
$('btn-theme').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark', system = mqDark && mqDark.matches ? 'dark' : 'light';
  if (next === system) root.removeAttribute('data-theme'); else root.setAttribute('data-theme', next);
  try { if (next === system) localStorage.removeItem('wentaoz.theme'); else localStorage.setItem('wentaoz.theme', next); } catch (e) {}
  showTheme(); if (state.tab === 'roads') renderMap();
});
if (mqDark && mqDark.addEventListener) mqDark.addEventListener('change', () => { showTheme(); if (state.tab === 'roads') renderMap(); });
$('btn-theme').hidden = false;

setHash();
render();
load(false);
</script>

<script data-goatcounter="https://wentaoz.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
