# Rebuilds visitors.json, the data behind the visitor map on the homepage, from GoatCounter.
# Needs the repository secret GOATCOUNTER_TOKEN: a GoatCounter API key that can only read statistics.
name: Visitor map

on:
  schedule:
    - cron: '17 6 * * *'   # every day at 06:17 UTC
  workflow_dispatch:        # and on demand, from the Actions tab

permissions:
  contents: write   # commit visitors.json
  pages: write      # ask GitHub Pages to rebuild

concurrency: visitor-map

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the counts from GoatCounter
        run: node .github/scripts/visitors.mjs
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}

      - name: Commit visitors.json if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- visitors.json; then
            echo "visitors.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visitors.json
          git commit -m "Update visitor map data"
          git push
          # A push made with the workflow's own token may not start a Pages build, so request one.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages build request failed; the push may still trigger one"
