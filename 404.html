<style>
/* GitHub Pages serves this file for any missing path, at that path, so every link here is absolute.
   Colours and type follow the homepage. */
:root {
  --bg: #FFFFFF; --ink: #0F1720; --ink-2: #51606F; --rule: #D3D9E0;
  --mark: #3178D3;
  --bare-si: #D9DFEE;    /* the strip's colour at 0 nm: bare silicon */
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "STIX Two Text", "STIXGeneral", Cambria, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0C1218; --ink: #E9EDF2; --ink-2: #9FAAB8; --rule: #28323D; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0C1218; --ink: #E9EDF2; --ink-2: #9FAAB8; --rule: #28323D; color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 1.125rem;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
a {
  color: inherit;
  text-decoration: underline;
  text-decoration-color: var(--mark);
  text-decoration-thickness: 2px;
  text-underline-offset: 0.2em;
}
a:hover { text-decoration-thickness: 3px; }
a:focus-visible { outline: 2px solid var(--mark); outline-offset: 3px; }
.page {
  max-width: 66rem;
  margin-inline: auto;
  padding-inline: clamp(1rem, 5vw, 3.5rem);
  padding-block: clamp(2.5rem, 7vw, 5.5rem) 3.5rem;
  display: grid;
  gap: 1.5rem;
  justify-items: start;
}
.home { font-family: var(--display); font-size: 0.9375rem; font-weight: 650; }
.code {
  margin: 1rem 0 0;
  font-family: var(--display);
  font-stretch: 125%;
  font-weight: 700;
  font-size: clamp(4.5rem, 18vw, 10rem);
  line-height: 0.9;
  letter-spacing: -0.03em;
}
.wafer {
  width: 100%;
  height: clamp(3.5rem, 9vw, 5.5rem);
  background: var(--bare-si);
  box-shadow: 0 0 0 1px var(--rule);
}
.readout { margin: -0.75rem 0 0; font-family: var(--display); font-size: 0.8125rem; font-weight: 500; color: var(--ink-2); }
.lead { margin: 0.5rem 0 0; max-width: 36rem; font-size: clamp(1.25rem, 2.6vw, 1.625rem); line-height: 1.35; }
p { margin: 0; max-width: 40rem; }
</style>
</head>
<body>
<main class="page">
  <a class="home" href="/">Wentao Zhang</a>
  <h1 class="code">404</h1>
  <div class="wafer" aria-hidden="true"></div>
  <p class="readout" aria-hidden="true">0 nm</p>
  <p class="lead">Nothing has been grown here: the wafer is still bare silicon.</p>
  <p>The page you were looking for is not on this site. Try the <a href="/">homepage</a> or <a href="/wine-moon/"><span lang="zh-CN">醉月历</span> Wine Moon</a>.</p>
</main>
</body>
